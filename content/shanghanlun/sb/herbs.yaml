    effects: 清热解毒，利水消肿（今多以连翘代：清热解毒，消肿散结，疏散风热）
    applications: 麻黄连轺赤小豆汤用连轺（连翘之根），与麻黄、杏仁、赤小豆、梓白皮等同用，治伤寒瘀热在里、身必发黄。连翘根今罕用，通行以连翘代之。
