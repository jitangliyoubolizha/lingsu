  - id: SHL.SB.H.006
    name: 葛根
    aliases: []
    category: 解表药
    nature: 甘、辛，凉
    meridians:
      - 脾
      - 胃
      - 肺
    effects: 解肌退热，生津止渴，透疹，升阳止泻，通经活络
    applications: 主治项背强几几，取其升发津液、濡润筋脉（桂枝加葛根汤、葛根汤）；太阳与阳明合病自下利者用葛根汤发表和里；表证未解而挟热下利者用葛根黄芩黄连汤，取其升清止利。
    dosage: 10~15g
    cautions: 表虚多汗者慎用。
    notes: 本草内容初稿待校对。
