    effects: 清热利湿，解毒
    applications: 麻黄连轺赤小豆汤用生梓白皮，与麻黄、连轺、杏仁、赤小豆等同用，治伤寒瘀热在里、身必发黄，取其清利湿热。梓白皮今罕入药，通行以桑白皮代之。
