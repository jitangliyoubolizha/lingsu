# 太阳病上篇相关药物
# 状态：本草卡内容分批补齐中（2026-08 起），待人工校对
# 来源：宋本《伤寒论》药物组成
herbs:
  - id: SHL.SB.H.001
    name: 桂枝
    aliases:
      - 桂
    category: 解表药
    nature: 辛、甘，温
    meridians:
      - 心
      - 肺
      - 膀胱
    effects: 发汗解肌，温通经脉，助阳化气，平冲降气
    applications: 经方中应用最广的一味药。解肌和营，与芍药相配为桂枝汤调和营卫之本；配麻黄则发汗解表（麻黄汤）。温通心阳如桂枝甘草汤，温化水饮如苓桂术甘汤，平冲降逆如桂枝加桂汤治奔豚；又广泛用于温经散寒、活血通脉诸方。
    dosage: 3~10g
    cautions: 辛温助热，易伤阴动血。温热病及阴虚阳盛、血热妄行者忌用；孕妇及月经过多者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.002
    name: 芍药
    aliases: []
    category: 补虚药
    nature: 苦、酸，微寒
    meridians:
      - 肝
      - 脾
    effects: 养血调经，敛阴止汗，柔肝止痛，平抑肝阳
    applications: 仲景芍药主止痛与拘挛。桂枝汤以芍药配桂枝和营卫；芍药甘草汤治脚挛急；小建中汤倍芍药治腹中急痛；真武汤、附子汤用芍药缓急止痛；黄芩汤以之治热利腹痛。经方芍药赤白之分，注家多谓宋以前未严别。
    dosage: 6~15g
    cautions: 不宜与藜芦同用；阳衰虚寒之证不宜单独使用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.003
    name: 甘草
    aliases: []
    category: 补虚药
    nature: 甘，平
    meridians:
      - 心
      - 肺
      - 脾
      - 胃
    effects: 补脾益气，清热解毒，祛痰止咳，缓急止痛，调和诸药
    applications: 仲景方用甘草最广。炙甘草汤重用炙甘草治脉结代、心动悸；芍药甘草汤缓急止痛；甘草汤、桔梗汤治咽痛；甘草泻心汤治心下痞硬；诸方用之以调和药性、护中解毒。炙用偏温补，生用偏清泄。
    dosage: 2~10g
    cautions: 不宜与海藻、大戟、甘遂、芫花同用；湿盛胀满、水肿者不宜久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.004
    name: 生姜
    aliases: []
    category: 解表药
    nature: 辛，微温
    meridians:
      - 肺
      - 脾
      - 胃
    effects: 解表散寒，温中止呕，化痰止咳，解鱼蟹毒
    applications: 辛温宣散，走而不守。桂枝汤类方必以生姜配大枣调和营卫；胃不和而呕逆者取其止呕（小半夏汤即半夏、生姜二味）；生姜泻心汤用之和胃散水。经方另以干姜专温中焦，生姜与干姜各有分工。
    dosage: 3~10g
    cautions: 助火伤阴，阴虚内热及热盛者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.005
    name: 大枣
    aliases: []
    category: 补虚药
    nature: 甘，温
    meridians:
      - 脾
      - 胃
      - 心
    effects: 补中益气，养血安神
    applications: 补脾和营。桂枝汤类方生姜大枣相配调和营卫；十枣汤、葶苈大枣泻肺汤以肥枣十枚/十二枚煎汤送服峻药，顾护脾胃；小柴胡汤等诸和剂皆有之；《金匮》甘麦大枣汤治脏躁。经方大枣皆「擘」用。
    dosage: 3~10 枚（擘用）
    cautions: 湿盛脘腹胀满、痰热咳嗽者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.006
    name: 葛根
    aliases: []
    category: 解表药
    nature: 甘、辛，凉
    meridians:
      - 脾
      - 胃
      - 肺
    effects: 解肌退热，生津止渴，透疹，升阳止泻，通经活络
    applications: 主治项背强几几，取其升发津液、濡润筋脉（桂枝加葛根汤、葛根汤）；太阳与阳明合病自下利者用葛根汤发表和里；表证未解而挟热下利者用葛根黄芩黄连汤，取其升清止利。
    dosage: 10~15g
    cautions: 表虚多汗者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.007
    name: 厚朴
    aliases: []
    category: 化湿药
    nature: 苦、辛，温
    meridians:
      - 脾
      - 胃
      - 肺
      - 大肠
    effects: 燥湿消痰，下气除满
    applications: 行气消胀要药。经方主用于腹满：厚朴生姜半夏甘草人参汤治发汗后腹胀满；栀子厚朴汤治心烦腹满、卧起不安；小承气汤、大承气汤以之配枳实、大黄攻下除满；《金匮》厚朴麻黄汤、半夏厚朴汤治咳喘与梅核气。
    dosage: 3~10g
    cautions: 辛温行散，气虚津亏者慎用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.008
    name: 杏仁
    aliases: []
    category: 化痰止咳平喘药
    nature: 苦，微温；有小毒
    meridians:
      - 肺
      - 大肠
    effects: 降气止咳平喘，润肠通便
    applications: 宣降肺气要药。麻黄汤、桂枝加厚朴杏子汤以之配麻黄、桂枝发汗定喘；麻杏石甘汤配石膏清肺平喘；大陷胸丸、麻子仁丸取其质润下降。经方用量多以「五十个」「七十个」计数。
    dosage: 5~10g（打碎入煎）
    cautions: 有小毒，用量不宜过大；婴儿慎用；阴虚咳喘、大便溏泄者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.009
    name: 附子
    aliases: []
    category: 温里药
    nature: 辛、甘，大热；有毒
    meridians:
      - 心
      - 肾
      - 脾
    effects: 回阳救逆，补火助阳，散寒止痛
    applications: 回阳救逆第一要药。四逆汤配干姜、甘草治少阴病四肢厥逆、脉微细；真武汤配茯苓、白术、芍药温阳利水；桂枝附子汤、甘草附子汤散寒除湿止痛；麻黄细辛附子汤温经发表。经方回阳用生附子，止痛助阳用炮附子，煎法各有法度。
    dosage: 3~15g（先煎，久煎）
    cautions: 有毒，须炮制并先煎久煎；阴虚阳亢、真热假寒者忌用；孕妇忌用；不宜与半夏、瓜蒌、贝母、白蔹、白及同用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.010
    name: 麻黄
    aliases: []
    category: 解表药
    nature: 辛、微苦，温
    meridians:
      - 肺
      - 膀胱
    effects: 发汗解表，宣肺平喘，利水消肿
    applications: 发汗解表、宣肺平喘之要药。表实无汗者与桂枝相须为用（麻黄汤）；肺闭喘咳者配杏仁、甘草；寒饮咳喘者配细辛、干姜、五味子（小青龙汤）；风水一身尽肿者配石膏、生姜（越婢汤）。生用发汗力峻，炙用偏于宣肺平喘。
    dosage: 2~10g
    cautions: 发汗力强，表虚自汗、阴虚盗汗及虚喘者慎用；高血压、心律不齐者慎用；不宜过量久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.011
    name: 石膏
    aliases: []
    category: 清热药
    nature: 甘、辛，大寒
    meridians:
      - 肺
      - 胃
    effects: 清热泻火，除烦止渴；煅用外用敛疮
    applications: 清阳明气分大热之主药。白虎汤配知母治大热、大汗、大渴、脉洪大；麻杏石甘汤配麻黄清宣肺热，治汗出而喘；越婢汤治风水挟热。性虽大寒，配伍得宜则不碍透解。
    dosage: 15~60g（打碎先煎）
    cautions: 脾胃虚寒及血虚、阴虚发热者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.012
    name: 知母
    aliases: []
    category: 清热药
    nature: 苦、甘，寒
    meridians:
      - 肺
      - 胃
      - 肾
    effects: 清热泻火，滋阴润燥
    applications: 白虎汤中配石膏清热生津、除烦止渴；酸枣仁汤配酸枣仁治虚烦不眠；百合知母汤治百合病发汗后心烦。质润，清热之中兼能养阴。
    dosage: 6~12g
    cautions: 性寒质滑，脾胃虚寒、大便溏泄者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.013
    name: 人参
    aliases: []
    category: 补虚药
    nature: 甘、微苦，平
    meridians:
      - 肺
      - 脾
      - 心
    effects: 大补元气，复脉固脱，补脾益肺，生津养血，安神益智
    applications: 救虚生津。白虎加人参汤治大汗大渴、脉洪大；理中丸治中焦虚寒；四逆加人参汤救利止亡血；小柴胡汤加减「若渴，去半夏，加人参合前成四两半」；炙甘草汤、旋覆代赭汤、黄连汤皆取其扶正和中。
    dosage: 3~9g（另煎兑服）
    cautions: 不宜与藜芦同用；实证、热证而正气不虚者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.014
    name: 粳米
    aliases: []
    category: 经方特殊用品
    nature: 甘，平
    meridians:
      - 脾
      - 胃
    effects: 益气健脾，和胃养阴
    applications: 经方以粳米护胃和中：白虎汤、白虎加人参汤用之助石膏和胃护津；桃花汤用之涩肠养胃；《金匮》附子粳米汤治腹中寒气、雷鸣切痛。米熟汤成，取其谷气调和。
    dosage: 9~30g（经方六味至一升）
    cautions: 无特殊禁忌。
    notes: 食物料而非专药，原书以之护中和胃。本草内容初稿待校对。
  - id: SHL.SB.H.015
    name: 茯苓
    aliases: []
    category: 利水渗湿药
    nature: 甘、淡，平
    meridians:
      - 心
      - 脾
      - 肾
    effects: 利水消肿，渗湿，健脾，宁心
    applications: 经方利水第一要药。五苓散配猪苓、泽泻、白术、桂枝化气行水；苓桂术甘汤治痰饮头眩心悸；小柴胡汤加减「若心下悸、小便不利者，去黄芩加茯苓四两」；又见于苓桂枣甘汤、真武汤、酸枣仁汤（取其宁心安神）诸方。
    dosage: 9~15g
    cautions: 虚寒精滑者忌服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.016
    name: 白术
    aliases: []
    category: 补虚药
    nature: 苦、甘，温
    meridians:
      - 脾
      - 胃
    effects: 健脾益气，燥湿利水，止汗，安胎
    applications: 健脾燥湿主药。苓桂术甘汤、五苓散以白术配茯苓治水饮内停；真武汤配附子温阳健脾利水；桂枝附子去桂加白术汤治风湿相搏、大便硬、小便自利者；《金匮》枳术汤治心下坚大如盘。
    dosage: 6~12g
    cautions: 阴虚内热、津液亏耗者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.017
    name: 干姜
    aliases: []
    category: 温里药
    nature: 辛，热
    meridians:
      - 脾
      - 胃
      - 肾
      - 心
      - 肺
    effects: 温中散寒，回阳通脉，温肺化饮
    applications: 温中散寒主药。理中丸（汤）配人参、白术、甘草温中焦虚寒；四逆汤配附子回阳救逆；小青龙汤配细辛、五味子温肺化饮；甘草干姜汤治肺痿吐涎沫；诸泻心汤以之配黄连辛开苦降消痞。
    dosage: 3~10g
    cautions: 阴虚内热、血热妄行者忌用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.018
    name: 大黄
    aliases: []
    category: 泻下药
    nature: 苦，寒
    meridians:
      - 脾
      - 胃
      - 大肠
      - 肝
      - 心包
    effects: 泻下攻积，清热泻火，凉血解毒，逐瘀通经
    applications: 经方应用极广。攻下燥结有大小承气汤、调胃承气汤；泄热消痞有大黄黄连泻心汤；逐瘀有桃核承气汤、抵当汤、下瘀血汤；退黄有茵陈蒿汤；《金匮》大黄牡丹汤治肠痈。泻下宜后下、气锐，攻瘀可同煎、力缓，仲景各有法度。
    dosage: 3~15g
    cautions: 峻烈攻下，非里实之证不宜；孕妇、经期、哺乳期慎用或忌用；脾胃虚寒者慎用；不宜久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.019
    name: 芒硝
    aliases: []
    category: 泻下药
    nature: 咸、苦，寒
    meridians:
      - 胃
      - 大肠
    effects: 泻下通便，润燥软坚，清火消肿
    applications: 咸寒软坚。调胃承气汤、大承气汤以之润燥软坚、通导燥屎；大陷胸汤配甘遂、大黄治水热互结之结胸；桃核承气汤助大黄破瘀泄热。多不入煎，冲入药汁内溶化服。
    dosage: 6~12g（冲服）
    cautions: 孕妇忌用；不宜与硫黄、三棱同用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.020
    name: 半夏
    aliases: []
    category: 化痰止咳平喘药
    nature: 辛，温；有毒
    meridians:
      - 脾
      - 胃
      - 肺
    effects: 燥湿化痰，降逆止呕，消痞散结
    applications: 仲景用半夏诸方最多，主呕逆与痞。小半夏汤（半夏、生姜）为诸呕吐基础方；半夏泻心汤、生姜泻心汤、甘草泻心汤以半夏辛开消痞；小柴胡汤加减「若渴，去半夏」可知不渴者主用；《金匮》半夏厚朴汤治梅核气。经方皆用洗去滑之制半夏。
    dosage: 3~9g（内服须制用）
    cautions: 有毒，内服须炮制；不宜与乌头类同用；阴虚燥咳、血证及热痰者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.021
    name: 黄芩
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 肺
      - 胆
      - 脾
      - 大肠
      - 小肠
    effects: 清热燥湿，泻火解毒，止血，安胎
    applications: 和解清里之品。小柴胡汤以之配柴胡清半里之热；黄芩汤治太阳与少阳合病自下利，为后世治热利之祖方；黄连阿胶汤用其清心火；《金匮》泻心汤三黄合用治吐衄。
    dosage: 3~10g
    cautions: 苦寒伤胃，脾胃虚寒、食少便溏者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.022
    name: 黄连
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 心
      - 脾
      - 胃
      - 肝
      - 胆
      - 大肠
    effects: 清热燥湿，泻火解毒
    applications: 主心下痞与热利。大黄黄连泻心汤治心下痞、按之濡、其脉关上浮；葛根黄芩黄连汤治挟热下利；黄连汤治腹中痛、欲呕吐；黄连阿胶汤治少阴心烦不得卧；乌梅丸用之苦寒清热安蛔。
    dosage: 2~5g
    cautions: 苦寒败胃，脾胃虚寒者忌用；阴虚津伤者慎用；不宜过量久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.023
    name: 柴胡
    aliases: []
    category: 解表药
    nature: 辛、苦，微寒
    meridians:
      - 肝
      - 胆
      - 肺
    effects: 疏散退热，疏肝解郁，升举阳气
    applications: 和解少阳主药。小柴胡汤以之配黄芩，治往来寒热、胸胁苦满、默默不欲饮食；四逆散用其透解郁热、疏畅气机；柴胡加龙骨牡蛎汤诸方亦以柴胡领衔。仲景柴胡类方中柴胡用量独重，为其用药特色。
    dosage: 3~10g
    cautions: 性升散，古人有「劫肝阴」之戒，肝阳上亢、阴虚火旺者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.024
    name: 细辛
    aliases: []
    category: 解表药
    nature: 辛，温
    meridians:
      - 心
      - 肺
      - 肾
    effects: 解表散寒，祛风止痛，通窍，温肺化饮
    applications: 温化寒饮、通达表里。小青龙汤以之配干姜、五味子治咳而微喘、痰多清稀；麻黄细辛附子汤助附子、麻黄温经发表，治少阴病初起反发热；大黄附子汤取其散寒止痛。
    dosage: 1~3g
    cautions: 有小毒，用量宜轻；不宜与藜芦同用；阴虚阳亢头痛、肺燥干咳者忌用；气虚多汗者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.025
    name: 五味子
    aliases: []
    category: 收涩药
    nature: 酸、甘，温
    meridians:
      - 肺
      - 心
      - 肾
    effects: 收敛固涩，益气生津，补肾宁心
    applications: 小青龙汤以五味子配干姜、细辛，敛肺止咳，防辛散太过；四逆散加减「咳者，加五味子、干姜各五分」；苓桂五味甘草汤治服小青龙后冲气上逆、咳逆。经方凡见咳者多姜、辛、味同用，为其配伍法度。
    dosage: 2~6g
    cautions: 表邪未解、内有实热、咳嗽初起者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.026
    name: 甘遂
    aliases: []
    category: 泻下药
    nature: 苦，寒；有毒
    meridians:
      - 肺
      - 肾
      - 大肠
    effects: 泻水逐饮，消肿散结
    applications: 峻下逐水。大陷胸汤以之为君，为末冲服，治水热互结、从心下至少腹硬满而痛不可近者；十枣汤以甘遂、芫花、大戟等分为散，肥枣煎汤送服，治悬饮；甘遂半夏汤治留饮欲去。
    dosage: 0.5~1g（入丸散，原方为末冲服）
    cautions: 有毒，峻泻易伤正气，体虚者慎用；孕妇忌用；不宜与甘草同用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.027
    name: 葶苈子
    aliases: []
    category: 化痰止咳平喘药
    nature: 辛、苦，大寒
    meridians:
      - 肺
      - 膀胱
    effects: 泻肺平喘，行水消肿
    applications: 泻肺水峻药。葶苈大枣泻肺汤治肺痈喘不得卧及支饮不得息——葶苈熬令黄色、捣丸如弹子大，以大枣十二枚煎汤送服，峻药缓攻；己椒苈黄丸治肠间有水气；大陷胸丸亦用之。
    dosage: 3~10g（包煎）
    cautions: 泻肺力猛，肺虚喘咳、脾虚肿满者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.028
    name: 枳实
    aliases: []
    category: 理气药
    nature: 苦、辛、酸，微寒
    meridians:
      - 脾
      - 胃
    effects: 破气消积，化痰散痞
    applications: 破气消痞。大承气汤、小承气汤以枳实配厚朴助大黄攻下燥结；枳实栀子豉汤治大病瘥后劳复、心烦懊憹；《金匮》枳实薤白桂枝汤治胸痹心中痞、气结在胸。
    dosage: 3~10g
    cautions: 孕妇慎用；脾胃虚弱而无积滞者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.029
    name: 瓜蒌实
    aliases:
      - 栝楼实
    category: 化痰止咳平喘药
    nature: 甘、微苦，寒
    meridians:
      - 肺
      - 胃
      - 大肠
    effects: 清热涤痰，宽胸散结，润燥滑肠
    applications: 小陷胸汤以栝蒌实配黄连、半夏治小结胸病——正在心下、按之则痛、脉浮滑，取其清热涤痰开结；《金匮》胸痹诸方（瓜蒌薤白白酒汤、瓜蒌薤白半夏汤）以之配薤白通阳宽胸。仲景用栝蒌实皆全果连皮仁。
    dosage: 9~15g
    cautions: 不宜与乌头类同用；脾虚便溏及寒痰者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.030
    name: 文蛤
    aliases: []
    category: 化痰止咳平喘药
    nature: 咸，寒
    meridians:
      - 肺
      - 胃
    effects: 清热化痰，软坚散结，生津止渴
    applications: 文蛤散单味为散，治渴欲饮水不止者，以沸汤和服方寸匕。文蛤所指（海蛤抑或五倍子）历代注家有争，今多从海蛤之说。
    dosage: 6~15g（蛤粉包煎）
    cautions: 脾胃虚寒者慎用。
    notes: 文蛤所指历来有海蛤、五倍子之争，本草卡按海蛤壳通行口径编写，待核对。本草内容初稿待校对。
  - id: SHL.SB.H.031
    name: 猪苓
    aliases: []
    category: 利水渗湿药
    nature: 甘、淡，平
    meridians:
      - 肾
      - 膀胱
    effects: 利水渗湿
    applications: 专主利水，淡渗之力强于茯苓而无补性。五苓散与茯苓、泽泻、白术同用治小便不利、微热消渴；猪苓汤治水热互结伤阴——渴欲饮水、小便不利、心烦不得眠，配阿胶、滑石利水而不伤阴。
    dosage: 6~12g
    cautions: 利水伤阴，无水湿者及阴虚津亏者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.032
    name: 泽泻
    aliases: []
    category: 利水渗湿药
    nature: 甘、淡，寒
    meridians:
      - 肾
      - 膀胱
    effects: 利水渗湿，泄热，化浊降脂
    applications: 五苓散以泽泻为君，配茯苓、猪苓、白术、桂枝治水蓄下焦——渴欲饮水、小便不利；猪苓汤治水热伤阴；《金匮》泽泻汤治心下有支饮、其人苦冒眩；肾气丸用之泻水中之浊而护真阴。
    dosage: 6~10g
    cautions: 肾虚精滑无湿热者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.033
    name: 桔梗
    aliases: []
    category: 化痰止咳平喘药
    nature: 苦、辛，平
    meridians:
      - 肺
    effects: 宣肺，利咽，祛痰，排脓
    applications: 开宣肺气、载药上行。桔梗汤（桔梗一两、甘草二两）治少阴病二三日咽痛，取其清利咽喉；三物白散以桔梗配巴豆、贝母治寒实结胸，取其开肺散邪；《金匮》桔梗汤重用治肺痈咳而胸满、吐脓如米粥。后世誉为「诸药之舟楫」。
    dosage: 3~10g
    cautions: 性升散，呕吐、呛咳、眩晕及阴虚火旺咳血者不宜；用量过大易致恶心。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.034
    name: 贝母
    aliases: []
    category: 化痰止咳平喘药
    nature: 苦、甘，微寒
    meridians:
      - 肺
      - 心
    effects: 清热润肺，化痰止咳，散结消痈
    applications: 经方两见。三物白散以贝母配巴豆、桔梗治寒实结胸，取其涤痰散结；《金匮》当归贝母苦参丸治妊娠小便难。仲景所用贝母品种（川贝/浙贝之别）历来有考辨。
    dosage: 3~10g（川贝研粉冲服每次 1~2g）
    cautions: 不宜与乌头类同用；寒痰湿痰者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.035
    name: 巴豆
    aliases: []
    category: 泻下药
    nature: 辛，热；有大毒
    meridians:
      - 胃
      - 大肠
    effects: 峻下冷积，逐水退肿，豁痰利咽，蚀疮
    applications: 大辛大热，攻逐寒积。三物白散以巴豆配桔梗、贝母治寒实结胸、无热证者，病在膈上者可吐、在膈下者可利。经方皆熬黑、去油用之，即后世所称巴豆霜。
    dosage: 0.1~0.3g（制霜入丸散）
    cautions: 有大毒，须去油制霜用；孕妇、体弱者忌用；畏牵牛子；古法服后泻利不止者以冷粥解之。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.036
    name: 栝楼根
    aliases:
      - 瓜蒌根
      - 天花粉
    category: 清热药
    nature: 甘、微苦，微寒
    meridians:
      - 肺
      - 胃
    effects: 清热泻火，生津止渴，消肿排脓
    applications: 生津止渴要药。小柴胡汤加减法「若渴，去半夏，加栝楼根四两」；柴胡去半夏加栝蒌汤治疟病发渴；栝蒌瞿麦丸治下焦虚寒而口渴；栝蒌桂枝汤治柔痉，取其滋养津液。
    dosage: 10~15g
    cautions: 不宜与乌头类同用；脾胃虚寒便溏者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.037
    name: 牡蛎
    aliases: []
    category: 平肝息风药
    nature: 咸，微寒
    meridians:
      - 肝
      - 胆
      - 肾
    effects: 重镇安神，潜阳补阴，软坚散结；煅用收敛固涩
    applications: 与龙骨相须治惊狂烦悸。桂枝去芍药加蜀漆牡蛎龙骨救逆汤治火逆惊狂、卧起不安；柴胡加龙骨牡蛎汤治胸满烦惊；桂枝甘草龙骨牡蛎汤治烦躁；牡蛎泽泻散治瘥后水气；小柴胡汤加减「胁下痞硬，去大枣加牡蛎四两」。仲景牡蛎皆「熬」用（即今之煅）。
    dosage: 9~30g（打碎先煎）
    cautions: 虚寒证慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.038
    name: 栀子
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 心
      - 肺
      - 三焦
    effects: 泻火除烦，清热利湿，凉血解毒
    applications: 清宣郁热。栀子豉汤治虚烦不得眠、心中懊憹；栀子厚朴汤治心烦腹满、卧起不安；茵陈蒿汤配茵陈、大黄治阳黄身热，取其清热利湿。
    dosage: 6~10g
    cautions: 苦寒伤胃，脾虚便溏者不宜；原书明言「病人旧微溏者，不可与服之」。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.039
    name: 淡豆豉
    aliases:
      - 香豉
    category: 解表药
    nature: 苦、辛，凉
    meridians:
      - 肺
      - 胃
    effects: 解表，除烦，宣发郁热
    applications: 与栀子相伍为栀子豉汤，清宣胸膈郁热，治虚烦不得眠、心中懊憹、反复颠倒；栀子甘草豉汤、栀子生姜豉汤皆由其化裁。
    dosage: 6~12g
    cautions: 制法不同则性味有偏；胃虚易泛恶者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.040
    name: 禹余粮
    aliases: []
    category: 收涩药
    nature: 甘、涩，微寒
    meridians:
      - 胃
      - 大肠
    effects: 涩肠止泻，收敛止血，止带
    applications: 赤石脂禹余粮汤以之配赤石脂，治伤寒服汤药后下利不止、医以理中与之利益甚——此利在下焦，取其涩肠固脱。
    dosage: 9~15g（打碎先煎）
    cautions: 湿热积滞之泻痢者忌用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.041
    name: 胶饴
    aliases:
      - 饴糖
    category: 补虚药
    nature: 甘，温
    meridians:
      - 脾
      - 胃
      - 肺
    effects: 补中益气，缓急止痛，润肺止咳
    applications: 建中诸方君药。小建中汤以胶饴一升配桂枝、芍药、姜、枣，治腹中急痛、心中悸而烦；大建中汤治心胸中大寒痛；黄芪建中汤治虚劳里急诸不足。饴糖以甘温补中、缓急见长。
    dosage: 15~30g（烊化冲服）
    cautions: 湿热内郁、中满吐逆者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.042
    name: 桃仁
    aliases: []
    category: 活血化瘀药
    nature: 苦、甘，平；有小毒
    meridians:
      - 心
      - 肝
      - 大肠
    effects: 活血祛瘀，润肠通便，止咳平喘
    applications: 经方逐瘀代表药。太阳蓄血、少腹急结者用桃核承气汤；其人发狂、少腹硬满者用抵当汤、抵当丸（配水蛭、虻虫）；《金匮》下瘀血汤治产后腹痛，大黄牡丹汤治肠痈。经方桃仁多「去皮尖」用。
    dosage: 5~10g（打碎入煎）
    cautions: 有小毒，孕妇忌用；便溏者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.043
    name: 龙骨
    aliases: []
    category: 安神药
    nature: 甘、涩，平
    meridians:
      - 心
      - 肝
      - 肾
    effects: 镇惊安神，平肝潜阳，收敛固涩
    applications: 与牡蛎相须治烦躁惊狂。桂枝甘草龙骨牡蛎汤治火逆烦躁；桂枝加龙骨牡蛎汤（《金匮》）治男子失精、女子梦交；柴胡加龙骨牡蛎汤治胸满烦惊；《金匮》风引汤除热瘫痫。安神潜阳生用，固涩煅用。
    dosage: 15~30g（打碎先煎）
    cautions: 湿热实邪者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.044
    name: 铅丹
    aliases: []
    category: 拔毒化腐生肌药
    nature: 辛，微寒；有毒
    meridians:
      - 心
      - 肝
    effects: 拔毒生肌，杀虫止痒，重镇安神
    applications: 柴胡加龙骨牡蛎汤原方用铅丹，治伤寒下后胸满烦惊、小便不利，取其重镇；今因其毒性，通行以磁石、生铁落或重用龙骨、牡蛎代之。
    dosage: 外用适量；内服仅存于经方原方，今多以他药代之
    cautions: 有毒，不可过量久服；外用亦不宜大面积长期使用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.045
    name: 蜀漆
    aliases: []
    category: 涌吐药
    nature: 苦、辛，温；有毒
    meridians:
      - 肝
      - 心包
    effects: 涌吐痰涎，截疟
    applications: 蜀漆即常山之苗。桂枝去芍药加蜀漆牡蛎龙骨救逆汤治火邪惊狂、卧起不安，取其涤除痰浊；牡蛎泽泻散用之逐水饮；《金匮》蜀漆散治牝疟多寒者。经方蜀漆皆「洗去腥」、先煎久煮以缓其悍。
    dosage: 3~6g（先煎久煮）
    cautions: 有毒，正气虚者忌用；用量不宜过大。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.046
    name: 水蛭
    aliases: []
    category: 活血化瘀药
    nature: 咸、苦，平；有小毒
    meridians:
      - 肝
    effects: 破血逐瘀，通经消癥
    applications: 破血峻品。抵当汤、抵当丸以水蛭配虻虫、桃仁、大黄，治太阳蓄血、其人发狂、少腹硬满、小便自利者。经方水蛭「熬」用，即今之炒制。
    dosage: 1~3g（经方以枚数计，熬用）
    cautions: 破血力峻，孕妇及体虚无瘀者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.047
    name: 虻虫
    aliases: []
    category: 活血化瘀药
    nature: 苦，微寒；有小毒
    meridians:
      - 肝
    effects: 破血逐瘀，通经消癥
    applications: 与水蛭同入抵当汤、抵当丸，破蓄血之坚结；《金匮》大黄䗪虫丸亦用之。经方虻虫「熬，去翅足」用。
    dosage: 1~1.5g（经方以枚数计，熬去翅足）
    cautions: 破血力峻，孕妇及体虚无瘀者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.048
    name: 芫花
    aliases: []
    category: 泻下药
    nature: 苦、辛，温；有毒
    meridians:
      - 肺
      - 脾
      - 肾
    effects: 泻水逐饮，祛痰止咳，杀虫疗疮
    applications: 十枣汤组成之一，善逐胸胁之水，兼能祛痰止咳，故悬饮咳唾、胸胁引痛者用之。以肥枣十枚煎汤送服，意在顾护脾胃、缓诸药之毒。
    dosage: 0.6~0.9g（醋制，入丸散）
    cautions: 有毒，须醋制减毒；体虚及孕妇忌用；不宜与甘草同用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.049
    name: 大戟
    aliases: []
    category: 泻下药
    nature: 苦，寒；有毒
    meridians:
      - 肺
      - 脾
      - 肾
    effects: 泻水逐饮，消肿散结
    applications: 十枣汤三峻药之一，逐脏腑胸胁之水饮。经方少单用，后世多外用消肿散结。
    dosage: 1.5~3g；入丸散每次约 1g
    cautions: 有毒，体虚及孕妇忌用；不宜与甘草同用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.050
    name: 旋覆花
    aliases: []
    category: 化痰止咳平喘药
    nature: 苦、辛、咸，微温
    meridians:
      - 肺
      - 脾
      - 胃
      - 大肠
    effects: 降气，消痰，行水，止呕
    applications: 旋覆代赭汤以旋覆花配代赭石、人参、生姜、半夏、甘草，治伤寒汗吐下解后心下痞硬、噫气不除，取其下气消痰；《金匮》旋覆花汤配葱、新绛治肝着。
    dosage: 3~9g（包煎）
    cautions: 阴虚劳嗽、津伤燥咳者忌用；绒毛刺激咽喉易致呕呛，须布包入煎。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.051
    name: 代赭
    aliases:
      - 代赭石
    category: 平肝息风药
    nature: 苦，寒
    meridians:
      - 肝
      - 心
      - 肺
      - 胃
    effects: 平肝潜阳，重镇降逆，凉血止血
    applications: 旋覆代赭汤以代赭石配旋覆花、人参、生姜、半夏，治心下痞硬、噫气不除，取其重镇降逆；《金匮》滑石代赭汤治百合病误下后诸证。
    dosage: 9~30g（打碎先煎）
    cautions: 孕妇慎用；虚寒证不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.052
    name: 赤石脂
    aliases: []
    category: 收涩药
    nature: 甘、酸、涩，温
    meridians:
      - 大肠
      - 胃
    effects: 涩肠止泻，收敛止血，生肌敛疮
    applications: 桃花汤以赤石脂一斤配干姜、粳米，治少阴病下利便脓血，取其涩肠固脱；赤石脂禹余粮汤治下利不止、利在下焦者。桃花汤方后注「一半全用，一半筛末」，冲服取其留着肠中。
    dosage: 9~12g（先煎）
    cautions: 湿热积滞之泻痢初起者忌用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.053
    name: 瓜蒂
    aliases: []
    category: 涌吐药
    nature: 苦，寒；有毒
    meridians:
      - 胃
    effects: 涌吐痰食，祛湿退黄
    applications: 瓜蒂散以瓜蒂、赤小豆等分为散，香豉煎汤合调服，治痰饮食停于胸中——病如桂枝证、头不痛、项不强、寸脉微浮、胸中痞硬、气上冲咽喉不得息，此为胸有寒，当吐之。
    dosage: 0.3~1g（经方为散一分，急者温汤含服即吐）
    cautions: 有毒，体虚、失血及上焦无实邪者忌用；古法吐不止者以葱白汤解之。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.054
    name: 赤小豆
    aliases: []
    category: 利水渗湿药
    nature: 甘、酸，平
    meridians:
      - 心
      - 小肠
    effects: 利水消肿，解毒排脓
    applications: 经方两见。麻黄连轺赤小豆汤以之清利湿热，配麻黄、连轺、梓白皮治瘀热在里之发黄；瓜蒂散以赤小豆与瓜蒂等分为散，取其酸苦涌泄，助瓜蒂吐胸中实邪。
    dosage: 9~30g
    cautions: 阴津不足者不宜久服（古有久食令人枯瘦之说）。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.055
    name: 生地黄
    aliases: []
    category: 清热药
    nature: 甘、苦，寒
    meridians:
      - 心
      - 肝
      - 肾
    effects: 清热凉血，养阴生津
    applications: 炙甘草汤重用生地黄滋阴养血，治伤寒脉结代、心动悸；百合地黄汤以生地黄汁治百合病、不经吐下发汗者。原文所用地黄鲜干之别，历代注家有考辨。
    dosage: 12~30g
    cautions: 脾虚泄泻、胃虚食少者不宜；痰湿中阻者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.056
    name: 阿胶
    aliases: []
    category: 补虚药
    nature: 甘，平
    meridians:
      - 肺
      - 肝
      - 肾
    effects: 补血滋阴，润燥，止血
    applications: 炙甘草汤、黄连阿胶汤以阿胶滋阴养血，治脉结代与少阴心烦不得卧；猪苓汤用阿胶利水而护阴；白头翁加甘草阿胶汤治产后热利；《金匮》芎归胶艾汤治妇人漏下。经方阿胶皆「烊化」入药。
    dosage: 3~9g（烊化兑服）
    cautions: 质滋腻，脾胃虚弱、纳呆便溏者慎用；内有瘀滞者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.057
    name: 麦门冬
    aliases:
      - 麦冬
    category: 补虚药
    nature: 甘、微苦，微寒
    meridians:
      - 心
      - 肺
      - 胃
    effects: 养阴生津，润肺清心
    applications: 炙甘草汤以麦冬配生地、人参、阿胶滋阴复脉；竹叶石膏汤配人参、半夏清补和胃，治伤寒解后虚羸少气；《金匮》麦门冬汤重用麦冬治火逆上气、咽喉不利，止逆下气。
    dosage: 6~12g
    cautions: 风寒咳嗽、脾虚便溏者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.058
    name: 麻仁
    aliases:
      - 火麻仁
    category: 泻下药
    nature: 甘，平
    meridians:
      - 脾
      - 胃
      - 大肠
    effects: 润肠通便
    applications: 麻子仁丸以麻仁配小承气汤加杏仁、芍药，炼蜜为丸，治脾约证——大便硬、小便数而津液不承，取润下缓攻之意。
    dosage: 10~15g（打碎入煎）
    cautions: 过量可致恶心、腹泻、四肢麻木等；脾虚便溏者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.059
    name: 商陆根
    aliases: []
    category: 泻下药
    nature: 苦，寒；有毒
    meridians:
      - 肺
      - 脾
      - 肾
      - 大肠
    effects: 逐水消肿，通利二便，外用解毒散结
    applications: 牡蛎泽泻散以商陆与牡蛎、泽泻、葶苈子、蜀漆、海藻、栝楼根等分同用，治大病瘥后、腰以下有水气，取其逐水消肿，白饮和服，小便利则止后服。
    dosage: 5~10g
    cautions: 有毒，孕妇忌用；体虚水肿慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.060
    name: 蜀椒
    aliases:
      - 花椒
    category: 温里药
    nature: 辛，温；有小毒
    meridians:
      - 脾
      - 胃
      - 肾
    effects: 温中止痛，杀虫止痒
    applications: 大建中汤以蜀椒配干姜、人参、胶饴，治心胸中大寒痛、呕不能饮食、腹中寒上冲皮起，取其温中散寒、下气止痛；乌梅丸用之辛以伏蛔。
    dosage: 3~6g；外用适量
    cautions: 有小毒，阴虚火旺者忌用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.061
    name: 薤白
    aliases: []
    category: 理气药
    nature: 辛、苦，温
    meridians:
      - 心
      - 肺
      - 胃
      - 大肠
    effects: 通阳散结，行气导滞
    applications: 治胸痹要药。《金匮》瓜蒌薤白白酒汤、瓜蒌薤白半夏汤、枳实薤白桂枝汤三方皆以薤白配瓜蒌通阳散结、豁痰下气，治胸痹喘息咳唾、胸背痛、短气。
    dosage: 5~10g
    cautions: 气虚无滞及胃弱纳呆者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.062
    name: 葱白
    aliases: []
    category: 解表药
    nature: 辛，温
    meridians:
      - 肺
      - 胃
    effects: 发汗解表，散寒通阳，解毒散结
    applications: 宣通阳气。白通汤以葱白配干姜、附子，治少阴病下利、脉微，取其通阳破阴；通脉四逆汤加减法中「面色赤者加葱」，亦是宣通格阳之意。
    dosage: 9~15g（鲜品）
    cautions: 表虚多汗者慎用；古有不宜与蜂蜜同服之说。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.063
    name: 猪胆汁
    aliases: []
    category: 经方特殊用品
    nature: 苦，寒
    meridians:
      - 肝
      - 胆
      - 肺
      - 大肠
    effects: 清热益阴，润燥通便
    applications: 白通加猪胆汁汤治服白通汤后利不止、厥逆无脉、干呕而烦者，取其咸苦反佐、引阳药入阴；通脉四逆加猪胆汁汤治下利止而脉不出，益阴和阳；蜜煎导法亦有猪胆汁灌谷道之例（土瓜根、大猪胆汁皆可导）。
    dosage: 适量（经方取汁，随汤和服）
    cautions: 须取健康猪只新鲜胆汁；今罕内服，多为文献学习内容。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.064
    name: 人尿
    aliases:
      - 童便
    category: 经方特殊用品
    nature: 咸，寒
    meridians:
      - 肺
      - 胃
      - 膀胱
    effects: 滋阴降火，益阴和阳
    applications: 白通加猪胆汁汤以人尿五合与猪胆汁一合同用，取其咸寒益阴、反佐通阳，防阴寒格拒热药；后世称「还元水」。
    dosage: 适量（经方用童便五合）
    cautions: 古法须用健康童子小便；今罕内服，多为文献学习内容。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.065
    name: 竹叶
    aliases: []
    category: 清热药
    nature: 甘、淡，寒
    meridians:
      - 心
      - 胃
      - 小肠
    effects: 清热泻火，除烦，生津，利尿
    applications: 竹叶石膏汤以竹叶领衔，配石膏、人参、麦冬等清余热、益气阴，治伤寒解后虚羸少气、气逆欲吐，为热病后清补并施之法。
    dosage: 6~15g
    cautions: 无湿热者慎用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.066
    name: 海藻
    aliases: []
    category: 化痰止咳平喘药
    nature: 苦、咸，寒
    meridians:
      - 肝
      - 胃
      - 肾
    effects: 消痰软坚散结，利水消肿
    applications: 牡蛎泽泻散以海藻与牡蛎、泽泻、商陆、葶苈子等同用，治大病瘥后腰以下有水气，取其利水消肿；后世主以软坚散结用之（瘿瘤瘰疬）。
    dosage: 6~12g
    cautions: 不宜与甘草同用；牡蛎泽泻散「小便利，止后服」，正避久服之弊。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.067
    name: 乌梅
    aliases: []
    category: 收涩药
    nature: 酸、涩，平
    meridians:
      - 肝
      - 脾
      - 肺
      - 大肠
    effects: 敛肺，涩肠，生津，安蛔
    applications: 乌梅丸以乌梅三百枚为君，配细辛、干姜、黄连、当归等，酸苦辛并进、寒热并用，治蛔厥——吐蛔、烦渴、须臾复止，又主久利，为厥阴病主方。
    dosage: 6~12g
    cautions: 外有表邪或内有实热积滞者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.068
    name: 吴茱萸
    aliases: []
    category: 温里药
    nature: 辛、苦，热；有小毒
    meridians:
      - 肝
      - 脾
      - 胃
      - 肾
    effects: 散寒止痛，降逆止呕，助阳止泻
    applications: 吴茱萸汤三见于《伤寒论》——阳明「食谷欲呕」、少阴「吐利，烦躁欲死」、厥阴「干呕，吐涎沫，头痛者」，皆以吴茱萸配人参、生姜、大枣温肝暖胃、降逆止呕；当归四逆加吴茱萸生姜汤治内有久寒。
    dosage: 2~5g
    cautions: 有小毒，不宜多用久服；阴虚有热者忌用；孕妇慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.069
    name: 当归
    aliases: []
    category: 补虚药
    nature: 甘、辛，温
    meridians:
      - 肝
      - 心
      - 脾
    effects: 补血活血，调经止痛，润肠通便
    applications: 当归四逆汤以当归配桂枝、芍药养血通脉，治手足厥寒、脉细欲绝；《金匮》当归芍药散治妇人腹中诸疾痛；赤小豆当归散配赤小豆治湿热血证。当归四逆加吴茱萸生姜汤治内有久寒。
    dosage: 6~12g
    cautions: 湿盛中满、大便溏泄者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.070
    name: 通草
    aliases: []
    category: 利水渗湿药
    nature: 甘、淡，微寒
    meridians:
      - 肺
      - 胃
    effects: 清热利尿，通气下乳
    applications: 当归四逆汤以通草配当归、桂枝、芍药、细辛、甘草、大枣，治血虚寒厥——手足厥寒、脉细欲绝，取其通行血脉、利水道。
    dosage: 3~5g
    cautions: 孕妇慎用；气阴两虚者不宜多服。
    notes: 《伤寒论》通草经考多谓即木通，本条按今通草通行数据编写，待核对。本草内容初稿待校对。
  - id: SHL.SB.H.071
    name: 裩裆灰
    aliases:
      - 烧裩
    category: 经方特殊用品
    nature: 咸，平（本草未正录，据注家之说，待核）
    meridians:
      - 肝
      - 肾
    effects: 引浊气下行，利阴阳
    applications: 烧裩散治伤寒阴阳易——大病新瘥、气血未复而交易相传，其人身体重、少气、少腹里急、或引阴中拘挛，取裩裆近隐处烧灰，水和服方寸匕，小便利、阴头微肿则愈。
    dosage: 方寸匕（日三服，以小便利为度）
    cautions: 古法特殊，今罕用，习知其法可也。
    notes: 特殊药物，取妇人或男子裩裆近隐处烧灰。本草内容初稿待校对。
  - id: SHL.SB.H.072
    name: 猪肤
    aliases: []
    category: 经方特殊用品
    nature: 甘，凉
    meridians:
      - 肾
    effects: 滋阴润燥，利咽
    applications: 猪肤汤治少阴病下利咽痛、胸满心烦——以猪肤一斤煮取汁，加白蜜一升、白粉五合熬香，和令相得，温分六服，取其润燥益阴。
    dosage: 一斤（经方原方；今以猪皮胶适量）
    cautions: 湿盛痰多者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.073
    name: 鸡子黄
    aliases:
      - 鸡蛋黄
    category: 经方特殊用品
    nature: 甘，平
    meridians:
      - 心
      - 肾
    effects: 滋阴养血，润燥熄风
    applications: 黄连阿胶汤以鸡子黄二枚纳药汁中「搅令相得」，治少阴病心中烦、不得卧，取其血肉有情之品滋阴填下；《金匮》百合鸡子黄汤治百合病吐之后者。
    dosage: 1~2 枚（生用，搅入药汁）
    cautions: 须用生鸡子黄临服时加入；湿热内蕴者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.074
    name: 升麻
    aliases: []
    category: 解表药
    nature: 辛、微甘，微寒
    meridians:
      - 肺
      - 脾
      - 胃
      - 大肠
    effects: 发表透疹，清热解毒，升举阳气
    applications: 经方见于升麻鳖甲汤，治阳毒之为病、面赤斑斑如锦纹、咽喉痛，取其清热解毒。后世多以升阳举陷用之（补中益气汤类），与仲景用法侧重不同。
    dosage: 3~10g
    cautions: 麻疹已透者忌用；阴虚火旺、上盛下虚者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.075
    name: 白头翁
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 胃
      - 大肠
    effects: 清热解毒，凉血止痢
    applications: 白头翁汤以之为君，配黄连、黄柏、秦皮，治下利欲饮水之热利下重，为厥阴热利代表方；产后血虚者加甘草、阿胶。
    dosage: 9~15g
    cautions: 虚寒下痢者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.076
    name: 秦皮
    aliases: []
    category: 清热药
    nature: 苦、涩，寒
    meridians:
      - 肝
      - 胆
      - 大肠
    effects: 清热燥湿，收涩止痢，止带，明目
    applications: 白头翁汤四药之一，取其清热燥湿、涩肠止痢；白头翁加甘草阿胶汤沿用之，治产后热利。
    dosage: 6~12g
    cautions: 脾胃虚寒者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.077
    name: 茵陈蒿
    aliases:
      - 茵陈
    category: 利水渗湿药
    nature: 苦、辛，微寒
    meridians:
      - 脾
      - 胃
      - 肝
      - 胆
    effects: 清利湿热，利胆退黄
    applications: 治黄疸要药。茵陈蒿汤以之为君，配栀子、大黄治阳明瘀热在里之阳黄——身黄如橘子色、小便不利、腹微满，取其清利湿热、导热下行。
    dosage: 6~15g
    cautions: 蓄血发黄及血虚萎黄者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.078
    name: 连轺
    aliases:
      - 连翘根
    category: 清热药
    nature: 苦，寒
    meridians:
      - 肺
      - 心
      - 小肠
    effects: 清热解毒，利水消肿（今多以连翘代：清热解毒，消肿散结，疏散风热）
    applications: 麻黄连轺赤小豆汤用连轺（连翘之根），与麻黄、杏仁、赤小豆、梓白皮等同用，治伤寒瘀热在里、身必发黄。连翘根今罕用，通行以连翘代之。
    dosage: 原方连轺去皮二两；今以连翘 6~15g 代用
    cautions: 脾胃虚寒者不宜久服。
    notes: 连轺为连翘之根，已少入药，本草卡按连翘通行数据编写，待核对。本草内容初稿待校对。
  - id: SHL.SB.H.079
    name: 生梓白皮
    aliases: []
    category: 经方特殊用品
    nature: 苦，寒
    meridians:
