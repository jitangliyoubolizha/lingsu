  - id: SHL.SB.H.038
    name: 栀子
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 心
      - 肺
      - 三焦
    effects: 泻火除烦，清热利湿，凉血解毒
    applications: 清宣郁热。栀子豉汤治虚烦不得眠、心中懊憹；栀子厚朴汤治心烦腹满、卧起不安；茵陈蒿汤配茵陈、大黄治阳黄身热，取其清热利湿。
    dosage: 6~10g
    cautions: 苦寒伤胃，脾虚便溏者不宜；原书明言「病人旧微溏者，不可与服之」。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.039
    name: 淡豆豉
    aliases:
      - 香豉
    category: 解表药
    nature: 苦、辛，凉
    meridians:
      - 肺
      - 胃
    effects: 解表，除烦，宣发郁热
    applications: 与栀子相伍为栀子豉汤，清宣胸膈郁热，治虚烦不得眠、心中懊憹、反复颠倒；栀子甘草豉汤、栀子生姜豉汤皆由其化裁。
    dosage: 6~12g
    cautions: 制法不同则性味有偏；胃虚易泛恶者慎用。
    notes: 本草内容初稿待校对。
