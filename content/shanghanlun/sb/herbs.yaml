  - id: SHL.SB.H.081
    name: 滑石
    aliases: []
    category: 利水渗湿药
    nature: 甘、淡，寒
    meridians:
      - 膀胱
      - 肺
      - 胃
    effects: 利尿通淋，清热解暑；外用祛湿敛疮
    applications: 猪苓汤以滑石配猪苓、茯苓、泽泻、阿胶，治水热互结伤阴之小便不利，取其清热利窍而不伤阴；《金匮》百合滑石散治百合病变发热者。
    dosage: 10~20g（包煎）
    cautions: 脾虚气弱、精滑者忌用；热病津伤者慎用；孕妇慎用。
    notes: 本草内容初稿待校对。
