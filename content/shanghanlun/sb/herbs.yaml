  - id: SHL.SB.H.074
    name: 升麻
    aliases: []
    category: 解表药
    nature: 辛、微甘，微寒
    meridians:
      - 肺
      - 脾
      - 胃
      - 大肠
    effects: 发表透疹，清热解毒，升举阳气
    applications: 经方见于升麻鳖甲汤，治阳毒之为病、面赤斑斑如锦纹、咽喉痛，取其清热解毒。后世多以升阳举陷用之（补中益气汤类），与仲景用法侧重不同。
    dosage: 3~10g
    cautions: 麻疹已透者忌用；阴虚火旺、上盛下虚者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.075
    name: 白头翁
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 胃
      - 大肠
    effects: 清热解毒，凉血止痢
    applications: 白头翁汤以之为君，配黄连、黄柏、秦皮，治下利欲饮水之热利下重，为厥阴热利代表方；产后血虚者加甘草、阿胶。
    dosage: 9~15g
    cautions: 虚寒下痢者忌用。
    notes: 本草内容初稿待校对。
