    nature: 甘、苦，寒
    meridians:
      - 心
      - 肝
      - 肾
    effects: 清热凉血，养阴生津
    applications: 炙甘草汤重用生地黄滋阴养血，治伤寒脉结代、心动悸；百合地黄汤以生地黄汁治百合病、不经吐下发汗者。原文所用地黄鲜干之别，历代注家有考辨。
    dosage: 12~30g
    cautions: 脾虚泄泻、胃虚食少者不宜；痰湿中阻者慎用。
    notes: 本草内容初稿待校对。
