# 太阳病上篇相关药物
# 状态：本草卡内容分批补齐中（2026-08 起），待人工校对
# 来源：宋本《伤寒论》药物组成
herbs:
  - id: SHL.SB.H.001
    name: 桂枝
    aliases:
      - 桂
    category: 解表药
    nature: 辛、甘，温
    meridians:
      - 心
      - 肺
      - 膀胱
    effects: 发汗解肌，温通经脉，助阳化气，平冲降气
    applications: 经方中应用最广的一味药。解肌和营，与芍药相配为桂枝汤调和营卫之本；配麻黄则发汗解表（麻黄汤）。温通心阳如桂枝甘草汤，温化水饮如苓桂术甘汤，平冲降逆如桂枝加桂汤治奔豚；又广泛用于温经散寒、活血通脉诸方。
    dosage: 3~10g
    cautions: 辛温助热，易伤阴动血。温热病及阴虚阳盛、血热妄行者忌用；孕妇及月经过多者慎用。
    notes: 本草内容初稿待校对。
