  - id: SHL.SB.H.021
    name: 黄芩
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 肺
      - 胆
      - 脾
      - 大肠
      - 小肠
    effects: 清热燥湿，泻火解毒，止血，安胎
    applications: 和解清里之品。小柴胡汤以之配柴胡清半里之热；黄芩汤治太阳与少阳合病自下利，为后世治热利之祖方；黄连阿胶汤用其清心火；《金匮》泻心汤三黄合用治吐衄。
    dosage: 3~10g
    cautions: 苦寒伤胃，脾胃虚寒、食少便溏者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.022
    name: 黄连
    aliases: []
    category: 清热药
    nature: 苦，寒
    meridians:
      - 心
      - 脾
      - 胃
      - 肝
      - 胆
      - 大肠
    effects: 清热燥湿，泻火解毒
    applications: 主心下痞与热利。大黄黄连泻心汤治心下痞、按之濡、其脉关上浮；葛根黄芩黄连汤治挟热下利；黄连汤治腹中痛、欲呕吐；黄连阿胶汤治少阴心烦不得卧；乌梅丸用之苦寒清热安蛔。
    dosage: 2~5g
    cautions: 苦寒败胃，脾胃虚寒者忌用；阴虚津伤者慎用；不宜过量久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.023
    name: 柴胡
    aliases: []
    category: 解表药
    nature: 辛、苦，微寒
    meridians:
      - 肝
      - 胆
      - 肺
    effects: 疏散退热，疏肝解郁，升举阳气
    applications: 和解少阳主药。小柴胡汤以之配黄芩，治往来寒热、胸胁苦满、默默不欲饮食；四逆散用其透解郁热、疏畅气机；柴胡加龙骨牡蛎汤诸方亦以柴胡领衔。仲景柴胡类方中柴胡用量独重，为其用药特色。
    dosage: 3~10g
    cautions: 性升散，古人有「劫肝阴」之戒，肝阳上亢、阴虚火旺者慎用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.024
    name: 细辛
    aliases: []
    category: 解表药
    nature: 辛，温
    meridians:
      - 心
      - 肺
      - 肾
    effects: 解表散寒，祛风止痛，通窍，温肺化饮
    applications: 温化寒饮、通达表里。小青龙汤以之配干姜、五味子治咳而微喘、痰多清稀；麻黄细辛附子汤助附子、麻黄温经发表，治少阴病初起反发热；大黄附子汤取其散寒止痛。
    dosage: 1~3g
    cautions: 有小毒，用量宜轻；不宜与藜芦同用；阴虚阳亢头痛、肺燥干咳者忌用；气虚多汗者慎用。
    notes: 本草内容初稿待校对。
