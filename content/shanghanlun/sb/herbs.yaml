  - id: SHL.SB.H.004
    name: 生姜
    aliases: []
    category: 解表药
    nature: 辛，微温
    meridians:
      - 肺
      - 脾
      - 胃
    effects: 解表散寒，温中止呕，化痰止咳，解鱼蟹毒
    applications: 辛温宣散，走而不守。桂枝汤类方必以生姜配大枣调和营卫；胃不和而呕逆者取其止呕（小半夏汤即半夏、生姜二味）；生姜泻心汤用之和胃散水。经方另以干姜专温中焦，生姜与干姜各有分工。
    dosage: 3~10g
    cautions: 助火伤阴，阴虚内热及热盛者慎用。
    notes: 本草内容初稿待校对。
