  - id: SHL.SB.H.026
    name: 甘遂
    aliases: []
    category: 泻下药
    nature: 苦，寒；有毒
    meridians:
      - 肺
      - 肾
      - 大肠
    effects: 泻水逐饮，消肿散结
    applications: 峻下逐水。大陷胸汤以之为君，为末冲服，治水热互结、从心下至少腹硬满而痛不可近者；十枣汤以甘遂、芫花、大戟等分为散，肥枣煎汤送服，治悬饮；甘遂半夏汤治留饮欲去。
    dosage: 0.5~1g（入丸散，原方为末冲服）
    cautions: 有毒，峻泻易伤正气，体虚者慎用；孕妇忌用；不宜与甘草同用。
    notes: 本草内容初稿待校对。
