  - id: SHL.SB.H.018
    name: 大黄
    aliases: []
    category: 泻下药
    nature: 苦，寒
    meridians:
      - 脾
      - 胃
      - 大肠
      - 肝
      - 心包
    effects: 泻下攻积，清热泻火，凉血解毒，逐瘀通经
    applications: 经方应用极广。攻下燥结有大小承气汤、调胃承气汤；泄热消痞有大黄黄连泻心汤；逐瘀有桃核承气汤、抵当汤、下瘀血汤；退黄有茵陈蒿汤；《金匮》大黄牡丹汤治肠痈。泻下宜后下、气锐，攻瘀可同煎、力缓，仲景各有法度。
    dosage: 3~15g
    cautions: 峻烈攻下，非里实之证不宜；孕妇、经期、哺乳期慎用或忌用；脾胃虚寒者慎用；不宜久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.019
    name: 芒硝
    aliases: []
    category: 泻下药
    nature: 咸、苦，寒
    meridians:
      - 胃
      - 大肠
    effects: 泻下通便，润燥软坚，清火消肿
    applications: 咸寒软坚。调胃承气汤、大承气汤以之润燥软坚、通导燥屎；大陷胸汤配甘遂、大黄治水热互结之结胸；桃核承气汤助大黄破瘀泄热。多不入煎，冲入药汁内溶化服。
    dosage: 6~12g（冲服）
    cautions: 孕妇忌用；不宜与硫黄、三棱同用。
    notes: 本草内容初稿待校对。
