    applications: 白头翁汤四药之一，取其清热燥湿、涩肠止痢；白头翁加甘草阿胶汤沿用之，治产后热利。
    dosage: 6~12g
    cautions: 脾胃虚寒者忌用。
    notes: 本草内容初稿待校对。
