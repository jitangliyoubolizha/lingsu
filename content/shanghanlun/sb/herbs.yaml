    category: 解表药
    nature: 辛，温
    meridians:
      - 肺
      - 胃
    effects: 发汗解表，散寒通阳，解毒散结
    applications: 宣通阳气。白通汤以葱白配干姜、附子，治少阴病下利、脉微，取其通阳破阴；通脉四逆汤加减法中「面色赤者加葱」，亦是宣通格阳之意。
    dosage: 9~15g（鲜品）
    cautions: 表虚多汗者慎用；古有不宜与蜂蜜同服之说。
