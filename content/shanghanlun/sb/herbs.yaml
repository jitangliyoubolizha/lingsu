    applications: 十枣汤三峻药之一，逐脏腑胸胁之水饮。经方少单用，后世多外用消肿散结。
    dosage: 1.5~3g；入丸散每次约 1g
    cautions: 有毒，体虚及孕妇忌用；不宜与甘草同用。
    notes: 本草内容初稿待校对。
