  - id: SHL.SB.H.010
    name: 麻黄
    aliases: []
    category: 解表药
    nature: 辛、微苦，温
    meridians:
      - 肺
      - 膀胱
    effects: 发汗解表，宣肺平喘，利水消肿
    applications: 发汗解表、宣肺平喘之要药。表实无汗者与桂枝相须为用（麻黄汤）；肺闭喘咳者配杏仁、甘草；寒饮咳喘者配细辛、干姜、五味子（小青龙汤）；风水一身尽肿者配石膏、生姜（越婢汤）。生用发汗力峻，炙用偏于宣肺平喘。
    dosage: 2~10g
    cautions: 发汗力强，表虚自汗、阴虚盗汗及虚喘者慎用；高血压、心律不齐者慎用；不宜过量久服。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.011
    name: 石膏
    aliases: []
    category: 清热药
    nature: 甘、辛，大寒
    meridians:
      - 肺
      - 胃
    effects: 清热泻火，除烦止渴；煅用外用敛疮
    applications: 清阳明气分大热之主药。白虎汤配知母治大热、大汗、大渴、脉洪大；麻杏石甘汤配麻黄清宣肺热，治汗出而喘；越婢汤治风水挟热。性虽大寒，配伍得宜则不碍透解。
    dosage: 15~60g（打碎先煎）
    cautions: 脾胃虚寒及血虚、阴虚发热者忌用。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.012
    name: 知母
    aliases: []
    category: 清热药
    nature: 苦、甘，寒
    meridians:
      - 肺
      - 胃
      - 肾
    effects: 清热泻火，滋阴润燥
    applications: 白虎汤中配石膏清热生津、除烦止渴；酸枣仁汤配酸枣仁治虚烦不眠；百合知母汤治百合病发汗后心烦。质润，清热之中兼能养阴。
    dosage: 6~12g
    cautions: 性寒质滑，脾胃虚寒、大便溏泄者忌用。
    notes: 本草内容初稿待校对。
