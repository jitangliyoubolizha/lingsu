  - id: SHL.SB.H.080
    name: 黄柏
    aliases:
      - 黄檗
    category: 清热药
    nature: 苦，寒
    meridians:
      - 肾
      - 膀胱
    effects: 清热燥湿，泻火除蒸，解毒疗疮
    applications: 栀子柏皮汤治伤寒身黄发热；白头翁汤以黄柏配白头翁、黄连、秦皮治热利下重；乌梅丸取其苦寒，与黄连同清上热。
