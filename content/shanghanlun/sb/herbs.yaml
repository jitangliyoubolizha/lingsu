  - id: SHL.SB.H.035
    name: 巴豆
    aliases: []
    category: 泻下药
    nature: 辛，热；有大毒
    meridians:
      - 胃
      - 大肠
    effects: 峻下冷积，逐水退肿，豁痰利咽，蚀疮
    applications: 大辛大热，攻逐寒积。三物白散以巴豆配桔梗、贝母治寒实结胸、无热证者，病在膈上者可吐、在膈下者可利。经方皆熬黑、去油用之，即后世所称巴豆霜。
    dosage: 0.1~0.3g（制霜入丸散）
    cautions: 有大毒，须去油制霜用；孕妇、体弱者忌用；畏牵牛子；古法服后泻利不止者以冷粥解之。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.036
    name: 栝楼根
    aliases:
      - 瓜蒌根
      - 天花粉
    category: 清热药
    nature: 甘、微苦，微寒
    meridians:
      - 肺
      - 胃
    effects: 清热泻火，生津止渴，消肿排脓
    applications: 生津止渴要药。小柴胡汤加减法「若渴，去半夏，加栝楼根四两」；柴胡去半夏加栝蒌汤治疟病发渴；栝蒌瞿麦丸治下焦虚寒而口渴；栝蒌桂枝汤治柔痉，取其滋养津液。
    dosage: 10~15g
    cautions: 不宜与乌头类同用；脾胃虚寒便溏者慎用。
    notes: 本草内容初稿待校对。
