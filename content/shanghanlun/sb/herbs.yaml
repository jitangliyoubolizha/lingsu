  - id: SHL.SB.H.058
    name: 麻仁
    aliases:
      - 火麻仁
    category: 泻下药
    nature: 甘，平
    meridians:
      - 脾
      - 胃
      - 大肠
    effects: 润肠通便
    applications: 麻子仁丸以麻仁配小承气汤加杏仁、芍药，炼蜜为丸，治脾约证——大便硬、小便数而津液不承，取润下缓攻之意。
    dosage: 10~15g（打碎入煎）
    cautions: 过量可致恶心、腹泻、四肢麻木等；脾虚便溏者不宜。
    notes: 本草内容初稿待校对。
  - id: SHL.SB.H.059
    name: 商陆根
    aliases: []
    category: 泻下药
    nature: 苦，寒；有毒
    meridians:
      - 肺
      - 脾
      - 肾
      - 大肠
    effects: 逐水消肿，通利二便，外用解毒散结
    applications: 牡蛎泽泻散以商陆与牡蛎、泽泻、葶苈子、蜀漆、海藻、栝楼根等分同用，治大病瘥后、腰以下有水气，取其逐水消肿，白饮和服，小便利则止后服。
    dosage: 5~10g
    cautions: 有毒，孕妇忌用；体虚水肿慎用。
    notes: 本草内容初稿待校对。
