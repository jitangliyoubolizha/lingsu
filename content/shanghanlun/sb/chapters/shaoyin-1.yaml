  - id: SHL.SB.SI.300
    no: 300
    text: 少阴病，脉微细沉，但欲卧，汗出不烦，自欲吐，至五六日自利，复烦躁不得卧寐者死。
    translation: 少阴病，脉象微细而沉，只想躺卧，出汗不烦躁，自己想呕吐，到了五六天自行下利，又烦躁不能躺卧入睡的，是死证。
