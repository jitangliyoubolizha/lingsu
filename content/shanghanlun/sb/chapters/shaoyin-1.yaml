  - id: SHL.SB.SI.301
    no: 301
    text: 少阴病，始得之，反发热，脉沉者，麻黄细辛附子汤主之。
    translation: 少阴病，刚开始得病，反而发热，脉象沉的，用麻黄细辛附子汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴病当无热恶寒，反发热者，邪在表也。虽脉沉，以始得，则邪气未深，亦当温剂发汗以散之。
      - source: 伤寒溯源集
        author: 钱潢
        text: 以附子温少阴之里，以补其命门之真阳；又以细辛之气温味辛，专走少阴者，以助其辛温发散。三者合用，补散兼施，虽发微汗，无损于阳气矣，故为温经散寒之神剂。
      - source: 参考《胡希恕伤寒论讲座》
        author: 灵素内容组
        text: 胡希恕以八纲定性：此为阴证兼表——少阴阳虚之人外兼表邪，故麻黄、附子并用，细辛协之，于温阳中解表，与太阳表证之单纯发汗迥别。
    formulas:
      - SHL.SB.F.085
    symptom_tags:
      - SHL.SB.SYM.001
    study_tags:
      - 太少两感
      - 麻黄细辛附子汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.302
    no: 302
    text: 少阴病，得之二三日，麻黄附子甘草汤微发汗。以二三日无证，故微发汗也。
