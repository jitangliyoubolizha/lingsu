  - id: SHL.SB.SI.297
    no: 297
    text: 少阴病，下利止而头眩，时时自冒者死。
    translation: 少阴病，下利停止却头晕目眩，时常自己昏冒的，是死证。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利止非病愈，而是阴液竭尽、无物可下。头眩自冒为虚阳上越、神明将脱，故为死证。
