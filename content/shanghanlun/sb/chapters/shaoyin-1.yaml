chapter:
  code: SI
  name: 辨少阴病脉证并治
  order: 7
  part: 1
  part_total: 2
clauses:
  - id: SHL.SB.SI.281
    no: 281
    text: 少阴之为病，脉微细，但欲寐也。
    translation: 少阴病的提纲证，脉象微细，只想睡觉。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴为病，脉微细，为邪气传里深也。卫气行于阳则寤，行于阴则寐。邪传少阴，则气行于阴而不行于阳，故但欲寐。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 经脉阳浅而阴深，阳大而阴小。邪传少阴，则脉之浮者转为微，大者转为细也。又多阳者多寤，多阴者多寐。邪传少阴，则目不瞑者转而为但欲寐也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：脉微细为心肾阳虚、鼓动无力，但欲寐为阳虚神失所养，二者并见即知邪入少阴；本篇但言「少阴病」者，皆以此脉证为着眼点。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.062
      - SHL.SB.SYM.041
    study_tags:
      - 少阴病提纲
      - 心肾阳虚
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.282
    no: 282
    text: 少阴病，欲吐不吐，心烦但欲寐。五六日自利而渴者，属少阴也。虚故引水自救；若小便色白者，少阴病形悉具。小便白者，以下焦虚有寒，不能制水，故令色白也。
    translation: 少阴病，想吐又吐不出来，心中烦躁却只想睡觉。到了五六天出现自行下利并且口渴的，属于少阴病。因为正虚所以饮水自救；如果小便颜色发白的，少阴病的证候就完全具备了。小便发白的原因，是因为下焦虚寒，不能制约水液，所以小便颜色发白。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 欲吐不吐为阴寒上逆，心烦但欲寐为虚阳外越而神疲。自利而渴为阳虚不能蒸化津液。小便色白是少阴虚寒的特征性表现，因下焦阳虚有寒，不能制水所致。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.029
      - SHL.SB.SYM.041
      - SHL.SB.SYM.039
      - SHL.SB.SYM.015
    study_tags:
      - 少阴虚寒
      - 小便色白
      - 下焦虚寒
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.283
    no: 283
    text: 病人脉阴阳俱紧，反汗出者，亡阳也。此属少阴，法当咽痛而复吐利。
    translation: 病人寸关尺脉都紧，反而出汗的，是阳气亡失的表现。这属于少阴病，按理应当咽痛并且又吐又利。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉阴阳俱紧为寒盛，反汗出为阳气外亡。少阴亡阳则寒邪上逆咽痛，中阳不守则吐利。此为少阴亡阳的危重证候。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.011
      - SHL.SB.SYM.004
      - SHL.SB.SYM.072
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
    study_tags:
      - 少阴亡阳
      - 脉紧反汗
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.284
    no: 284
    text: 少阴病，咳而下利谵语者，被火气劫故也。小便必难，以强责少阴汗也。
    translation: 少阴病，咳嗽并且下利、谵语的，是被火法劫迫的缘故。小便必然困难，因为强行逼迫少阴发汗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴病禁用火法发汗。误用火劫则伤阴动血，上逆则咳，下迫则利，热扰心神则谵语。津液大伤故小便难。"强责少阴汗"点明误治原因。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.047
      - SHL.SB.SYM.039
      - SHL.SB.SYM.033
      - SHL.SB.SYM.019
    study_tags:
      - 少阴禁火法
      - 误治变证
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.285
    no: 285
    text: 少阴病，脉细沉数，病为在里，不可发汗。
    translation: 少阴病，脉象细沉而数的，病邪在里，不可以发汗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉细沉数为里证脉象，或为阴虚内热，或为阳虚阴盛。少阴病本虚，禁用汗法，误汗则更伤阴阳。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.054
    study_tags:
      - 少阴禁汗
      - 脉细沉数
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.286
    no: 286
    text: 少阴病，脉微，不可发汗，亡阳故也；阳已虚，尺脉弱涩者，复不可下之。
    translation: 少阴病，脉象微弱的，不可以发汗，因为会亡失阳气的缘故；阳气已经虚弱，尺脉弱涩的，又不可以用泻下法。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉微为阳虚，发汗则更伤阳气而致亡阳。尺脉弱涩为阴血亦虚，泻下则更伤阴血。此条强调少阴病汗下两禁，顾护阴阳。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.023
      - SHL.SB.SYM.055
    study_tags:
      - 少阴禁汗下
      - 顾护阴阳
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.287
    no: 287
    text: 少阴病，脉紧，至七八日，自下利，脉暴微，手足反温，脉紧反去者，为欲解也，虽烦下利，必自愈。
    translation: 少阴病，脉象紧，到了七八天，自行下利，脉象突然变微弱，手足反而温暖，紧脉反而消失的，是即将解除的表现，虽然烦躁下利，必然自行痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉紧为寒盛，七八日后脉暴微、紧去，说明寒邪已退。手足反温为阳气来复之象。虽烦下利为正邪相争、驱邪外出，故必自愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.011
      - SHL.SB.SYM.039
      - SHL.SB.SYM.014
    study_tags:
      - 少阴欲解
      - 阳气来复
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.288
    no: 288
    text: 少阴病，下利，若利自止，恶寒而蜷卧，手足温者，可治。
    translation: 少阴病，下利，如果下利自行停止，怕冷并且蜷缩着躺卧，手足温暖的，可以治疗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利自止为邪去，恶寒蜷卧为阳虚，但手足温说明阳气尚存、有来复之机，故可治。手足温是判断少阴病预后的关键指标。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.003
    study_tags:
      - 少阴可治
      - 手足温
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.289
    no: 289
    text: 少阴病，恶寒而蜷，时自烦，欲去衣被者，可治。
    translation: 少阴病，怕冷并且蜷缩着，时常自己烦躁，想要脱去衣被的，可以治疗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 恶寒蜷卧为阳虚寒盛，时自烦、欲去衣被为阳气来复、能与邪争之象。阳气未绝则生机尚存，故可治。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.003
      - SHL.SB.SYM.014
    study_tags:
      - 少阴可治
      - 阳气来复
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.290
    no: 290
    text: 少阴中风，脉阳微阴浮者，为欲愈。
    translation: 少阴病感受风邪，寸脉微弱、尺脉浮的，是即将痊愈的表现。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳微为表邪已微，阴浮为里阳来复。邪退正复，故为欲愈之象。
    formulas: []
    symptom_tags:
