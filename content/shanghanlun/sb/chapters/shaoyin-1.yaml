      - 便血
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.294
    no: 294
    text: 少阴病，但厥无汗，而强发之，必动其血，未知从何道出，或从口鼻，或从目出者，是名下厥上竭，为难治。
    translation: 少阴病，只有四肢冰冷而没有汗，却强行发汗，必然扰动血液，不知道血从什么途径出来，有的从口鼻，有的从眼睛出来的，这叫做下厥上竭，是难以治疗的。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 但厥无汗为阳虚阴盛，强发汗则更伤阴血而动血。下厥为下焦阳虚厥冷，上竭为上焦阴血耗竭。阴阳两伤，故难治。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.024
      - SHL.SB.SYM.133
    study_tags:
      - 下厥上竭
      - 少阴难治
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.295
    no: 295
    text: 少阴病，恶寒身蜷而利，手足逆冷者，不治。
    translation: 少阴病，怕冷身体蜷缩并且下利，手足冰冷的，无法治疗。
