      - SHL.SB.SYM.002
    study_tags:
      - 少阴欲愈
      - 脉象预后
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.291
    no: 291
    text: 少阴病，欲解时，从子至寅上。
    translation: 少阴病容易解除的时间，是从子时到寅时（夜间十一点至凌晨五点）。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 子丑寅为阴尽阳生之时，少阴得阳气相助则邪易解。此为少阴病的欲解时辰，体现天人相应观念。
    formulas: []
    symptom_tags: []
    study_tags:
