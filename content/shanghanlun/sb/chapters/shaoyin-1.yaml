  - id: SHL.SB.SI.292
    no: 292
    text: 少阴病，吐利，手足不逆冷，反发热者，不死。脉不至者，灸少阴七壮。
    translation: 少阴病，呕吐下利，手足不冰冷，反而发热的，不会死。脉象摸不到的，灸少阴经穴位七壮。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐利为阴寒内盛，但手足不逆冷、反发热说明阳气未绝，故不死。脉不至为阳气一时郁闭，灸法可温通阳气。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.013
