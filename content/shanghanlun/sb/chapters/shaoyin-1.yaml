  - id: SHL.SB.SI.303
    no: 303
    text: 少阴病，得之二三日以上，心中烦，不得卧，黄连阿胶汤主之。
    translation: 少阴病，得病两三天以上，心中烦躁，不能入睡的，用黄连阿胶汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脉经曰：风伤阳，寒伤阴。少阴受病，则得之于寒。二三日以上，寒极变热之时，热烦于心，心中烦不得卧。与黄连阿胶汤，扶阴散热。
      - source: 伤寒论注
        author: 柯琴
        text: 口燥咽干者，肾火上走空窍，急下之以存津液；此心中烦不得卧者，肾火上攻于心也，当滋阴以凉心肾。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：少阴热化证——肾阴亏于下、心火亢于上，故心中烦不得卧；黄连阿胶汤泻心火、滋肾水，为扶阴抑阳之代表方。
    formulas:
      - SHL.SB.F.087
    symptom_tags:
      - SHL.SB.SYM.029
      - SHL.SB.SYM.086
    study_tags:
      - 少阴热化
      - 黄连阿胶汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.304
    no: 304
    text: 少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主之。
    translation: 少阴病，得病一两天，口中不苦不燥，背部怕冷的，应当灸治，用附子汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴客热则口燥舌干而渴。口中和者，不苦不燥，是无热也。背为阳，背恶寒者，阳气弱，阴气胜也。经曰：无热恶寒者，发于阴也。灸之助阳消阴，与附子汤温经散寒。
      - source: 伤寒论类方
        author: 徐大椿
        text: 盖恶寒既有微甚之不同，而其相反处，全在口中和与口燥渴之迥别。故欲知里症之寒热，全在渴不渴辨之，此伤寒之要诀也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：背恶寒一症两途——口中和而背恶寒为阳虚阴盛（附子汤），口燥渴而背微恶寒为热盛伤津（白虎加人参汤，169条）；一寒一热，辨在口之润渴。
    formulas:
      - SHL.SB.F.116
    symptom_tags:
      - SHL.SB.SYM.003
    study_tags:
      - 少阴虚寒
      - 附子汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
