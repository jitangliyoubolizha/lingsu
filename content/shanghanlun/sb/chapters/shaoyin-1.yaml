  - id: SHL.SB.SI.298
    no: 298
    text: 少阴病，四逆恶寒而身蜷，脉不至，不烦而躁者死。
    translation: 少阴病，四肢冰冷、怕冷并且身体蜷缩，脉象摸不到，不烦躁却躁动不安的，是死证。
