      - SHL.SB.SYM.001
    study_tags:
      - 少阴不死证
      - 灸法
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.293
    no: 293
    text: 少阴病，八九日，一身手足尽热者，以热在膀胱，必便血也。
    translation: 少阴病，到了八九天，全身和手足都发热的，因为热在膀胱，必然出现便血。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴病日久，若一身尽热为邪从热化、热入膀胱血分。热迫血妄行则便血。此为少阴热化变证。
    formulas: []
    symptom_tags:
