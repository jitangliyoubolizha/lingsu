    study_tags:
      - 协热便脓血
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.259
    no: 259
    text: 伤寒发汗已，身目为黄，所以然者，以寒湿在里不解故也。以为不可下也，于寒湿中求之。
    translation: 伤寒病发汗后，身体眼睛发黄的，之所以这样，是因为寒湿在里没有解除的缘故。认为不可以泻下，应当从寒湿的角度来治疗。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 《金匮要畧》曰：黄家所起，从湿得之。汗出热去，则不能发黄。发汗已身目为黄者，风气去湿气在也。脾恶湿，湿气内着，脾色外夺者，身目为黄。若瘀血在里发黄者，则可下。此以寒湿在里，故不可下，当从寒湿法治之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发汗后身目黄为寒湿发黄（阴黄），非湿热发黄（阳黄）。寒湿在里不可攻下，当温化寒湿。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.069
    study_tags:
      - 寒湿发黄
      - 阴黄
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.260
    no: 260
    text: 伤寒七八日，身黄如橘子色，小便不利，腹微满者，茵陈蒿汤主之。
    translation: 伤寒病七八天，身体发黄像橘子颜色，小便不通利，腹部微微胀满的，用茵陈蒿汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 当热甚之时，身黄如橘子色，是热毒发泄于外。《内经》曰：膀胱者，津液藏焉，气化则能出。小便不利，小腹满者，热气甚于外，而津液不得下行也。与茵陈汤，利小便，退黄逐热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 身黄如橘子色为阳黄（湿热发黄），色鲜明。小便不利为湿热不得下泄，腹微满为湿热内蕴。茵陈蒿汤清热利湿退黄。
    formulas:
