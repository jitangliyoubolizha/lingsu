  - id: SHL.SB.YM.254
    no: 254
    text: 发汗不解，腹满痛者，急下之，宜大承气汤。
    translation: 发汗后病不解除，腹部胀满疼痛的，应当紧急泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗不解，邪热传入府而成腹满痛者，传之迅也，是须急下之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发汗不解为邪已入里，腹满痛为腑实内结、气机阻滞。不急下则实热更盛、津液更伤。此为阳明急下证之三。
