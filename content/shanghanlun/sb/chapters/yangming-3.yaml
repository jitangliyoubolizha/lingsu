  - id: SHL.SB.YM.255
    no: 255
    text: 腹满不减，减不足言，当下之，宜大承气汤。
    translation: 腹部胀满不减轻，即使减轻也不值得一提，应当泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 腹满不减，邪气实也。经曰：大满大实，自可除下之。大承气汤下其满实。若腹满时减，非内实也，则不可下。《金匮要畧》曰：腹满时减，复如故，此为寒，当与温药。是减不足言也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 腹满不减为实满（腑实内结），与虚满（时减时满）不同。实满当攻下，大承气汤峻下热结。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
