  - id: SHL.SB.YM.255
    no: 255
    text: 腹满不减，减不足言，当下之，宜大承气汤。
    translation: 腹部胀满不减轻，即使减轻也不值得一提，应当泻下，适合用大承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 腹满不减为实满（腑实内结），与虚满（时减时满）不同。实满当攻下，大承气汤峻下热结。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.091
    study_tags:
      - 大承气汤
      - 实满辨证
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.256
    no: 256
    text: 阳明少阳合病，必下利，其脉不负者，为顺也。负者，失也，互相克贼，名为负也。脉滑而数者，有宿食也，当下之，宜大承气汤。
    translation: 阳明与少阳同时发病，必然会下利，脉象不出现相克的，是顺证。出现相克的，是失治，互相克伐，叫做负。脉象滑而数的，是有宿食，应当泻下，适合用大承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明少阳合病，木土相克。脉不负（不相克）为顺，负为逆。脉滑数为宿食实热，当攻下，用大承气汤。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.085
    study_tags:
      - 阳明少阳合病
      - 大承气汤
      - 宿食
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.257
    no: 257
    text: 病人无表里证，发热七八日，虽脉浮数者，可下之。假令已下，脉数不解，合热则消谷善饥，至六七日不大便者，有瘀血，宜抵当汤。
    translation: 患者没有表证也没有里证，发热七八天，虽然脉象浮数的，可以泻下。假设已经泻下，脉数不解除，热邪合并就会消化谷物容易饥饿，到了六七天不大便的，是有瘀血，适合用抵当汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 无表里证而发热七八日为邪伏血分。下后脉数不解、消谷善饥为热在血分。六七日不大便为瘀血内结。抵当汤破血逐瘀。
    formulas:
      - SHL.SB.F.056
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.002
    study_tags:
      - 瘀血发热
      - 抵当汤
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.258
    no: 258
    text: 若脉数不解，而下不止，必协热便脓血也。
    translation: 如果脉数不解除，而且下利不止，必然会挟热便脓血。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉数不解为热邪未除，下利不止为热迫大肠。热伤血络则协热便脓血。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.039
    study_tags:
      - 协热便脓血
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.259
    no: 259
    text: 伤寒发汗已，身目为黄，所以然者，以寒湿在里不解故也。以为不可下也，于寒湿中求之。
    translation: 伤寒病发汗后，身体眼睛发黄的，之所以这样，是因为寒湿在里没有解除的缘故。认为不可以泻下，应当从寒湿的角度来治疗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发汗后身目黄为寒湿发黄（阴黄），非湿热发黄（阳黄）。寒湿在里不可攻下，当温化寒湿。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.069
    study_tags:
      - 寒湿发黄
      - 阴黄
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.260
    no: 260
    text: 伤寒七八日，身黄如橘子色，小便不利，腹微满者，茵陈蒿汤主之。
    translation: 伤寒病七八天，身体发黄像橘子颜色，小便不通利，腹部微微胀满的，用茵陈蒿汤主治。
