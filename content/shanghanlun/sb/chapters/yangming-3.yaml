      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发热汗多为阳明热盛、津液将竭之象。不急下则津液尽亡、阴竭阳脱。此为阳明急下证之二，急下存阴。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.004
    study_tags:
