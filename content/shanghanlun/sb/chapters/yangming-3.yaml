    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.249
    no: 249
    text: 伤寒吐后，腹胀满者，与调胃承气汤。
    translation: 伤寒病涌吐后，腹部胀满的，给调胃承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 《内经》曰：诸胀腹大，皆属于热。热在上焦则吐。吐后不解，复腹胀满者，邪热入胃也。与调胃承气汤下其胃热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐后腹胀满为胃气不和、腑气不通。调胃承气汤泻热和胃、通降腑气。
    formulas:
