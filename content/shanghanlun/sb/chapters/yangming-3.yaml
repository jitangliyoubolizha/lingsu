        text: 邪热入府，外发热汗多者，热迫津液将竭，急与大承气汤以下其府热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发热汗多为阳明热盛、津液将竭之象。不急下则津液尽亡、阴竭阳脱。此为阳明急下证之二，急下存阴。
