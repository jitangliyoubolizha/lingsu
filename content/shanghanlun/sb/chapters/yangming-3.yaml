  - id: SHL.SB.YM.250
    no: 250
    text: 太阳病，若吐若下若发汗后，微烦，小便数，大便因硬者，与小承气汤和之愈。
    translation: 太阳病，如果涌吐、泻下、发汗后，微微烦躁，小便次数多，大便因而变硬的，给小承气汤调和就会好。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 吐下发汗，皆损津液，表邪乘虚传里。大烦者，邪在表也；微烦者，邪入里也。小便数，大便因硬者，其脾为约也。小承气汤和之愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐下汗后津伤，小便数则津液更伤，肠燥大便硬。微烦为腑气不通。小承气汤轻下热结、调和胃肠。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.014
    study_tags:
      - 小承气汤
      - 津伤便秘
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.251
    no: 251
    text: 得病二三日，脉弱，无太阳柴胡证，烦躁，心下硬，至四五日，虽能食，以小承气汤，少少与，微和之，令小安，至六日，与承气汤一升。若不大便六七日，小便少者，虽不受食，但初头硬，后必溏，未定成硬，攻之必溏，须小便利，屎定硬，乃可攻之，宜大承气汤。
    translation: 得病两三天，脉象弱，没有太阳病和小柴胡汤证，烦躁，心下硬满，到了四五天，虽然能够进食，用小承气汤，少量给予，轻微调和，让患者稍微安宁，到了第六天，给承气汤一升。如果六七天不大便，小便少的，虽然不能进食，只是开始硬，后来必然溏，尚未完全变硬，攻下必然会溏，必须等到小便通利，大便确实变硬了，才可以攻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 《针经》曰：脉软者，病将下。弱为阴脉，当责邪在里。得病二三日脉弱，是日数虽浅，而邪气已入里也。无太阳证，为表证已罢；无柴胡证，为无半表半里之证。烦躁心下硬者，邪气内甚也。胃实热甚，则不能食。胃虚热甚，至四五日虽能食，亦当与小承气汤微和之。至六日则热甚，与大承气汤一升。若不大便六七日，小便多者，为津液内竭，大便必硬，则可下之。小便少者，则胃中水谷不别，必初硬后溏。虽不能食，为胃实。以小便少，则未定成硬，亦不可攻。须小便利，屎定硬，乃可攻之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉弱为正气不足，烦躁心下硬为里有实邪。先用小承气汤试探、微和胃肠。若不大便六七日、小便少，说明燥屎未成，不可峻攻。待小便利、屎定硬，方可用大承气汤。体现了审慎用药、以小便判断燥屎成否的方法。
    formulas:
      - SHL.SB.F.113
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.051
      - SHL.SB.SYM.014
    study_tags:
      - 大承气汤
      - 小承气汤试探
      - 以小便判断燥屎
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.252
    no: 252
    text: 伤寒六七日，目中不了了，睛不和，无表里证，大便难，身微热者，此为实也，急下之，宜大承气汤。
    translation: 伤寒病六七天，眼睛看不清楚，瞳孔不灵活，没有表证也没有明显的里证，大便困难，身体微微发热的，这是实证，应当紧急泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 内经曰：诸脉者皆属于目。伤寒六七日，邪气入里之时，目中不了了、睛不和者，邪热内甚，上熏于目也。无表里证，大便难者，里实也。身大热者，表热也；身微热者，里热也。针经曰：热病目不明，热不已者死。此目中不了了、睛不和，则证近危恶也，须急与大承气汤下之。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 目中不了了者，目光不精而视物不明也；睛不和者，目直视而不圆转也。六七日热盛而阴伤，故其证如此。无表里证，无头痛恶寒，而又无腹满谵语等证也。然而大便难，身微热，则实证已具。合之目中不了了、睛不和，其为热极阴伤无疑，故虽无大满大实，亦必以大承气汤急下。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：阳明三急下之一——外证虽微而燥热灼耗真阴，目中不了了、睛不和为阴竭先兆，故不待痞满燥实俱全而急下存阴。
    formulas:
