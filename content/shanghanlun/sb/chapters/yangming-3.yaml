  - id: SHL.SB.YM.256
    no: 256
    text: 阳明少阳合病，必下利，其脉不负者，为顺也。负者，失也，互相克贼，名为负也。脉滑而数者，有宿食也，当下之，宜大承气汤。
    translation: 阳明与少阳同时发病，必然会下利，脉象不出现相克的，是顺证。出现相克的，是失治，互相克伐，叫做负。脉象滑而数的，是有宿食，应当泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明土，少阳木。二经合病，气不相和，则必下利。少阳脉不胜，阳明不负，是不相尅，为顺也。若少阳脉胜，阳明脉负者，是鬼贼相尅，为正气失也。《脉经》曰：脉滑者，为病食也。又曰：滑数则胃气实。下利者脉当微厥，今脉滑数，知胃有宿食，与大承气汤以下除之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明少阳合病，木土相克。脉不负（不相克）为顺，负为逆。脉滑数为宿食实热，当攻下，用大承气汤。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.085
    study_tags:
      - 阳明少阳合病
      - 大承气汤
      - 宿食
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.257
    no: 257
    text: 病人无表里证，发热七八日，虽脉浮数者，可下之。假令已下，脉数不解，合热则消谷善饥，至六七日不大便者，有瘀血，宜抵当汤。
    translation: 患者没有表证也没有里证，发热七八天，虽然脉象浮数的，可以泻下。假设已经泻下，脉数不解除，热邪合并就会消化谷物容易饥饿，到了六七天不大便的，是有瘀血，适合用抵当汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 七八日，邪入府之时。病人无表里证，但发热，虽脉浮数，亦可与大承气汤下之。浮为热客于气，数为热客于血。下之邪热去，而浮数之脉俱当解。若下后数脉去而脉但浮，则是荣血间热并于卫气间也，当为邪气独留，心中则饥，邪热不杀谷，潮热发渴之证。此下之后，浮脉去而数不解，则是卫气间热合于荣血间也，热气合并，迫血下行，胃虚协热，消谷喜饥，血至下焦。若大便利者，下血乃愈。若六七日不大便，则血不得行，畜积于下为瘀血，与抵当汤以下去之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 无表里证而发热七八日为邪伏血分。下后脉数不解、消谷善饥为热在血分。六七日不大便为瘀血内结。抵当汤破血逐瘀。
    formulas:
      - SHL.SB.F.056
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.002
    study_tags:
      - 瘀血发热
      - 抵当汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.258
    no: 258
    text: 若脉数不解，而下不止，必协热便脓血也。
    translation: 如果脉数不解除，而且下利不止，必然会挟热便脓血。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下后脉数不解而不大便者，是热不得泄，畜血于下，为瘀血也。若下后脉数不解而下利不止者，为热得下泄，迫血下行，必便脓血。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉数不解为热邪未除，下利不止为热迫大肠。热伤血络则协热便脓血。
    formulas: []
    symptom_tags:
