  - id: SHL.SB.YM.242
    no: 242
    text: 病人小便不利，大便乍难乍易，时有微热，喘冒不能卧者，有燥屎也，宜大承气汤。
    translation: 患者小便不通利，大便时难时易，时常有轻微发热，气喘昏冒不能躺卧的，是有燥屎，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 小便利则大便硬。此以有燥屎，故小便不利，而大便乍难乍易。胃□者，发热喘冒无时，及嗜卧也。此燥屎在胃，故时有微热，喘冒不得卧也。与大承气汤以下燥屎。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 小便不利为津液偏渗大肠，大便乍难乍易为燥屎内结、热结旁流。微热喘冒不能卧为热邪上扰。有燥屎当攻下，用大承气汤。
    formulas:
      - SHL.SB.F.112
