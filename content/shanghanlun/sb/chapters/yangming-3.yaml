  - id: SHL.SB.YM.245
    no: 245
    text: 脉阳微而汗出少者，为自和也，汗出多者，为太过。阳脉实，因发其汗，出多者，亦为太过。太过者，为阳绝于里，亡津液，大便因硬也。
    translation: 脉象阳部微弱而出汗少的，是自然调和，出汗多的，是太过。阳脉实，因为发汗，出汗多的，也是太过。太过的，是阳气在里断绝，亡失津液，大便因而变硬。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脉阳微者，邪气少。汗出少者，为适当，故自和。汗出多者，反损正气，是汗出太过也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗出少为自和，汗出多为太过（伤津）。无论脉微脉实，发汗太过均会亡津液，津伤则肠燥大便硬。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.004
    study_tags:
      - 汗出太过
      - 亡津液
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.246
    no: 246
    text: 脉浮而芤，浮为阳，芤为阴，浮芤相搏，胃气生热，其阳则绝。
    translation: 脉象浮而芤，浮脉为阳，芤脉为阴，浮脉芤脉相互搏结，胃中产生热邪，阳气就会断绝。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮芤相搏，阴阳不谐，胃气独治，郁而生热，消烁津液，其阳为绝。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮为阳热外浮，脉芤为阴血内虚。浮芤相搏为阳浮阴虚、阴不敛阳。胃气生热为阴虚生内热，其阳则绝为阴阳离决之象。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.002
    study_tags:
      - 浮芤脉
      - 阴阳离决
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.247
    no: 247
    text: 趺阳脉浮而涩，浮则胃气强，涩则小便数，浮涩相搏，大便则硬，其脾为约，麻子仁丸主之。
    translation: 趺阳脉浮而涩，浮脉说明胃气强盛，涩脉说明小便次数多，浮脉涩脉相互搏结，大便就会变硬，这是脾的功能受到约束，用麻子仁丸主治。
    annotations:
      - source: 伤寒贯珠集
        author: 尤怡
        text: 浮者阳气多，涩者阴气少，而趺阳见之，是为胃强而脾弱。约，约束也，犹弱者受强之约束，而气馁不用也。脾不用而胃独行，则水液并趋一处，而大便失其润矣。
      - source: 注解伤寒论
        author: 成无己
        text: 今胃强脾弱，约束津液，不得四布，但输膀胱，致小便数、大便难，与脾约丸通肠润燥。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：脾约即胃强脾弱——胃中燥热而脾阴受约，津液但输膀胱，故小便数、大便硬；麻子仁丸润肠泄热，缓下不伤正，与承气之峻下有别。
    formulas:
      - SHL.SB.F.109
    symptom_tags:
      - SHL.SB.SYM.002
    study_tags:
      - 脾约证
      - 麻子仁丸
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.YM.248
    no: 248
    text: 太阳病三日，发汗不解，蒸蒸发热者，属胃也，调胃承气汤主之。
    translation: 太阳病三天，发汗后病不解除，蒸蒸发热的，属于胃腑病变，用调胃承气汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 蒸蒸者，如热熏蒸，言甚热也。太阳病三日发汗不解，则表邪已罢，蒸蒸发热，胃热为甚，与调胃承气汤下胃热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发汗不解为邪已入里。蒸蒸发热为阳明里热外蒸的特征性热型，属胃腑实热。调胃承气汤泻热和胃。
    formulas:
