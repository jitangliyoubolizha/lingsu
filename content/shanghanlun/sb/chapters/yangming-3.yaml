  - id: SHL.SB.YM.262
    no: 262
    text: 伤寒瘀热在里，身必黄，麻黄连轺赤小豆汤主之。
    translation: 伤寒病瘀热在里，身体必然会发黄，用麻黄连轺赤小豆汤主治。
    annotations:
      - source: 伤寒贯珠集
        author: 尤怡
        text: 此亦热瘀而未实之证。瘀热在里者，汗不得出而热瘀于里也。故与麻黄、杏仁、生姜之辛温以发越其表，赤小豆、连轺、梓白皮之苦寒甘以清热于里。大枣、甘草甘温悦脾，以为散湿驱邪之用。用潦水者，取其味薄，不助水气也。
      - source: 伤寒论类方
        author: 徐大椿
        text: 前方欲黄从下解，此方欲黄从汗解，乃有表无表之分也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：湿热郁蒸发黄而表邪未尽，解表散邪与清热利湿并行；与 236 条茵陈蒿汤之纯里证发黄相对，一从汗解、一从下解。
    formulas:
      - SHL.SB.F.111
    symptom_tags:
