  - id: SHL.SB.YM.262
    no: 262
    text: 伤寒瘀热在里，身必黄，麻黄连轺赤小豆汤主之。
    translation: 伤寒病瘀热在里，身体必然会发黄，用麻黄连轺赤小豆汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 瘀热在里为湿热郁蒸兼表邪未解。身黄为湿热发黄。麻黄连轺赤小豆汤解表散邪、清热利湿退黄，适用于湿热发黄兼表证者。
    formulas:
