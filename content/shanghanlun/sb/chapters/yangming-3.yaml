  - id: SHL.SB.YM.243
    no: 243
    text: 食谷欲呕，属阳明也，吴茱萸汤主之。得汤反剧者，属上焦也。
    translation: 进食就想呕吐，属于阳明病，用吴茱萸汤主治。服药后反而加重的，属于上焦病。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 上焦主内，胃为之布。食谷欲呕者，胃不受也。与吴茱萸汤以温胃气。得汤反剧者，上焦不内也，以治上焦法治之。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 食谷欲呕，有中焦与上焦之别。盖中焦多虚寒，而上焦多火逆也。阳明中虚，客寒乘之，食谷则呕，故宜吴茱萸汤以益虚而温胃。若得汤反剧，则仍是上焦火逆之病，宜清降而不宜温养者矣。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：食谷欲呕属胃中虚寒，吴茱萸汤温胃降逆；「得汤反剧」则病属上焦胸膈，非本方所宜——借药后反应以辨病位，示随证审治之细。
    formulas:
      - SHL.SB.F.089
    symptom_tags:
      - SHL.SB.SYM.013
    study_tags:
      - 吴茱萸汤
      - 阳明中寒呕吐
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.YM.244
    no: 244
    text: 太阳病，寸缓关浮尺弱，其人发热汗出，复恶寒，不呕，但心下痞者，此以医下之也。如其不下者，病人不恶寒而渴者，此转属阳明也。小便数者，大便必硬，不更衣十日，无所苦也。渴欲饮水，少少与之，但以法救之。渴者，宜五苓散。
    translation: 太阳病，寸脉缓关脉浮尺脉弱，患者发热出汗，又怕冷，不呕吐，只是心下痞满的，这是因为医生用了泻下法。如果没有泻下的，患者不怕冷而口渴的，这是转属阳明了。小便次数多的，大便必然硬，十天不解大便，也没有什么痛苦的。口渴想饮水，少量给予，按照方法救治。口渴的，适合用五苓散。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳病，脉阳浮阴弱，为邪在表。今寸缓关浮尺弱，邪气渐传里，则发热汗出复恶寒者，表未解也。传经之邪入里，里不和者必呕。此不呕但心下痞者，医下之早，邪气留于心下也。如其不下者，必渐不恶寒而渴，太阳之邪转属阳明也。若吐若下若发汗后，小便数大便鞭者，当与小承气汤和之。此不因吐下发汗后，小便数大便硬，若是无满实，虽不更衣十日无所苦也。候津液还入胃中，小便数少，大便必自出也。渴欲饮水者，少少与之，以润胃气。但审邪气所在，以法救之，如渴不止与五苓散是也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阳病误下致心下痞为痞证。若未下而转属阳明，不恶寒而渴为阳明证。小便数则津液偏渗、大便硬。无所苦说明非腑实重症。渴欲饮水少少与之，或五苓散化气行水。
    formulas:
