      - 病机转化
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TAI.279
    no: 279
    text: 本太阳病，医反下之，因尔腹满时痛者，属太阴也，桂枝加芍药汤主之；大实痛者，桂枝加大黄汤主之。
    translation: 本来是太阳病，医生反而用了泻下法，因此导致腹部胀满、时常疼痛的，属于太阴病，用桂枝加芍药汤主治；如果疼痛剧烈、按之硬实的，用桂枝加大黄汤主治。
    annotations:
      - source: 伤寒论注
        author: 柯琴
        text: 腹满时痛，因于下后，是阳邪转属，非太阴本病。表症未罢，故仍用桂枝汤解外；满痛既见，故倍加芍药以和里。此病本于阳，故用阴以和阳。
      - source: 伤寒溯源集
        author: 钱潢
        text: 加芍药者，桂枝汤中已有芍药，因误下伤脾，故多用之以收敛阴气也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：同一腹满，虚实两途——时痛属脾伤之虚，倍芍药和络缓急；大实痛则兼阳明积滞，加大黄微通其滞，不因误下而禁下。
    formulas:
      - SHL.SB.F.081
      - SHL.SB.F.082
    symptom_tags:
      - SHL.SB.SYM.091
    study_tags:
      - 误下变证
      - 桂枝加芍药汤
      - 桂枝加大黄汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TAI.280
    no: 280
    text: 太阴为病，脉弱，其人续自便利，设当行大黄、芍药者，宜减之，以其人胃气弱，易动故也。
    translation: 太阴病，脉象虚弱，患者持续自行下利的，假设应当使用大黄、芍药等药物的，应当减少用量，因为患者的胃气虚弱，容易被攻伐药物所伤动的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 腹满痛者，太阴病也。脉弱，其人续自便利，则邪虽在里，未成大实。欲与大黄芍药攻沟痛者，宜少与之，以胃气尚弱，易为动利也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条强调太阴虚人的用药禁忌。脉弱自利为脾胃气虚，即使有实邪需要用大黄、芍药，也应减量使用，以防伤及胃气。体现了顾护脾胃正气的用药原则。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.051
      - SHL.SB.SYM.039
    study_tags:
      - 太阴用药禁忌
      - 顾护胃气
      - 减量大黄芍药
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
