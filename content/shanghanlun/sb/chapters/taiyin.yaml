  - id: SHL.SB.TAI.274
    no: 274
    text: 太阴中风，四肢烦疼，脉阳微阴涩而长者，为欲愈。
    translation: 太阴病感受风邪，四肢烦扰疼痛，脉象浮取微弱、沉取涩滞而兼长象的，是即将痊愈的征兆。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阴脾也，主营四末。太阴中风，四肢烦疼者，风□末疾也。表邪少则微，里向和则涩而长。长者，阳也，阴病见阳脉则生，以阴得阳则解，故云欲愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阴中风，风邪客于太阴经络，故四肢烦疼。脉阳微阴涩为正虚邪微，兼见长脉则为正气来复之象，故曰欲愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.164
      - SHL.SB.SYM.023
      - SHL.SB.SYM.055
    study_tags:
      - 太阴中风
      - 脉象预后
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TAI.275
    no: 275
    text: 太阴病，脉浮者，可发汗，宜桂枝汤。
    translation: 太阴病，脉象浮的，可以用发汗法治疗，适宜用桂枝汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 经曰：浮为在表，沉为在里。太阴病脉浮者，邪在经也，故当汗散之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阴病本为里虚寒证，若见脉浮，说明表邪未解。桂枝汤解肌发表、调和营卫，药性温和，适合太阴虚人外感。
    formulas:
      - SHL.SB.F.001
    symptom_tags:
      - SHL.SB.SYM.002
    study_tags:
      - 太阴病表证
      - 桂枝汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TAI.276
    no: 276
    text: 自利不渴者，属太阴，以其脏有寒故也，当温之，宜服四逆辈。
    translation: 自行下利而不口渴的，属于太阴病，因为内脏有寒的缘故，应当用温阳的方法治疗，适宜服用四逆汤一类的方剂。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 自利而渴者，属少阴，为寒在下焦。自利不渴者，属太阴，为寒在中焦。与四逆等汤以温其藏。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 自利不渴是太阴虚寒的特征性表现。脾阳不足，水谷不化而下利；内无热邪，故不渴。治当温中散寒，四逆汤类（理中丸、四逆汤等）为正治之法。
    formulas:
      - SHL.SB.F.079
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.113
    study_tags:
      - 太阴虚寒
      - 自利不渴
      - 温中法
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TAI.277
    no: 277
    text: 伤寒脉浮而缓，手足自温者，系在太阴。太阴当发身黄，若小便自利者，不能发黄。至七八日，虽暴烦下利日十余行，必自止，以脾家实，腐秽当去故也。
    translation: 伤寒病脉象浮而缓，手足自然温暖的，病在太阴。太阴病应当出现身体发黄，如果小便自然通利的，就不会发黄。到了七八天，即使突然出现烦躁、下利一天十多次，也必然会自行停止，因为脾气充实，腐败秽浊之物应当排出的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阴病至七八日大便硬者，为太阴入府，传于阳明也。今至七八日暴烦下利十余行者，脾家实，腐秽去也。下利烦躁者死。此以脾气和，逐邪下泄，故虽暴烦。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮缓、手足温为太阴表证特征。太阴湿郁可发黄，小便自利则湿有出路而不发黄。暴烦下利为脾阳恢复、驱邪外出之象，腐秽去尽则利自止，是太阴病自愈的机转。
    formulas: []
