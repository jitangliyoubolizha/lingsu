  - id: SHL.SB.TAI.278
    no: 278
    text: 伤寒脉浮而缓，手足自温者，是为系在太阴。太阴者，身当发黄，若小便自利者，不能发黄。至七八日，大便硬者，为阳明病也。
    translation: 伤寒病脉象浮而缓，手足自然温暖的，这是病在太阴。太阴病，身体应当发黄，如果小便自然通利的，就不会发黄。到了七八天，如果大便变硬的，就是转为阳明病了。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阴病至七八日，大便硬者，为太阴入府，传于阳明也。今至七八日，暴烦下利十余行者，脾家实，腐秽去也。下利烦躁者死。此以脾气和，逐邪下泄，故虽暴烦。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条与上条前半相同，但后半论述太阴转阳明的情况。太阴湿郁发黄，小便自利则湿去不黄。若七八日后大便转硬，说明湿从燥化，太阴转属阳明，病机发生转变。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.050
      - SHL.SB.SYM.069
      - SHL.SB.SYM.143
    study_tags:
      - 太阴转阳明
