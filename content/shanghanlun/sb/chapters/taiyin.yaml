clauses:
  - id: SHL.SB.TAI.273
    no: 273
    text: 太阴之为病，腹满而吐，食不下，自利益甚，时腹自痛。若下之，必胸下结硬。
    translation: 太阴病的提纲证，表现为腹部胀满并且呕吐，饮食不下，自行下利越来越严重，时常腹部自痛。如果误用泻下法，必然导致胸下部位结硬。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阴为病，阳邪传里也。太阴之脉布胃中，邪气壅而为腹满。上不得降者，呕吐而食不下；下不得上者，自利益甚，时腹自痛。
      - source: 伤寒缵论
        author: 张璐
        text: 腹满自利，太阴之本证也。吐而食不下，则邪迫于上；利甚而腹满，则邪迫于下。上下交乱，胃中空虚，此但可行温散。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：太阴病本质为脾阳虚弱、寒湿内盛，提纲诸症皆属虚寒；「若下之，必胸下结硬」垂太阴禁下之诫，治当温中散寒，与阳明胃家实之可下恰成对照。
    formulas: []
