  - id: SHL.SB.YM.199
    no: 199
    text: 阳明病，无汗，小便不利，心中懊憹者，身必发黄。
    translation: 阳明病，没有汗，小便不通利，心中懊恼烦闷的，身体必然会发黄。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病无汗而小便不利者，热蕴于内而不得越。心中懊憹者，热气郁蒸，欲发于外而为黄也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 无汗则热不得外越，小便不利则湿不得下泄，湿热内蕴郁蒸则心中懊憹，湿热熏蒸肝胆则身必发黄。此为阳明湿热发黄的典型表现。
    formulas: []
    symptom_tags:
