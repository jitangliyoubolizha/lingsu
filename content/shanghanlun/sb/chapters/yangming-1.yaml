      - SHL.SB.SYM.002
      - SHL.SB.SYM.011
    study_tags:
      - 阳明潮热
      - 脉浮紧
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.202
    no: 202
    text: 阳明病，口燥，但欲漱水，不欲咽者，此必衄。
    translation: 阳明病，口中干燥，只想用水漱口，不想咽下去的，这必然会鼻出血。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明之脉，起于鼻，络于口。阳明里热，则渴欲饮水。此口燥但欲漱水不欲咽者，是热在经而里无□热也。阳明气血俱多，经中热甚，迫血妄行，必作衄也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 口燥但欲漱水不欲咽，为热在血分不在气分。血分有热则血热妄行，故必衄。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.132
      - SHL.SB.SYM.056
    study_tags:
      - 阳明衄血
      - 热在血分
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.203
    no: 203
    text: 阳明病，本自汗出，医更重发汗，病已差，尚微烦不了了者，此必大便硬故也。以亡津液，胃中干燥，故令大便硬。当问其小便日几行，若本小便日三四行，今日再行，故知大便不久出。今为小便数少，以津液当还入胃中，故知不久必大便也。
    translation: 阳明病，本来自然出汗，医生又重新发汗，病已经好了，还有微微烦躁不清楚的，这必然是因为大便硬的缘故。因为亡失津液，胃中干燥，所以导致大便硬。应当问患者小便一天几次，如果本来小便一天三四次，今天只有两次，所以知道大便不久就会排出。现在因为小便次数减少，津液应当还流入胃肠中，所以知道不久必然会排大便。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 先亡津液，使大便硬。小便数少，津液分别，大便必自下也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 本自汗出又发汗，津液更伤，胃中干燥则大便硬。微烦不了了为腑气不通。通过观察小便次数判断津液恢复情况：小便减少说明津液还入胃肠，大便将自通。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.014
    study_tags:
      - 津液还入
      - 小便判断大便
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.204
    no: 204
    text: 伤寒呕多，虽有阳明证，不可攻之。
    translation: 伤寒病呕吐多的，虽然有阳明证，也不可以用泻下法。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 呕者，热在上焦，未全入府，故不可下。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 呕多为病势向上，邪在上焦或少阳。虽有阳明证，但病势向上则不可逆其势而下之。当因势利导。
    formulas: []
    symptom_tags:
