clauses:
  - id: SHL.SB.YM.179
    no: 179
    text: 问曰：病有太阳阳明，有正阳阳明，有少阳阳明，何谓也？答曰：太阳阳明者，脾约是也；正阳阳明者，胃家实是也；少阳阳明者，发汗利小便已，胃中燥烦实，大便难是也。
    translation: 问：病有太阳阳明、正阳阳明、少阳阳明，是什么意思？答：太阳阳明，就是脾约证；正阳阳明，就是胃家实证；少阳阳明，就是发汗、利小便之后，胃中干燥、烦躁、有实邪，大便困难的证候。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明，胃也。邪自太阳经，传之入府者，谓之太阳阳明。经曰：太阳病，若吐，若下，若发汗后，微烦，小便数，大便因硬者，与小承气汤。即是太阳阳明脾约病也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病有三种来路：太阳阳明为太阳病误治伤津，邪入阳明化燥；正阳阳明为外邪直犯阳明，胃肠实热；少阳阳明为少阳病误汗误利，津伤化燥。三者病机均为燥热实，但来路不同。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.208
    study_tags:
      - 阳明病分类
      - 脾约
      - 胃家实
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.180
    no: 180
    text: 阳明之为病，胃家实是也。
    translation: 阳明病的提纲证，就是胃家实。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 邪传入胃，热毒留结，则胃家为实。华佗曰：热毒入胃，要须下去之，不可留于胃中。是知邪在阳明为胃家实也。
      - source: 伤寒来苏集
        author: 柯琴
        text: 阳明为传化之府，当更实更虚：食入胃实而肠虚，食下肠实而胃虚。若但实不虚，斯为阳明之病根矣。胃实不是阳明病，而阳明之为病，悉从胃实上得来，故以胃家实为阳明一经之总纲也。
      - source: 参考《胡希恕伤寒论讲座》
        author: 灵素内容组
        text: 胡希恕以八纲解六经，视阳明病为里阳证：胃家实即肠道结实、大便难之谓，阳明治法不出清、下二途，本提纲即阳明里实热之总括。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.206
    study_tags:
      - 阳明病提纲
      - 胃家实
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.YM.181
    no: 181
    text: 问曰：何缘得阳明病？答曰：太阳病，若发汗，若下，若利小便，此亡津液，胃中干燥，因转属阳明。不更衣，内实，大便难者，此名阳明也。
    translation: 问：什么原因导致阳明病？答：太阳病，如果发汗、泻下、利小便，这些都会亡失津液，胃中干燥，因而转属阳明。不解大便，内有实邪，大便困难的，这就叫做阳明病。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 本太阳病不解，因汗利小便，亡津液，胃中干燥，太阳之邪入府，转属阳明。古人登厠必更衣，不更衣者，通为不大便。不更衣，则胃中物不得泄，故为内实。胃无津液，加之畜热，大便则难，为阳明里实也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阳病误治（汗、下、利小便）均可伤津，津伤则胃肠干燥，邪从燥化而转属阳明。不更衣（不大便）、内实、大便难为阳明病的特征性表现。
    formulas: []
    symptom_tags: []
    study_tags:
      - 阳明病成因
      - 转属阳明
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.182
    no: 182
    text: 问曰：阳明病外证云何？答曰：身热，汗自出，不恶寒，反恶热也。
    translation: 问：阳明病的外在表现是什么？答：身体发热，自然出汗，不怕冷，反而怕热。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病，为邪入府也。邪在表，则身热汗出而恶寒。邪既入府，则表证已罢，故不恶寒，但身热汗出而恶热也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病外证四大特征：身热、汗自出、不恶寒、反恶热。里热炽盛外蒸则身热汗出，表邪已解则不恶寒，里热盛则恶热。此与太阳病恶寒发热形成对比。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.004
    study_tags:
      - 阳明病外证
      - 身热汗出
      - 不恶寒反恶热
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.183
    no: 183
    text: 问曰：病一日得之，不发热而恶寒者，何也？答曰：虽得之一日，恶寒将自罢，即自汗出而恶热也。
    translation: 问：病一天就得了，不发热却怕冷的，为什么？答：虽然得病一天，怕冷将会自行消失，随即自然出汗而怕热。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 邪客在阳明，当发热而不恶寒。今得之一日，犹不发热而恶寒者，即邪未全入府，尚带表邪。若表邪全入，则更无恶寒，必自汗出而恶热也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病初起可见短暂恶寒，但很快恶寒自罢，转为汗出恶热。这是因为阳明为多气多血之经，邪入即从燥化，故恶寒短暂。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.003
      - SHL.SB.SYM.004
    study_tags:
      - 阳明初起恶寒
      - 恶寒自罢
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.184
    no: 184
    text: 问曰：恶寒何故自罢？答曰：阳明居中，主土也，万物所归，无所复传，始虽恶寒，二日自止，此为阳明病也。
    translation: 问：怕冷为什么会自行消失？答：阳明位居中焦，主土，是万物归聚之处，邪气到此无所再传，开始虽然怕冷，第二天就会自行停止，这就是阳明病。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 胃为水谷之海，主养四旁。四旁有病，皆能传入于胃。入胃，则更不复传。如太阳病传之入胃，则更不传阳明。阳明病传之入胃，则更不传少阳。少阳病传之入胃，则更不传三阴。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明属土居中，为万物所归。邪入阳明则从燥化，不再他传，故恶寒自罢。此条从五行角度解释阳明病恶寒自罢的机理。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.003
    study_tags:
      - 阳明居中主土
      - 恶寒自罢
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.185
    no: 185
    text: 本太阳，初得病时，发其汗，汗先出不彻，因转属阳明也。伤寒发热无汗，呕不能食，而反汗出濈濈然者，是转属阳明也。
    translation: 本来是太阳病，刚得病时，发汗，汗先出不透彻，因而转属阳明。伤寒发热没有汗，呕吐不能进食，却反而出汗濈濈然的，这是转属阳明了。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒传经者，则一日太阳，二日阳明。此太阳传经，故曰转属阳明。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阳病发汗不彻，表邪未尽，邪热内传入里转属阳明。或太阳伤寒本无汗，若见汗出濈濈然（汗出连绵），说明邪已入里化热，转属阳明。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.024
      - SHL.SB.SYM.013
      - SHL.SB.SYM.148
      - SHL.SB.SYM.004
    study_tags:
      - 太阳转阳明
      - 汗出不彻
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.186
    no: 186
    text: 伤寒三日，阳明脉大。
    translation: 伤寒病第三天，阳明病脉象大。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒三日，邪传阳明之时。经曰：尺寸俱长者，阳明受病，当二三日发。阳明气血俱多，又邪并于经，是以脉大。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 伤寒三日邪入阳明，阳明为多气多血之经，邪热盛则脉大。脉大为阳明病的特征性脉象。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.209
    study_tags:
      - 阳明脉大
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.187
    no: 187
    text: 伤寒脉浮而缓，手足自温者，是为系在太阴。太阴者，身当发黄，若小便自利者，不能发黄。至七八日大便硬者，为阳明病也。
    translation: 伤寒病脉象浮而缓，手足自然温暖的，这是病在太阴。太阴病，身体应当发黄，如果小便自然通利的，就不会发黄。到了七八天大便变硬的，就是阳明病了。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮为阳邪，缓为脾脉。伤寒脉浮缓，太阴客热。邪在三阳，则手足热；邪在三阴，则手足寒。今手足自温，是知繋在太阴也。太阴，土也，为邪蒸之，则色见于外，当发身黄。小便自利者，热不内畜，不能发黄。至七八日大便硬者，即太阴之邪入府，转属阳明也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮缓、手足温为太阴表证。太阴湿郁可发黄，小便自利则湿有出路不发黄。若七八日大便硬，说明湿从燥化，太阴转属阳明。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.050
      - SHL.SB.SYM.069
    study_tags:
      - 太阴转阳明
      - 大便硬
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.188
    no: 188
    text: 伤寒转系阳明者，其人濈然微汗出也。
    translation: 伤寒病转属阳明的，患者会濈濈然微微出汗。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒则无汗，阳明法多汗。此以伤寒邪转系阳明，故濈然微汗出。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 濈然微汗出为阳明病的特征性表现，里热蒸腾则汗出。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.004
    study_tags:
      - 阳明汗出
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.189
    no: 189
    text: 阳明中风，口苦咽干，腹满微喘，发热恶寒，脉浮而紧，若下之，则腹满小便难也。
    translation: 阳明病感受风邪，口苦咽干，腹部胀满轻微气喘，发热怕冷，脉象浮而紧，如果用泻下法，就会导致腹部胀满、小便困难。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脉浮在表，紧为里实。阳明中风，口苦咽干，腹满微喘者，热传于里也。发热恶寒者，表仍未解也。若下之，里邪虽去，表邪复入于里，又亡津液，故使腹满而小便难。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明中风兼有表证（发热恶寒脉浮紧），里证未实（腹满微喘）。此时禁用下法，误下则表邪内陷，气机更滞则腹满，津伤则小便难。
    formulas: []
    symptom_tags:
