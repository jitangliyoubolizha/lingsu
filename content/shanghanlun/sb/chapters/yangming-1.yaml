      - 呕多不可攻
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.205
    no: 205
    text: 阳明病，心下硬满者，不可攻之。攻之利遂不止者死，利止者愈。
    translation: 阳明病，心下硬满的，不可以用泻下法。泻下后下利不止的会死，下利停止的会好。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病腹满者，为邪气入府，可下之。心下硬满，则邪气尚浅，未全入府，不可便下之。得利止者，为邪气去，正气安，正气安则愈。若因下利不止者，为正气脱而死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 心下硬满为邪在胸膈（上焦），非阳明腑实（中下焦）。误下则正气大伤，利不止为阳气下脱故死，利止为正气尚能恢复故愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.066
      - SHL.SB.SYM.039
    study_tags:
      - 阳明禁下
      - 心下硬满
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.206
    no: 206
    text: 阳明病，面合色赤，不可攻之，必发热色黄者，小便不利也。
    translation: 阳明病，满面通红的，不可以用泻下法，必然会导致发热、面色发黄，这是因为小便不通利的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 合，通也。阳明病，面色通赤者，热在经也，不可下之。下之虚其胃气，耗其津液，经中之热乘虚入胃，必发热色黄，小便不利也。
