      - SHL.SB.SYM.031
      - SHL.SB.SYM.091
      - SHL.SB.SYM.018
      - SHL.SB.SYM.001
      - SHL.SB.SYM.003
      - SHL.SB.SYM.011
    study_tags:
      - 阳明中风
      - 禁下
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.190
    no: 190
    text: 阳明病，若能食，名中风；不能食，名中寒。
    translation: 阳明病，如果能够进食的，叫做中风；不能进食的，叫做中寒。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病以饮食别受风寒者，以胃为水谷之海。风为阳邪，阳邪杀谷，故中风者能食。寒为阴邪，阴邪不杀谷，故伤寒者不能食。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病以能食与否辨别中风与中寒。能食为中风（风为阳邪，阳能消谷），不能食为中寒（寒为阴邪，阴不消谷）。此为阳明病的寒热辨证要点。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.148
    study_tags:
      - 阳明中风
      - 阳明中寒
      - 能食辨证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.191
    no: 191
    text: 阳明病，若中寒者，不能食，小便不利，手足濈然汗出，此欲作固瘕，必大便初硬后溏。所以然者，以胃中冷，水谷不别故也。
    translation: 阳明病，如果是中寒的，不能进食，小便不通利，手足濈濈然出汗，这是将要形成固瘕证，大便必然开始硬后来溏。之所以这样，是因为胃中寒冷，水谷不能分别的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明中寒，不能食者，寒不杀谷也。小便不利者，津液不化也。阳明病法多汗，则周身汗出。此手足濈然汗出而身无汗者，阳明中寒也。固瘕者，寒气结积也。胃中寒甚，欲留结而为固瘕，则津液不得通行，而大便必硬者，若汗出，小便不利者，为实也。此以小便不利，水谷不别，虽大便初硬，后必溏也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明中寒，胃阳不足不能腐熟水谷，故不能食。胃寒水液不化，故小便不利。手足汗出为阳虚不固。大便初硬后溏为胃中虚冷、水谷不别，欲作固瘕（寒积）。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.148
      - SHL.SB.SYM.028
      - SHL.SB.SYM.004
    study_tags:
      - 阳明中寒
      - 固瘕
      - 大便初硬后溏
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.192
    no: 192
    text: 阳明病，初欲食，小便反不利，大便自调，其人骨节疼，翕翕如有热状，奄然发狂，濈然汗出而解者，此水不胜谷气，与汗共并，脉紧则愈。
    translation: 阳明病，开始想要进食，小便反而不通利，大便自然正常，患者骨节疼痛，翕翕然好像有热的样子，突然发狂，濈濈然出汗而解除的，这是水湿不能胜过谷气，与汗一起排出，脉象紧就会好。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳病客热，初传入胃。胃热则消谷而欲食。阳明病热为实者，则小便当数，大便当硬。今小便反不利，大便自调者，热气散漫，不为实也。欲食则胃中谷多。《内经》曰：食入于阴，长气于阳。谷多则阳气胜，热消津液则水少。经曰：水入于经，其血乃成。水少则阴血弱。《金匮要略》曰：阴气不通即骨疼。其人骨节疼者，阴气不足也。热甚于表者，翕翕发热；热甚于里者，蒸蒸发热。此热气散漫，不专著于表里，故翕翕如有热状。奄，忽也。忽然发狂者，阴不胜阳也。《内经》曰：阴不胜其阳者，则脉流薄疾，并乃狂。阳明蕴热为实者，须下之愈；热气散漫不为实者，必待汗出而愈，故云濈然汗出而解也。水谷之等者，阴阳气平也。水不胜谷气，是阴不胜阳也。汗出则阳气衰，脉紧则阴气生。阴阳气平，两无偏胜，则愈。故云与汗共并，脉紧则愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 欲食说明胃气尚强，小便不利为水湿内停，骨节疼为湿邪在表。奄然发狂为正邪剧烈交争，濈然汗出为正胜邪却、水湿随汗而解。脉紧为邪去正复。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.148
      - SHL.SB.SYM.028
      - SHL.SB.SYM.043
      - SHL.SB.SYM.004
    study_tags:
      - 阳明湿解
      - 水不胜谷气
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.193
    no: 193
    text: 阳明病，欲解时，从申至戌上。
    translation: 阳明病容易解除的时间，是从申时到戌时（下午三点至晚上九点）。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 以胃为阳土，王于申酉戌，向王时，是为欲解。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 申酉戌为阳明经气旺盛之时，正气得时气相助则邪易解。此为阳明病的欲解时辰。
