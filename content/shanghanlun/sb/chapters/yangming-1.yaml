  - id: SHL.SB.YM.207
    no: 207
    text: 阳明病，不吐不下，心烦者，可与调胃承气汤。
    translation: 阳明病，没有呕吐也没有泻下，心中烦躁的，可以给调胃承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 吐后心烦，谓之内烦；下后心烦，谓之虚烦。今阳明病不吐不下心烦，即是胃有郁热也。与调胃承气汤以下郁热。
      - source: 项目自编（待校对）
        author: 灵素内容组
