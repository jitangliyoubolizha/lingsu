      - 误下致哕
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.195
    no: 195
    text: 阳明病，脉迟，食难用饱，饱则微烦头眩，必小便难，此欲作谷疸。虽下之，腹满如故，所以然者，脉迟故也。
    translation: 阳明病，脉象迟，进食难以吃饱，吃饱就会微微烦躁、头晕目眩，必然小便困难，这是将要发生谷疸。虽然用泻下法，腹部胀满还是和原来一样，之所以这样，是因为脉迟的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病脉迟，则邪方入里，热未为实也。食入于阴，长气于阳。胃中有热，食难用饱，饱则微烦而头□者，谷气与热气相搏也。两热相合，消抟津液，必小便难。利者不能发黄，言热得泄也。小便不利，则热不得泄，身必发黄，疸黄也，以其发于谷气之热，故名谷疸。热实者下之则愈，脉迟为热气未实，虽下之腹满亦不减也。经曰：脉迟尚未可攻。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉迟为胃中虚寒，食难用饱为胃阳不足。饱则微烦头眩为食滞不化、浊气上逆。小便难为水液不化。欲作谷疸为寒湿郁蒸。误下则更伤阳气，腹满不除。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.087
