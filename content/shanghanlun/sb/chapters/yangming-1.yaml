      - 呕咳厥头痛
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.198
    no: 198
    text: 阳明病，但头眩，不恶寒，故能食而咳，其人咽必痛。若不咳者，咽不痛。
    translation: 阳明病，只是头晕目眩，不怕冷，所以能够进食并且咳嗽，患者咽喉必然疼痛。如果不咳嗽的，咽喉就不痛。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病，身不重痛，但头□而不恶寒者，阳明中风，而风气内攻也。经曰：阳明病若能食名中风。风邪攻胃，胃气上逆则咳，阙□胃之系，咳甚则咽伤，故必咽痛。若胃气不逆，则不咳，其咽亦不痛也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 头眩不恶寒为阳明热证，能食为胃中有热。咳为热邪上迫肺系，咽痛为热邪上攻咽喉。不咳说明热不上迫，故咽不痛。
    formulas: []
    symptom_tags:
