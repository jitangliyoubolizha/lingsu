  - id: SHL.SB.YM.209
    no: 209
    text: 阳明病，潮热，大便微硬者，可与大承气汤，不硬者，不可与之。若不大便六七日，恐有燥屎，欲知之法，少与小承气汤，汤入腹中，转失气者，此有燥屎也，可攻之。若不转失气者，此但初头硬，后必溏，不可攻之，攻之必胀满不能食也。欲饮水者，与水则哕。其后发热者，必大便复硬而少也，以小承气汤和之。不转失气者，慎不可攻也。
    translation: 阳明病，潮热，大便微微变硬的，可以给大承气汤，不变硬的，不可以给。如果六七天不大便，恐怕有燥屎，想知道的方法，少量给予小承气汤，汤药进入腹中，放屁的，这是有燥屎，可以攻下。如果不放屁的，这只是开始硬，后来必然溏，不可以攻下，攻下必然会导致胀满不能进食。想要饮水的，给水就会呃逆。之后又发热的，必然是大便又变硬而且量少，用小承气汤调和。不放屁的，千万不可以攻下。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 潮热者实，得大便微硬者，便可攻之。若不硬者，则热未成实，虽有潮热，亦未可攻。若不大便六七日，恐有燥屎，当先与小承气汤渍之。如有燥屎，小承气汤药势缓，不能宣泄，必转气下失。若不转失气，是胃中无燥屎，但肠间少硬尔，止初头硬，后必溏，攻之则虚其胃气，致腹胀满不能食也。胃中干燥，则欲饮水，水入胃中，虚寒相搏，气逆则哕。其后却发热者，则热气乘虚还复聚于胃中，胃燥得热，必大便复硬而少，与小承气汤，微利与和之。故以重云：不转失气，不可攻内，慎之至也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 潮热、大便硬为腑实已成，可用大承气汤。若不确定有无燥屎，可用小承气汤试探：转失气（放屁）说明有燥屎可攻，不转失气说明无燥屎不可攻。误攻则伤脾胃致胀满不能食。
    formulas:
      - SHL.SB.F.112
      - SHL.SB.F.113
