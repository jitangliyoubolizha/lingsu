  - id: SHL.SB.YM.208
    no: 208
    text: 阳明病，脉迟，虽汗出不恶寒者，其身必重，短气，腹满而喘，有潮热者，此外欲解，可攻里也。手足濈然汗出者，此大便已硬也，大承气汤主之。若汗多，微发热恶寒者，外未解也，其热不潮，未可与承气汤。若腹大满不通者，可与小承气汤，微和胃气，勿令至大泄下。
    translation: 阳明病，脉象迟，虽然出汗不怕冷的，身体必然沉重，气短，腹部胀满并且气喘，有潮热的，这是表证将要解除，可以攻里了。手足濈濈然出汗的，这是大便已经变硬了，用大承气汤主治。如果汗多，轻微发热怕冷的，是表证尚未解除，发热不是潮热，不可以给承气汤。如果腹部非常胀满不通的，可以给小承气汤，轻微调和胃气，不要导致大泻下。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 四肢诸阳之本，津液足为热蒸之，则周身汗出；津液不足为热蒸之，其手足濈然而汗出，知大便已硬也。与大承气汤，以下胃热。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 脉虽迟，犹可攻之。以腹满便闭，里气不行，故脉为之濡滞不利，非可比于迟则为寒之例也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：本条示攻下之辨——潮热、手足濈然汗出为燥屎已成之确据，可与大承气；热不潮、表未解者禁攻，腹大满不通者只与小承气微和胃气，三承气汤轻重由此而分。
