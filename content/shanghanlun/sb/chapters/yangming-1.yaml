  - id: SHL.SB.YM.196
    no: 196
    text: 阳明病，法多汗，反无汗，其身如虫行皮中状者，此以久虚故也。
    translation: 阳明病，按理应当多汗，反而没有汗，身体好像有虫子在皮肤中爬行的样子，这是因为长久虚弱的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 胃为津液之本，气虚津液少，病则反无汗。胃候身之肌肉，其身如虫行皮中者，知胃气久虚也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病本应多汗（热盛迫津外泄），反无汗为津液不足或阳气虚弱。身如虫行皮中为正气虚不能鼓邪外出、邪郁肌表之象。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.024
    study_tags:
