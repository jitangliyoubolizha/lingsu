      - SHL.SB.SYM.028
      - SHL.SB.SYM.069
    study_tags:
      - 误火发黄
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.201
    no: 201
    text: 阳明病，脉浮而紧者，必潮热，发作有时。但浮者，必盗汗出。
    translation: 阳明病，脉象浮而紧的，必然会有潮热，发作有定时。只是浮脉的，必然会有盗汗出现。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮为在经，紧者里实。脉浮而紧者，表热里实也，必潮热发作有时。若脉但浮而不紧者，止是表热也，必盗汗出。盗汗者，睡而汗出也。阳明病里热者自汗，表热者盗汗。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮紧为表邪未尽、里热已成，正邪交争则潮热有时。脉但浮为表虚不固，阴虚则盗汗。
    formulas: []
    symptom_tags:
