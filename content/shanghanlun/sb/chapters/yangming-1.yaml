      - 久虚
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.197
    no: 197
    text: 阳明病，反无汗，而小便利，二三日呕而咳，手足厥者，必苦头痛。若不咳不呕，手足不厥者，头不痛。
    translation: 阳明病，反而没有汗，而小便通利，两三天后呕吐并且咳嗽，手足厥冷的，必然会剧烈头痛。如果不咳嗽不呕吐，手足不厥冷的，头就不痛。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阙阳明伤寒而□寒气内攻也。至二三日，阙□者，寒邪发于外也，必苦头痛。若不咳不呕手足不厥者，是寒邪但攻里而不外发，其头亦不痛也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病无汗而小便利为寒邪内盛。呕咳为寒邪上逆，手足厥为阳虚不达四末，头痛为寒邪上攻。若不呕不咳不厥，说明寒邪不盛，故头不痛。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.024
      - SHL.SB.SYM.143
      - SHL.SB.SYM.013
      - SHL.SB.SYM.047
