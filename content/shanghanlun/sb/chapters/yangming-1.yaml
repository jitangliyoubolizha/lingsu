    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.200
    no: 200
    text: 阳明病，被火，额上微汗出，而小便不利者，必发黄。
    translation: 阳明病，被火法治疗，额头微微出汗，而小便不通利的，必然会发黄。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病，则为内热，被火则火热相合而甚。若遍身汗出而小便利者，热得外越，不能发黄。今额上微汗出而小便不利，则热不得越，郁蒸于胃，必发黄也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明病本有里热，误用火法则热更盛。额上微汗出为热不得外越，小便不利为湿不得下泄，湿热郁蒸必发黄。
    formulas: []
    symptom_tags:
