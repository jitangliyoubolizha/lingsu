      - 转失气
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.210
    no: 210
    text: 夫实则谵语，虚则郑声。郑声者，重语也。直视谵语，喘满者死，下利者亦死。
    translation: 实证就会谵语，虚证就会郑声。郑声，就是重复说话。两眼直视并且谵语，气喘胀满的会死，下利的也会死。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 《内经》曰：邪气盛则实，精气夺则虚。谵语由邪气盛而神识昏也。郑声由精气夺而声不全也。谵语者，言语不次也。郑声者，郑音不正也。《论语》云：恶郑声之乱雅乐。又曰：放郑声，远佞人，郑声淫，佞人殆。言郑声不正也。今新差气虚人，声转者，是所谓重语者也。若声重，亦声转之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 谵语为实热扰心，郑声为气虚神散（重复语言）。直视谵语为肝肾阴竭、心神将脱。喘满为肺气将绝，下利为脾肾阳亡，均为死证。
    formulas: []
