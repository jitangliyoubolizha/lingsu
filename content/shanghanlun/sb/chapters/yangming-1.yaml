  - id: SHL.SB.YM.194
    no: 194
    text: 阳明病，不能食，攻其热必哕。所以然者，胃中虚冷故也。以其人本虚，攻其热必哕。
    translation: 阳明病，不能进食的，用泻下法攻热必然会导致呃逆。之所以这样，是因为胃中虚冷的缘故。因为患者本来虚寒，攻热必然会呃逆。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 不能食，胃中本寒，攻其热，复虚其胃，虚寒相搏，故令哕也。经曰：关脉弱，胃气虚，有热，不可大攻之，热去则寒起。此之谓也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 不能食为胃中虚寒（中寒证），非阳明实热。误用寒下攻热则更伤胃阳，胃气上逆则哕。此为阳明中寒禁用下法之戒。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.148
      - SHL.SB.SYM.150
    study_tags:
