      - SHL.SB.SYM.047
      - SHL.SB.SYM.046
      - SHL.SB.SYM.028
      - SHL.SB.SYM.151
      - SHL.SB.SYM.039
    study_tags:
      - 四逆散证
      - 阳气郁遏
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.319
    no: 319
    text: 少阴病，下利六七日，咳而呕渴，心烦不得眠者，猪苓汤主之。
    translation: 少阴病，下利六七天，咳嗽并且呕吐口渴，心中烦躁不能入睡的，用猪苓汤主治。
