      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利伤阴，阴虚生热，水热互结。咳呕为水气上逆，渴为阴虚津伤，心烦不得眠为阴虚火旺、心神被扰。猪苓汤滋阴利水、清热除烦。
    formulas:
