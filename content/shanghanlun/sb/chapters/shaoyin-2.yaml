  - id: SHL.SB.SI.320
    no: 320
    text: 少阴病，得之二三日，口燥咽干者，急下之，宜大承气汤。
    translation: 少阴病，得病两三天，口燥咽干的，应当紧急泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒传经五六日，邪传少阴，则口燥舌干而渴，为邪渐深也。今少阴病得之二三日，邪气未深入之时，便作口燥咽干者，是邪热已甚，肾水干也。急与大承气汤下之，以全肾也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴病本为虚寒，但若邪从热化、热结旁流，口燥咽干为热盛伤津之象，当急下存阴。大承气汤峻下热结，釜底抽薪以救阴液。此为少阴急下三证之一。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.132
      - SHL.SB.SYM.031
    study_tags:
      - 少阴急下证
      - 大承气汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.321
    no: 321
    text: 少阴病，自利清水，色纯青，心下必痛，口干燥者，急下之，宜大承气汤。
    translation: 少阴病，自行下利清水，颜色纯青，心下必然疼痛，口中干燥的，应当紧急泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴肾水也，青肝色也。自利色青，为肝邪乗肾。《难经》曰：从前来者为实邪。以肾蕴实邪，必心下痛，口干燥也。与大承气汤以下实邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 自利清水、色纯青为热结旁流，心下痛为实热内结，口干燥为热盛伤津。此为少阴急下三证之二，当急下存阴。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.027
      - SHL.SB.SYM.132
    study_tags:
      - 少阴急下证
      - 热结旁流
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.322
    no: 322
    text: 少阴病，六七日，腹胀不大便者，急下之，宜大承气汤。
    translation: 少阴病，六七天，腹部胀满不解大便的，应当紧急泻下，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 此少阴入府也。六七日，少阴之邪入府之时，阳明内热壅甚，腹满不大便也。阳明病，土胜肾水则干，急与大承气汤下之，以救肾水。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 腹胀不大便为阳明腑实，热结于里。少阴病见此证为邪从热化、热盛伤阴，当急下存阴。此为少阴急下三证之三。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.091
    study_tags:
      - 少阴急下证
      - 阳明腑实
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.323
    no: 323
    text: 少阴病，脉沉者，急温之，宜四逆汤。
    translation: 少阴病，脉象沉的，应当紧急温阳，适合用四逆汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 既吐且利，小便复利，而大汗出，下利清谷，内寒外热，脉微欲绝者，不云急温。此少阴病脉沉，而云急温者，彼虽寒甚，然而证巳形见于外，治之则有成法。此初头脉沉，未有形证，不知邪气所之，将发何病，是急与四逆汤温之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉沉为阳气衰微、阴寒内盛，当急温回阳。四逆汤（附子、干姜、甘草）为回阳救逆之要方。
    formulas:
      - SHL.SB.F.015
    symptom_tags:
      - SHL.SB.SYM.210
    study_tags:
      - 少阴急温
      - 四逆汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.324
    no: 324
    text: 少阴病，饮食入口则吐，心中温温欲吐，复不能吐，始得之，手足寒，脉弦迟者，此胸中实，不可下也，当吐之。若膈上有寒饮，干呕者，不可吐也，当温之，宜四逆汤。
    translation: 少阴病，饮食入口就吐，心中郁闷想吐，又吐不出来，刚得病时，手足寒冷，脉象弦迟的，这是胸中有实邪，不可以泻下，应当涌吐。如果膈上有寒饮，干呕的，不可以涌吐，应当温阳，适合用四逆汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒表邪传里，至于少阴。少阴之脉从肺出络心，注胸中。邪既留于胸中而不散者，饮食入口则吐，心中温温欲吐。阳受气于胸中，邪既留于胸中，则阳气不得宣发于外，是以始得之手足寒，脉□迟。此是胸中实，不可下，而当吐。其膈上有寒饮，亦使人心中温温而手足寒。吐则物出，呕则物不出，吐与呕别焉。胸中实则吐而物出，若膈上有寒饮，则但干呕而不吐也。此不可吐，可与四逆汤以温其膈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 胸中实邪壅塞，饮食入口即吐，手足寒、脉弦迟为实邪阻滞、阳气不达，当吐以祛邪。若膈上寒饮干呕，为阳虚饮停，当温阳化饮，用四逆汤。
    formulas:
      - SHL.SB.F.015
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.008
      - SHL.SB.SYM.172
    study_tags:
      - 少阴吐法
      - 胸中实
      - 膈上寒饮
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.325
    no: 325
    text: 少阴病，下利，脉微涩，呕而汗出，必数更衣，反少者，当温其上，灸之。
    translation: 少阴病，下利，脉象微涩，呕吐并且出汗，必然频繁上厕所，反而大便量少的，应当温灸其上部。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脉微为亡阳，涩为亡血。下利呕而汗出，亡阳亡血也。津液不足，里有虚寒，必数更衣反少者，温其上，以助其阳也；炙之，以消其阴。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利脉微涩为阳虚血少，呕而汗出为阳气上越。数更衣反少为里急后重、气虚下陷。当温灸上部（百会等穴）以升阳举陷。
