  - id: SHL.SB.SI.324
    no: 324
    text: 少阴病，饮食入口则吐，心中温温欲吐，复不能吐，始得之，手足寒，脉弦迟者，此胸中实，不可下也，当吐之。若膈上有寒饮，干呕者，不可吐也，当温之，宜四逆汤。
    translation: 少阴病，饮食入口就吐，心中郁闷想吐，又吐不出来，刚得病时，手足寒冷，脉象弦迟的，这是胸中有实邪，不可以泻下，应当涌吐。如果膈上有寒饮，干呕的，不可以涌吐，应当温阳，适合用四逆汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 胸中实邪壅塞，饮食入口即吐，手足寒、脉弦迟为实邪阻滞、阳气不达，当吐以祛邪。若膈上寒饮干呕，为阳虚饮停，当温阳化饮，用四逆汤。
    formulas:
      - SHL.SB.F.015
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.008
      - SHL.SB.SYM.172
    study_tags:
      - 少阴吐法
      - 胸中实
      - 膈上寒饮
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.325
    no: 325
    text: 少阴病，下利，脉微涩，呕而汗出，必数更衣，反少者，当温其上，灸之。
    translation: 少阴病，下利，脉象微涩，呕吐并且出汗，必然频繁上厕所，反而大便量少的，应当温灸其上部。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利脉微涩为阳虚血少，呕而汗出为阳气上越。数更衣反少为里急后重、气虚下陷。当温灸上部（百会等穴）以升阳举陷。
    formulas: []
    symptom_tags:
