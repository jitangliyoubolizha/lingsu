    notes: AI 初稿待校对。
  - id: SHL.SB.SI.321
    no: 321
    text: 少阴病，自利清水，色纯青，心下必痛，口干燥者，急下之，宜大承气汤。
    translation: 少阴病，自行下利清水，颜色纯青，心下必然疼痛，口中干燥的，应当紧急泻下，适合用大承气汤。
