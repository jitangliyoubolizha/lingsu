    notes: AI 初稿待校对。
  - id: SHL.SB.SI.320
    no: 320
    text: 少阴病，得之二三日，口燥咽干者，急下之，宜大承气汤。
    translation: 少阴病，得病两三天，口燥咽干的，应当紧急泻下，适合用大承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴病本为虚寒，但若邪从热化、热结旁流，口燥咽干为热盛伤津之象，当急下存阴。大承气汤峻下热结，釜底抽薪以救阴液。此为少阴急下三证之一。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.132
      - SHL.SB.SYM.031
    study_tags:
