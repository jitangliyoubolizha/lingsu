    text: 少阴病，下利便脓血者，桃花汤主之。
    translation: 少阴病，下利并且大便带脓血的，用桃花汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴虚寒，脾肾阳衰，不能固摄，下利便脓血为滑脱不禁之象。桃花汤温涩固脱，赤石脂涩肠止利，干姜温中散寒，粳米养胃和中。
