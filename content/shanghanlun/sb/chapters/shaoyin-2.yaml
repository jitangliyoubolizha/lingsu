  - id: SHL.SB.SI.314
    no: 314
    text: 少阴病，下利，白通汤主之。
    translation: 少阴病，下利的，用白通汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴虚寒下利，白通汤（葱白、干姜、附子）温阳散寒、通阳止利。葱白通阳达表，干姜附子温里散寒。
    formulas:
      - SHL.SB.F.095
    symptom_tags:
      - SHL.SB.SYM.039
    study_tags:
