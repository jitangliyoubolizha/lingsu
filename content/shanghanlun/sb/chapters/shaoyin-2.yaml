  - id: SHL.SB.SI.315
    no: 315
    text: 少阴病，下利脉微者，与白通汤；利不止，厥逆无脉，干呕烦者，白通加猪胆汁汤主之。服汤脉暴出者死，微续者生。
    translation: 少阴病，下利脉象微弱的，给白通汤；如果下利不止，四肢冰冷、摸不到脉搏，干呕烦躁的，用白通加猪胆汁汤主治。服药后脉象突然出现的会死，脉象渐渐恢复的能活。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利脉微为阳虚，白通汤温阳止利。若利不止、厥逆无脉、干呕烦，为阴寒格拒、阳药难入，加猪胆汁苦寒反佐，引阳入阴。脉暴出为虚阳外脱故死，微续为阳气渐复故生。
    formulas:
      - SHL.SB.F.095
      - SHL.SB.F.096
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.023
      - SHL.SB.SYM.032
      - SHL.SB.SYM.008
      - SHL.SB.SYM.014
    study_tags:
      - 白通加猪胆汁汤
      - 阴寒格拒
      - 脉象预后
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.316
    no: 316
    text: 少阴病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此为有水气。其人或咳，或小便利，或下利，或呕者，真武汤主之。
    translation: 少阴病，两三天不好，到了四五天，腹部疼痛，小便不通畅，四肢沉重疼痛，自行下利的，这是有水气。患者有的咳嗽，有的小便通畅，有的下利，有的呕吐的，用真武汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴阳虚，水湿内停，水气泛溢则四肢沉重疼痛，水走肠间则下利，水气上逆则咳呕。真武汤温阳利水，附子温肾阳，白术健脾，茯苓利水，生姜散水，芍药和营。
    formulas:
      - SHL.SB.F.047
    symptom_tags:
      - SHL.SB.SYM.151
      - SHL.SB.SYM.028
      - SHL.SB.SYM.045
      - SHL.SB.SYM.012
      - SHL.SB.SYM.039
    study_tags:
      - 少阴水气
      - 真武汤
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.317
    no: 317
    text: 少阴病，下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面色赤，或腹痛，或干呕，或咽痛，或利止脉不出者，通脉四逆汤主之。
    translation: 少阴病，下利排出完谷不化的食物，里面寒冷外面发热，手足冰冷，脉象微弱几乎摸不到，身体反而不怕冷，患者面色发红，有的腹痛，有的干呕，有的咽痛，有的下利停止但脉象摸不到的，用通脉四逆汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利清谷、手足厥逆、脉微欲绝为阳虚寒盛之极。身不恶寒、面赤为阴盛格阳、虚阳外越之假热。通脉四逆汤重用姜附，回阳救逆、通达血脉。
    formulas:
      - SHL.SB.F.115
    symptom_tags:
      - SHL.SB.SYM.159
      - SHL.SB.SYM.172
      - SHL.SB.SYM.023
      - SHL.SB.SYM.058
    study_tags:
      - 阴盛格阳
      - 通脉四逆汤
    notes: AI 初稿待校对。
  - id: SHL.SB.SI.318
    no: 318
    text: 少阴病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，四逆散主之。
    translation: 少阴病，四肢冰冷，患者有的咳嗽，有的心悸，有的小便不通畅，有的腹中疼痛，有的泄利并且里急后重的，用四逆散主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 四逆为阳气郁遏不达四末，非阳虚所致。或咳或悸或小便不利或腹痛或泄利下重，皆为气机郁滞之象。四逆散疏肝解郁、透达阳气，柴胡疏肝，枳实理气，芍药和血，甘草和中。
    formulas:
      - SHL.SB.F.098
    symptom_tags:
