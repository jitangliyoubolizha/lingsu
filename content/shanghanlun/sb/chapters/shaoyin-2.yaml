clauses:
  - id: SHL.SB.SI.306
    no: 306
    text: 少阴病，下利便脓血者，桃花汤主之。
    translation: 少阴病，下利并且大便带脓血的，用桃花汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳病下利便脓血者，恊热也。少阴病下利便脓血者，下焦不约而□寒也。与桃花汤，固下散寒。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴虚寒，脾肾阳衰，不能固摄，下利便脓血为滑脱不禁之象。桃花汤温涩固脱，赤石脂涩肠止利，干姜温中散寒，粳米养胃和中。
    formulas:
      - SHL.SB.F.088
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.074
    study_tags:
      - 少阴下利便脓血
      - 桃花汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.307
    no: 307
    text: 少阴病，二三日至四五日，腹痛，小便不利，下利不止，便脓血者，桃花汤主之。
    translation: 少阴病，两三天到四五天，腹部疼痛，小便不通畅，下利不止，大便带脓血的，用桃花汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 二三日以至四五日，寒邪入里深也。腹痛者，□寒也；小便不利者，水谷不别也；下利不止便脓血者，肠胃虚弱，下焦不固也。与桃花汤固肠止利。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 腹痛为寒凝气滞，小便不利为阳虚气化失司，下利不止、便脓血为脾肾阳虚、滑脱不禁。桃花汤温涩固脱止利。
    formulas:
      - SHL.SB.F.088
    symptom_tags:
      - SHL.SB.SYM.151
      - SHL.SB.SYM.028
      - SHL.SB.SYM.039
      - SHL.SB.SYM.074
    study_tags:
      - 少阴滑脱
      - 桃花汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.308
    no: 308
    text: 少阴病，下利便脓血者，可刺。
    translation: 少阴病，下利并且大便带脓血的，可以用针刺治疗。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下焦血气留聚，腐化则为脓血。刺之以利下焦，宣通血气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利便脓血除用桃花汤温涩外，亦可用针刺疗法，疏通经络、调和气血以止利。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.074
    study_tags:
      - 少阴针刺法
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.309
    no: 309
    text: 少阴病，吐利，手足厥冷，烦躁欲死者，吴茱萸汤主之。
    translation: 少阴病，呕吐下利，手足冰冷，烦躁得要死的，用吴茱萸汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 吐利手足厥冷，则阴寒气甚；烦躁欲死者，阳气内争。与吴茱萸汤，助阳散寒。
      - source: 伤寒论辑义
        author: 丹波元简
        text: 吴茱萸汤之用有三：阳明食谷欲呕用之，少阴吐利用之，厥阴干呕吐涎沫者亦用之。要皆以呕吐逆气为主，与四逆汤之吐利厥逆自异。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：吐利厥冷而烦躁欲死，为阴寒内盛、浊阴上逆之危候；吴茱萸汤温肝暖胃、降逆止呕，与四逆汤之回阳救逆各有侧重。
    formulas:
      - SHL.SB.F.089
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
      - SHL.SB.SYM.172
      - SHL.SB.SYM.014
    study_tags:
      - 吴茱萸汤证
      - 肝胃虚寒
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.310
    no: 310
    text: 少阴病，下利咽痛，胸满心烦，猪肤汤主之。
    translation: 少阴病，下利、咽痛，胸中胀满、心中烦躁的，用猪肤汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴之脉，从肾上贯肝膈，入肺中，循喉咙，其支别者，从肺出络心，注胸中。邪自阳经传于少阴，阴虚客热，下利咽痛，胸满心烦也。与猪肤汤，调阴散热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利伤阴，阴虚火旺，虚火上炎则咽痛，扰于胸中则胸满心烦。猪肤汤滋阴润燥、清热利咽，为少阴阴虚咽痛之方。
    formulas:
      - SHL.SB.F.090
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.072
      - SHL.SB.SYM.022
      - SHL.SB.SYM.029
    study_tags:
      - 少阴阴虚咽痛
      - 猪肤汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.311
    no: 311
    text: 少阴病二三日，咽痛者，可与甘草汤，不差，与桔梗汤。
    translation: 少阴病两三天，咽痛的，可以给甘草汤，如果不好，给桔梗汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳邪传于少阴，邪热为咽痛，服甘草汤则差。若寒热相抟为咽痛者，服甘草汤。若不差，与桔梗汤，以和少阴之气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴病初期咽痛较轻者，用甘草汤清热解毒、缓急止痛。若甘草汤不效，说明邪气较重，加桔梗开宣肺气、利咽排脓，即桔梗汤。
    formulas:
      - SHL.SB.F.091
      - SHL.SB.F.092
    symptom_tags:
      - SHL.SB.SYM.072
    study_tags:
      - 少阴咽痛
      - 甘草汤
      - 桔梗汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.312
    no: 312
    text: 少阴病，咽中伤生疮，不能语言，声不出者，苦酒汤主之。
    translation: 少阴病，咽喉受伤生疮，不能说话，声音发不出来的，用苦酒汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 热伤于络，则经络干燥，使咽中伤生疮，不能言语，声不出者，与苦酒汤以解络热，愈咽疮。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 咽中生疮为热毒壅盛、腐肉成疮，不能语言、声不出为咽喉肿痛严重。苦酒汤（半夏、鸡子、苦酒）清热解毒、消肿利咽。
    formulas:
      - SHL.SB.F.093
    symptom_tags:
      - SHL.SB.SYM.072
    study_tags:
      - 少阴咽中生疮
      - 苦酒汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.313
    no: 313
    text: 少阴病，咽中痛，半夏散及汤主之。
    translation: 少阴病，咽喉中疼痛的，用半夏散或半夏汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 甘草汤主少阴客热咽痛，桔梗汤主少阴寒热相抟咽痛，半夏散及汤主少阴客热咽痛也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 咽中痛为寒邪客于咽喉，半夏散（半夏、桂枝、甘草）温散寒邪、利咽止痛。散剂可含化，汤剂可内服。
    formulas:
      - SHL.SB.F.094
    symptom_tags:
      - SHL.SB.SYM.072
    study_tags:
      - 少阴咽痛
      - 半夏散
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.314
    no: 314
    text: 少阴病，下利，白通汤主之。
    translation: 少阴病，下利的，用白通汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴主水，少阴客寒，不能制水，故自利也。白通汤温里散寒。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阴虚寒下利，白通汤（葱白、干姜、附子）温阳散寒、通阳止利。葱白通阳达表，干姜附子温里散寒。
    formulas:
      - SHL.SB.F.095
    symptom_tags:
      - SHL.SB.SYM.039
    study_tags:
      - 少阴虚寒下利
      - 白通汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.315
    no: 315
    text: 少阴病，下利脉微者，与白通汤；利不止，厥逆无脉，干呕烦者，白通加猪胆汁汤主之。服汤脉暴出者死，微续者生。
    translation: 少阴病，下利脉象微弱的，给白通汤；如果下利不止，四肢冰冷、摸不到脉搏，干呕烦躁的，用白通加猪胆汁汤主治。服药后脉象突然出现的会死，脉象渐渐恢复的能活。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 少阴病下利，脉微，为寒极阴胜，与白通汤复阳散寒。服汤利不止，厥逆无脉，干呕烦者，寒气太甚，内为格拒，阳气逆乱也。与白通汤加猪胆汁汤，以和之。《内经》曰：逆而从之，从而逆之。又曰：逆者正治，从者反治。此之谓也。服汤脉暴出者，正气因发泄而脱也，故死。脉微续者，阳气渐复也，故生。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利脉微为阳虚，白通汤温阳止利。若利不止、厥逆无脉、干呕烦，为阴寒格拒、阳药难入，加猪胆汁苦寒反佐，引阳入阴。脉暴出为虚阳外脱故死，微续为阳气渐复故生。
    formulas:
      - SHL.SB.F.095
      - SHL.SB.F.096
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.023
      - SHL.SB.SYM.032
      - SHL.SB.SYM.008
      - SHL.SB.SYM.014
    study_tags:
      - 白通加猪胆汁汤
      - 阴寒格拒
      - 脉象预后
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.SI.316
    no: 316
    text: 少阴病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此为有水气。其人或咳，或小便利，或下利，或呕者，真武汤主之。
    translation: 少阴病，两三天不好，到了四五天，腹部疼痛，小便不通畅，四肢沉重疼痛，自行下利的，这是有水气。患者有的咳嗽，有的小便通畅，有的下利，有的呕吐的，用真武汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 肾主水，肾病不能制水，水饮停为水气。腹痛者，寒湿内甚也；四肢沉重疼痛，寒湿外甚也；小便不利，自下利者，湿胜而水谷不别也。
      - source: 伤寒缵论
        author: 张璐
        text: 此方本治少阴病水饮内结，所以首推术附，兼茯苓生姜之运脾渗水为务。此人所易明也，至用芍药之微旨，非圣人不能。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：少阴阳虚不能制水，水寒之气内外泛溢，故腹痛下利、四肢沉重疼痛而小便不利；真武汤温阳化气行水，与太阳篇真武汤证（82条）互参，一由误汗所致，一属本证自病。
    formulas:
      - SHL.SB.F.047
    symptom_tags:
      - SHL.SB.SYM.151
      - SHL.SB.SYM.028
      - SHL.SB.SYM.045
      - SHL.SB.SYM.012
      - SHL.SB.SYM.039
    study_tags:
      - 少阴水气
      - 真武汤
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.317
    no: 317
    text: 少阴病，下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面色赤，或腹痛，或干呕，或咽痛，或利止脉不出者，通脉四逆汤主之。
    translation: 少阴病，下利排出完谷不化的食物，里面寒冷外面发热，手足冰冷，脉象微弱几乎摸不到，身体反而不怕冷，患者面色发红，有的腹痛，有的干呕，有的咽痛，有的下利停止但脉象摸不到的，用通脉四逆汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利清谷，手足厥逆，脉微欲绝，为里寒；身热不恶寒，面色赤，为外热。此阴甚于内，格阳于外，不相通也。与通脉四逆汤，散阴通阳。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 此寒中少阴，阴盛格阳之证。下利清谷，手足厥逆，脉微欲绝者，阴盛于内也；身热不恶寒，面赤色者，格阳于外也。真阳之气被阴寒所迫，不安其处，而游散于外，故显诸热象，实非热也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：阴盛格阳——里真寒而外假热，身反不恶寒、面色赤为虚阳浮越之征；通脉四逆汤即四逆汤倍干姜，破阴通脉、招纳浮阳。
    formulas:
      - SHL.SB.F.115
    symptom_tags:
      - SHL.SB.SYM.159
      - SHL.SB.SYM.172
      - SHL.SB.SYM.023
      - SHL.SB.SYM.058
    study_tags:
      - 阴盛格阳
      - 通脉四逆汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.318
    no: 318
    text: 少阴病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，四逆散主之。
    translation: 少阴病，四肢冰冷，患者有的咳嗽，有的心悸，有的小便不通畅，有的腹中疼痛，有的泄利并且里急后重的，用四逆散主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 四逆者，四肢不温也。伤寒邪在三阳，则手足必热；传到太阴，手足自温；至少阴，则邪热渐深，故四肢逆而不温也；及至厥阴，则手足厥冷，是又甚于逆。四逆散以散传阴之热。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：阳郁气滞致厥——肝胃气机不畅，阳不布于四末，故四逆而兼或咳、或悸、或泄利下重诸或然症；四逆散疏肝理脾、透达郁阳，为疏方之祖，与阳衰之四逆汤名同实异。
    formulas:
      - SHL.SB.F.098
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.047
      - SHL.SB.SYM.046
      - SHL.SB.SYM.028
      - SHL.SB.SYM.151
      - SHL.SB.SYM.039
    study_tags:
      - 四逆散证
      - 阳气郁遏
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SI.319
    no: 319
    text: 少阴病，下利六七日，咳而呕渴，心烦不得眠者，猪苓汤主之。
    translation: 少阴病，下利六七天，咳嗽并且呕吐口渴，心中烦躁不能入睡的，用猪苓汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利不渴者，里寒也。经曰：自利不渴者，属太阴，以其脏寒故也。此下利、呕、渴，知非里寒；心烦不得眠，知协热也。与猪苓汤渗泄小便，分别水谷。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
