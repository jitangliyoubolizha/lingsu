  - id: SHL.SB.SI.322
    no: 322
    text: 少阴病，六七日，腹胀不大便者，急下之，宜大承气汤。
    translation: 少阴病，六七天，腹部胀满不解大便的，应当紧急泻下，适合用大承气汤。
