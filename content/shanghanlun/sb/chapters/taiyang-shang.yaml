  - id: SHL.SB.TYS.014
    no: 14
    text: 太阳病，项背强几几，反汗出恶风者，桂枝加葛根汤主之。
    translation: 太阳病，颈项背部僵硬拘急不舒，反而汗出怕风的，用桂枝加葛根汤主治。
    annotations:
