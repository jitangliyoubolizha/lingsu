  - id: SHL.SB.TYS.002
    no: 2
    text: 太阳病，发热，汗出，恶风，脉缓者，名为中风。
    translation: 太阳病见到发热、汗出、怕风、脉象缓的，称为中风。
    annotations:
      - source: 示例注本（待校对）
        author: 示例注家
        text: 此条为太阳中风提纲，以发热、汗出、恶风、脉缓为辨证要点。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.004
      - SHL.SB.SYM.005
      - SHL.SB.SYM.006
    study_tags:
      - 中风提纲
    notes: 示例数据，译文与注解需人工校对。
  - id: SHL.SB.TYS.012
    no: 12
    text: 太阳中风，阳浮而阴弱，阳浮者，热自发，阴弱者，汗自出，啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。
    translation: 太阳中风证，卫阳浮盛则发热，营阴弱则汗自出，表现为怕冷怕风、发热、鼻鸣干呕的，用桂枝汤治疗。
    annotations:
      - source: 示例注本（待校对）
        author: 示例注家
        text: 此条为桂枝汤证典型条文，阳浮阴弱概括其病机。
