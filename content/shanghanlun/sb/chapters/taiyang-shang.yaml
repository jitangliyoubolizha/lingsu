  - id: SHL.SB.TYS.029
    no: 29
    text: 伤寒脉浮，自汗出，小便数，心烦，微恶寒，脚挛急，反与桂枝欲攻其表，此误也。得之便厥，咽中干，烦躁吐逆者，作甘草干姜汤与之，以复其阳；若厥愈足温者，更作芍药甘草汤与之，其脚即伸；若胃气不和谵语者，少与调胃承气汤；若重发汗，复加烧针者，四逆汤主之。
    translation: 伤寒脉浮，自汗出，小便次数多，心烦，轻度怕冷，脚部挛急，反而用桂枝汤攻表，这是误治。误治后出现手足厥冷、咽喉干燥、烦躁呕吐的，用甘草干姜汤恢复阳气；如果厥冷好转、脚转温，再用芍药甘草汤，脚就能伸展；如果胃气不和而谵语，少量给调胃承气汤；如果再次发汗又加烧针的，用四逆汤主治。
