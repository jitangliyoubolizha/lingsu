    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.018
    no: 18
    text: 喘家作，桂枝汤加厚朴杏子佳。
    translation: 素有喘病的人患太阳中风，用桂枝汤加厚朴、杏仁较好。
    annotations:
