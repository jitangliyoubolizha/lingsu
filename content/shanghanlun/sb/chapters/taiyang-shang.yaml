  - id: SHL.SB.TYS.015
    no: 15
    text: 太阳病，下之后，其气上冲者，可与桂枝汤，方用前法；若不上冲者，不得与之。
    translation: 太阳病误用泻下后，病人感觉气往上冲的，可以给桂枝汤，按前法服用；如果不觉气上冲，就不可以给桂枝汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以气上冲与否判断表邪是否仍在，决定能否再用桂枝汤。
    formulas:
      - SHL.SB.F.001
    symptom_tags:
      - SHL.SB.SYM.017
    study_tags:
      - 误治
      - 气上冲
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.016
    no: 16
    text: 太阳病三日，已发汗，若吐、若下、若温针，仍不解者，此为坏病，桂枝不中与之也。观其脉证，知犯何逆，随证治之。桂枝本为解肌，若其人脉浮紧、发热汗不出者，不可与之也。常须识此，勿令误也。
    translation: 太阳病三天，已经发汗，又经过催吐、泻下或温针，病仍不解的，这是坏病，桂枝汤不再适用。要观察脉证，弄清误治伤在哪里，再随证处理。桂枝汤本来是解肌的，如果病人脉浮紧、发热而不出汗，就不能用桂枝汤。要常常记住这一点，不要误用。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 强调坏病随证处理，并指出桂枝汤不适用于无汗脉浮紧的表实证。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.011
      - SHL.SB.SYM.024
    study_tags:
      - 坏病
      - 桂枝汤禁忌
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.017
    no: 17
    text: 若酒客病，不可与桂枝汤，得之则呕，以酒客不喜甘故也。
    translation: 平时嗜酒的人患太阳病，不可以给桂枝汤，服后容易呕吐，因为嗜酒之人不喜欢甘味。
    annotations:
