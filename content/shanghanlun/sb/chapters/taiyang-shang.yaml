  - id: SHL.SB.TYS.019
    no: 19
    text: 凡服桂枝汤吐者，其后必吐脓血也。
    translation: 凡是服桂枝汤后呕吐的，以后可能会吐脓血。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 提示里热或痈脓者不可用桂枝汤。
    formulas: []
