    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.023
    no: 23
    text: 太阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不呕，清便欲自可，一日二三度发。脉微缓者，为欲愈也；脉微而恶寒者，此阴阳俱虚，不可更发汗、更下、更吐也；面色反有热色者，未欲解也，以其不能得小汗出，身必痒，宜桂枝麻黄各半汤。
    translation: 太阳病到了八九天，发热恶寒像疟疾一样，发热多于怕冷，病人不呕，大小便尚可，一天发作两三次。脉微缓的，是将要痊愈；脉微而怕冷的，是阴阳都虚，不可再用发汗、泻下、催吐；面色反而发红的，是病邪还未解除，因为不能微微出汗，身体一定会痒，适合用桂枝麻黄各半汤。
