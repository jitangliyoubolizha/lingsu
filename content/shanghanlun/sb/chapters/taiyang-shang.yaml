    study_tags:
      - 桂枝汤禁忌
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.020
    no: 20
    text: 太阳病，发汗，遂漏不止，其人恶风，小便难，四肢微急，难以屈伸者，桂枝加附子汤主之。
    translation: 太阳病发汗后汗出不止，病人怕风，小便困难，四肢轻微拘急、屈伸不利的，用桂枝加附子汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳病因发汗，遂汗漏不止而恶风者，为阳气不足。因发汗阳气益虚，而皮腠不固也。
      - source: 伤寒论类方
        author: 徐大椿
        text: 四肢为诸阳之本，急难屈伸，乃津脱阳虚之象，但不至亡阳耳。若更甚而厥冷恶寒，则有阳脱之虑，当用四逆汤矣。桂枝同附子服，则能止汗回阳。
      - source: 参考《郝万山伤寒论讲稿》
        author: 灵素内容组
        text: 郝万山将本条概括为过汗后阴阳两伤而表证未除：桂枝汤调和营卫以解外，加附子温经扶阳、固表止汗，阳回则津液自复，小便难与肢急可随之而解。
    formulas:
      - SHL.SB.F.004
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.005
      - SHL.SB.SYM.019
      - SHL.SB.SYM.020
    study_tags:
      - 桂枝加附子汤证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
