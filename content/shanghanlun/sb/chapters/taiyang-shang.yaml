  - id: SHL.SB.TYS.030
    no: 30
    text: 问曰：证象阳旦，按法治之而增剧，厥逆，咽中干，两胫拘急而谵语。师曰：言夜半手足当温，两脚当伸。后如师言，何以知此？答曰：寸口脉浮而大，浮为风，大为虚，风则生微热，虚则两胫挛，病形象桂枝，因加附子参其间，增桂令汗出，附子温经，亡阳故也。厥逆，咽中干，烦躁，阳明内结，谵语烦乱，更饮甘草干姜汤，夜半阳气还，两足当热，胫尚微拘急，重与芍药甘草汤，尔乃胫伸，以承气汤微溏，则止其谵语，故知病可愈。
    translation: 问道：病证像阳旦证，按法处理后反而加重，出现手足厥冷、咽喉干燥、两小腿拘急而谵语。老师说：夜半手足应当转温，两脚应当伸展。后来果然如此，怎么知道呢？回答说：寸口脉浮而大，浮为风，大为虚，风就产生轻微发热，虚则两小腿挛急。病象类似桂枝汤证，因而加入附子参与其中，增加桂枝使汗出，附子温经，这是因为亡阳的缘故。厥冷、咽干、烦躁，是阳明内结、谵语烦乱，再饮甘草干姜汤，夜半阳气恢复，两足应当转热，小腿仍微拘急，再用芍药甘草汤，小腿就能伸展，用承气汤轻微通便，谵语就停止，所以知道病可以痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 反复辨误治后阴阳恢复过程，并与前条呼应。
