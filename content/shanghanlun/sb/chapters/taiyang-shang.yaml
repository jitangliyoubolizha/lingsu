chapter:
  code: TYS
  name: 辨太阳病脉证并治上
  order: 1
  part: 1
  part_total: 1
clauses:
  - id: SHL.SB.TYS.001
    no: 1
    text: 太阳之为病，脉浮，头项强痛而恶寒。
    translation: 太阳病的提纲，表现为脉象浮，头痛、颈项强直不舒，并且怕冷。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳主表，为诸阳主气。脉浮、头项强痛而恶寒者，太阳表病也。
      - source: 伤寒来苏集
        author: 柯琴
        text: 仲景作论大法，六经各立病机一条，提揭一经纲领，必择本经至当之脉症而表章之。六经虽各有表症，惟太阳主表，故表症表脉，独太阳得其全。
      - source: 参考《刘渡舟伤寒论讲稿》
        author: 灵素内容组
        text: 刘渡舟强调提纲证的「纲」作用：一经提纲确立，该经辨证便有了总纲。本条脉浮、头项强痛而恶寒，正是太阳病辨证之纲，篇中诸证皆由此展开。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.002
      - SHL.SB.SYM.003
      - SHL.SB.SYM.010
    study_tags:
      - 太阳病提纲
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYS.002
    no: 2
    text: 太阳病，发热，汗出，恶风，脉缓者，名为中风。
    translation: 太阳病见到发热、汗出、怕风、脉象缓的，称为中风。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条为太阳中风提纲，以发热、汗出、恶风、脉缓为辨证要点。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.004
      - SHL.SB.SYM.005
      - SHL.SB.SYM.006
    study_tags:
      - 中风提纲
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.003
    no: 3
    text: 太阳病，或已发热，或未发热，必恶寒，体痛，呕逆，脉阴阳俱紧者，名为伤寒。
    translation: 太阳病，有的已经发热，有的尚未发热，但必定怕冷，身体疼痛，恶心呕吐，寸关尺脉都紧的，称为伤寒。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条为太阳伤寒提纲，以恶寒、体痛、呕逆、脉紧为辨证要点。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.003
      - SHL.SB.SYM.011
      - SHL.SB.SYM.012
      - SHL.SB.SYM.013
    study_tags:
      - 伤寒提纲
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.004
    no: 4
    text: 伤寒一日，太阳受之，脉若静者，为不传；颇欲吐，若躁烦，脉数急者，为传也。
    translation: 伤寒第一天，太阳经受邪。如果脉象安静，说明病邪不传他经；如果很想呕吐，或者烦躁，脉象数而急，说明病邪正在传变。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以脉证判断邪气是否传变，强调动态观察。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.014
      - SHL.SB.SYM.036
    study_tags:
      - 传变
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.005
    no: 5
    text: 伤寒二三日，阳明少阳证不见者，为不传也。
    translation: 伤寒两三天，如果见不到阳明病和少阳病的证候，说明病邪没有传变。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以是否出现阳明、少阳证候判断传变与否。
    formulas: []
    symptom_tags: []
    study_tags:
      - 传变
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.006
    no: 6
    text: 太阳病，发热而渴，不恶寒者，为温病。
    translation: 太阳病见到发热、口渴而不怕冷的，属于温病。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 温病区别于伤寒的要点是口渴不恶寒。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.015
    study_tags:
      - 温病
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.007
    no: 7
    text: 病有发热恶寒者，发于阳也；无热恶寒者，发于阴也。发于阳，七日愈；发于阴，六日愈。以阳数七、阴数六故也。
    translation: 疾病表现为发热怕冷的，发于阳；没有发热只见怕冷的，发于阴。发于阳的约七天痊愈，发于阴的约六天痊愈，因为阳数为七、阴数为六。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以发热与否辨别阴阳属性，并推算病程。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.003
    study_tags:
      - 阴阳
      - 病程
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.008
    no: 8
    text: 太阳病，头痛至七日以上自愈者，以行其经尽故也；若欲作再经者，针足阳明，使经不传则愈。
    translation: 太阳病头痛超过七天自行痊愈的，是因为这一经的病程已经结束；如果病邪有再传他经的迹象，可以针刺足阳明经，使邪气不再传变而痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 强调经病七日自愈与针刺足阳明预防传经。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.010
    study_tags:
      - 自愈
      - 针刺
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.009
    no: 9
    text: 太阳病欲解时，从巳至未上。
    translation: 太阳病将要解除的时间，多在上午九点到下午三点之间。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 根据天人相应推测太阳病向愈的时间段。
    formulas: []
    symptom_tags: []
    study_tags:
      - 欲解时
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.010
    no: 10
    text: 风家表解而不了了者，十二日愈。
    translation: 容易感受风邪的人，表证解除后身体仍不爽利的，大约十二天可以痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 提示表解后余邪未尽，待正气恢复而愈。
    formulas: []
    symptom_tags: []
    study_tags:
      - 风家
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.011
    no: 11
    text: 病人身大热，反欲得衣者，热在皮肤，寒在骨髓也；身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。
    translation: 病人身体很热，反而想多穿衣服的，是热在体表、寒在体内；身体很冷，反而不想靠近衣服的，是寒在体表、热在体内。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 通过病人喜恶辨别真寒假热、真热假寒。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.003
      - SHL.SB.SYM.038
    study_tags:
      - 真假寒热
    notes: AI 初稿待校对。
  - id: SHL.SB.TYS.012
    no: 12
    text: 太阳中风，阳浮而阴弱，阳浮者，热自发，阴弱者，汗自出，啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。
    translation: 太阳中风，卫阳浮盛而营阴不足，阳浮就自行发热，阴弱就自行出汗，表现为阵阵怕冷、怕风、发热，鼻塞有声、干呕的，用桂枝汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳以候卫，阴以候营。阳脉浮者，卫中风也；阴脉弱者，营气弱也。风并于卫，则卫实而营虚，故发热汗自出也。
      - source: 伤寒附翼
        author: 柯琴
        text: 此为仲景群方之魁，乃滋阴和阳，调和营卫，解肌发汗之总方也。凡头痛发热恶风恶寒，其脉浮而弱，汗自出者，不拘何经，不论中风、伤寒、杂病，咸得用此发汗。
      - source: 参考《刘渡舟伤寒论讲稿》
        author: 灵素内容组
        text: 刘渡舟认为桂枝汤的意义不止于解表，而在滋阴和阳、调和营卫；本条热自发、汗自出，正是卫强营弱、营卫不和的写照。
    formulas:
      - SHL.SB.F.001
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.003
      - SHL.SB.SYM.004
      - SHL.SB.SYM.005
      - SHL.SB.SYM.007
      - SHL.SB.SYM.008
      - SHL.SB.SYM.009
    study_tags:
      - 桂枝汤证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYS.013
    no: 13
    text: 太阳病，头痛发热，汗出恶风，桂枝汤主之。
    translation: 太阳病，头痛发热，汗出怕风的，用桂枝汤主治。
    annotations:
