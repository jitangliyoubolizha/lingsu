  name: 辨太阳病脉证并治上
  order: 1
  part: 1
  part_total: 1
clauses:
  - id: SHL.SB.TYS.001
    no: 1
    text: 太阳之为病，脉浮，头项强痛而恶寒。
    translation: 太阳病的提纲，表现为脉浮，头痛、颈项强直不舒，并且怕冷。
    annotations:
