      - SHL.SB.SYM.028
      - SHL.SB.SYM.150
    study_tags:
      - 柴胡汤禁忌
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.099
    no: 99
    text: 伤寒四五日，身热、恶风、颈项强、胁下满、手足温而渴者，小柴胡汤主之。
    translation: 伤寒四五天，身体发热、怕风、颈项强、胁下胀满、手足温暖而口渴的，用小柴胡汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 三阳证见而偏于少阳，小柴胡汤和解。
