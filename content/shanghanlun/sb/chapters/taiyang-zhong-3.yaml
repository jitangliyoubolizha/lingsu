  - id: SHL.SB.TYZ.122
    no: 122
    text: 病人脉数，数为热，当消谷引食，而反吐者，此以发汗，令阳气微，膈气虚，脉乃数也。数为客热，不能消谷，以胃中虚冷，故吐也。
    translation: 病人脉数，数主热，应当消化食物、想吃东西，反而呕吐的，这是因为发汗使阳气微弱、膈气虚弱，所以脉数。这是客热，不能消化食物，因为胃中虚冷，所以呕吐。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉数未必皆实热，胃中虚冷亦可致吐。
    formulas: []
