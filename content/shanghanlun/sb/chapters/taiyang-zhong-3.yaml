  - id: SHL.SB.TYZ.103
    no: 103
    text: 太阳病，过经十余日，反二三下之，后四五日，柴胡证仍在者，先与小柴胡。呕不止、心下急，郁郁微烦者，为未解也，与大柴胡汤，下之则愈。
    translation: 太阳病，病程超过十余天，反而两三次泻下，之后四五天，柴胡证仍然存在的，先给小柴胡汤。呕吐不止、心下拘急，郁郁微烦的，是病未解除，给大柴胡汤，泻下就会痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳兼里实，大柴胡汤和解攻里。
    formulas:
