    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.123
    no: 123
    text: 太阳病，过经十余日，心下温温欲吐，而胸中痛，大便反溏，腹微满，郁郁微烦。先此时自极吐下者，与调胃承气汤，若不尔者，不可与。但欲呕、胸中痛、微溏者，此非柴胡汤证，以呕故知极吐下也，调胃承气汤。
    translation: 太阳病，病程超过十余天，心下温温欲吐，胸中疼痛，大便反而稀溏，腹部微满，郁郁微烦。在这之前自行剧烈吐下的，给调胃承气汤；如果不是这样，不能给。只想呕、胸中痛、轻微溏泻的，这不是柴胡汤证，因为呕吐可知是剧烈吐下所致，用调胃承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 极吐下后胃气不和，用调胃承气汤和胃。
    formulas:
      - SHL.SB.F.014
    symptom_tags:
      - SHL.SB.SYM.138
      - SHL.SB.SYM.139
      - SHL.SB.SYM.091
      - SHL.SB.SYM.122
    study_tags:
      - 调胃承气汤证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.124
    no: 124
    text: 太阳病，六七日，表证仍在，脉微而沉，反不结胸，其人发狂者，以热在下焦，少腹当硬满，小便自利者，下血乃愈。所以然者，以太阳随经瘀热在里故也，抵当汤主之。
    translation: 太阳病六七天，表证仍在，脉微而沉，反而不结胸，病人发狂的，因为热在下焦，少腹应当硬满，小便通畅的，瘀血下行才会痊愈。这是因为太阳经之邪随经入里，瘀热在里的缘故，用抵当汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 蓄血重证，少腹硬满、其人如狂，用抵当汤破血逐瘀。
    formulas:
      - SHL.SB.F.056
    symptom_tags:
