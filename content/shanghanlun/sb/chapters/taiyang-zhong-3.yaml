    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.095
    no: 95
    text: 太阳病，发热汗出者，此为荣弱卫强，故使汗出。欲救邪风者，宜桂枝汤。
    translation: 太阳病发热汗出的，这是营弱卫强，所以汗出。要解除风邪的，宜用桂枝汤。
    annotations:
