  - id: SHL.SB.TYZ.093
    no: 93
    text: 太阳病，先下而不愈，因复发汗，以此表里俱虚，其人因致冒，冒家汗出自愈。所以然者，汗出表和故也。里未和，然后复下之。
    translation: 太阳病，先用泻下不愈，又发汗，因此表里都虚，病人因而眩晕昏冒，冒证病人出汗就会自愈。这是因为汗出后表气调和。如果里气未和，然后再泻下。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗下失序致冒，汗出表和则愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.116
    study_tags:
      - 误治
      - 冒
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.094
    no: 94
    text: 太阳病未解，脉阴阳俱停，必先振栗汗出而解。但阳脉微者，先汗出而解；但阴脉微者，下之而解。若欲下之，宜调胃承气汤。
    translation: 太阳病未解除，寸关尺脉都隐伏不显，必定先战栗出汗而解。如果只有阳脉微弱的，先汗出而解；如果只有阴脉微弱的，用下法而解。若要泻下，宜用调胃承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以脉象判断病解途径，或汗或下。
    formulas:
