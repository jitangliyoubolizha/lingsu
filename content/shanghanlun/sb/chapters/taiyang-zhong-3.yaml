  - id: SHL.SB.TYZ.118
    no: 118
    text: 火逆，下之，因烧针烦躁者，桂枝甘草龙骨牡蛎汤主之。
    translation: 火逆后误用泻下，又因烧针而烦躁的，用桂枝甘草龙骨牡蛎汤主治。
