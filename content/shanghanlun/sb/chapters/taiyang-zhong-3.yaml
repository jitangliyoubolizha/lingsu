      - SHL.SB.SYM.143
    study_tags:
      - 抵当汤证
      - 蓄血
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.125
    no: 125
    text: 太阳病，身黄，脉沉结，少腹硬，小便不利者，为无血也；小便自利，其人如狂者，血证谛也，抵当汤主之。
    translation: 太阳病，身体发黄，脉沉结，少腹硬，小便不利的，是没有瘀血；小便通畅，病人像发狂的，是瘀血证的明证，用抵当汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以小便利否区别蓄水与蓄血。
