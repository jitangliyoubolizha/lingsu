  - id: SHL.SB.TYZ.111
    no: 111
    text: 太阳病中风，以火劫发汗，邪风被火热，血气流失，失其常度。两阳相熏灼，其身发黄。阳盛则欲衄，阴虚小便难。阴阳俱虚竭，身体则枯燥，但头汗出，剂颈而还，腹满微喘，口干咽烂，或不大便，久则谵语，甚者至哕，手足躁扰，捻衣摸床；小便利者，其人可治。
    translation: 太阳中风，用火劫发汗，风邪被火热逼迫，气血运行失去常度。风火两阳相互熏灼，身体发黄。阳热盛就想鼻出血，阴津虚则小便困难。阴阳都虚竭，身体就枯燥，只有头部出汗，到颈部为止，腹部胀满轻微气喘，口干咽烂，或者不大便，久了谵语，严重的呃逆，手足躁扰，捻衣摸床；小便通利的，病人还可以救治。
