  - id: SHL.SB.TYZ.091
    no: 91
    text: 伤寒，医下之，续得下利清谷不止，身疼痛者，急当救里；后身疼痛，清便自调者，急当救表。救里宜四逆汤，救表宜桂枝汤。
    translation: 伤寒，医生误用泻下，接连出现完谷不化的腹泻不止，身体疼痛的，应当先救里；之后身体仍疼痛，但大小便已经正常的，应当再救表。救里宜用四逆汤，救表宜用桂枝汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 表里同病而里虚急迫，先救里后救表。
    formulas:
