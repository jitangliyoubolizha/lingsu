  - id: SHL.SB.TYZ.112
    no: 112
    text: 伤寒，脉浮，医以火迫劫之，亡阳，必惊狂，卧起不安者，桂枝去芍药加蜀漆牡蛎龙骨救逆汤主之。
    translation: 伤寒脉浮，医生用火法强迫发汗，亡失心阳，必定惊狂、卧床起身都不安定的，用桂枝去芍药加蜀漆牡蛎龙骨救逆汤主治。
    annotations:
