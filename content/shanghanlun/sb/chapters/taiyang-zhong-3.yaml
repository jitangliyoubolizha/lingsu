  - id: SHL.SB.TYZ.110
    no: 110
    text: 太阳病二日，反躁，凡熨其背而大汗出，大热入胃，胃中水竭，躁烦，必发谵语；十余日振栗，自下利者，此为欲解也。故其汗从腰以下不得汗，欲小便不得，反呕，欲失溲，足下恶风，大便硬，小便当数，而反不数及不多。大便已，头卓然而痛，其人足心必热，谷气下流故也。
    translation: 太阳病第二天，反而躁动，用火熨其背而大汗出，热邪进入胃中，胃中津液枯竭，躁烦，必定发谵语；十多天后战栗，自行下利的，是将要解除。所以汗从腰部以下不能得出，想小便而不得，反而呕吐，想要失禁，足下怕风，大便硬，小便应当频数，反而不频数也不多。大便后，头部突然疼痛，病人足心必定发热，是因为谷气向下流。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 火逆伤津，后期正复自愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.033
      - SHL.SB.SYM.117
      - SHL.SB.SYM.039
