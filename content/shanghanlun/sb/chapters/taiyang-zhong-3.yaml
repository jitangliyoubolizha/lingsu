    notes: 原文据宋本，AI 初稿待校对。
  - id: SHL.SB.TYZ.092
    no: 92
    text: 病发热，头痛，脉反沉，若不差，身体疼痛，当救其里，宜四逆汤。
    translation: 病人发热头痛，脉反而沉，如果病不见好转，身体疼痛，应当救治其里，宜用四逆汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 表证见沉脉，提示里阳不足，当先救里。
    formulas:
