  - id: SHL.SB.TYZ.115
    no: 115
    text: 脉浮，热甚，而反灸之，此为实，实以虚治，因火而动，必咽燥、吐血。
    translation: 脉浮、热盛，反而用艾灸，这是实证却按虚证处理，因火而血动，必定咽喉干燥、吐血。
    annotations:
