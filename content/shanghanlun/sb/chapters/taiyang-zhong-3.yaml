  - id: SHL.SB.TYZ.097
    no: 97
    text: 血弱气尽，腠理开，邪气因入，与正气相搏，结于胁下。正邪分争，往来寒热，休作有时，嘿嘿不欲饮食，脏腑相连，其痛必下，邪高痛下，故使呕也，小柴胡汤主之。服柴胡汤已，渴者，属阳明，以法治之。
    translation: 血气虚弱，腠理开泄，邪气因而侵入，与正气相搏，结聚在胁下。正邪交争，往来寒热，发作有时，沉默不想饮食。脏腑相连，疼痛必然向下，邪高痛下，所以导致呕吐，用小柴胡汤主治。服柴胡汤后口渴的，属于阳明病，按阳明病的方法处理。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 解释少阳病往来寒热、默默不欲饮食的机理。
    formulas:
      - SHL.SB.F.020
    symptom_tags:
      - SHL.SB.SYM.080
      - SHL.SB.SYM.120
      - SHL.SB.SYM.013
    study_tags:
      - 小柴胡汤证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.098
    no: 98
    text: 得病六七日，脉迟浮弱，恶风寒，手足温，医二三下之，不能食而胁下满痛，面目及身黄，颈项强，小便难者，与柴胡汤，后必下重。本渴，饮水而呕者，柴胡汤不中与也，食谷者哕。
    translation: 得病六七天，脉迟浮弱，怕风怕冷，手足温暖，医生多次泻下，不能进食而胁下胀满疼痛，面目和身体发黄，颈项强，小便困难的，给柴胡汤后必定下重。本来口渴，喝水就呕的，不可以用柴胡汤，进食后会出现哕逆。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 里虚湿停者不可轻投柴胡汤。
    formulas:
