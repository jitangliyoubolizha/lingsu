  - id: SHL.SB.TYZ.113
    no: 113
    text: 形作伤寒，其脉不弦紧而弱者，弱者必渴。被火必谵语。弱者，发热，脉浮，解之当汗出愈。
    translation: 病象类似伤寒，但脉不弦紧而弱的，脉弱的人必定口渴。被火法治疗必定谵语。脉弱的人发热、脉浮，解表应当汗出而愈。
    annotations:
