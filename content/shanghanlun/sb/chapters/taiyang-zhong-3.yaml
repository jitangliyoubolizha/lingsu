  - id: SHL.SB.TYZ.114
    no: 114
    text: 太阳病，以火熏之，不得汗，其人必躁，到经不解，必清血，名为火邪。
    translation: 太阳病，用火熏的方法，不能出汗，病人必定躁动，到经期病仍不解，必定便血，这叫火邪。
    annotations:
