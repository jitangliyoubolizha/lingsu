  - id: SHL.SB.TYZ.116
    no: 116
    text: 微数之脉，慎不可灸，因火为邪，则为烦逆。追虚逐实，血散脉中，火气虽微，内攻有力，焦骨伤筋，血难复也。脉浮，宜以汗解，用火灸之，邪无从出，因火而盛，病从腰以下，必重而痹，名火逆也。欲自解者，必当先烦，烦乃有汗而解。何以知之？脉浮，故知汗出解。
    translation: 微弱而数的脉，务必谨慎不可艾灸，因火成为邪气，就会烦逆。追虚逐实，血散在脉中，火气虽然微弱，内攻却有力，能使筋骨焦伤，血难以恢复。脉浮适合用汗解，用火灸后，邪气无从外出，因火而更盛，病从腰部以下必定沉重而麻痹，叫火逆。要自行解除的，必定先心烦，心烦后才出汗而解。怎么知道？脉浮，所以知道汗出而解。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 详述火逆禁忌与自愈机理。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.134
    study_tags:
      - 火逆
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.117
    no: 117
    text: 烧针令其汗，针处被寒，核起而赤者，必发奔豚。气从少腹上冲心者，灸其核上各一壮，与桂枝加桂汤，更加桂二两也。
    translation: 用烧针让病人出汗，针处受寒，肿起发红的，必定发作奔豚。气从少腹上冲心口的，在肿核上各灸一壮，并给桂枝加桂汤，加重桂枝二两。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
