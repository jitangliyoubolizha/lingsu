    text: 伤寒，有热，少腹满，应小便不利，今反利者，为有血也，当下之，不可余药，宜抵当丸。
    translation: 伤寒有热，少腹胀满，应当小便不利，现在反而通畅，是有瘀血，应当攻下，不可用其他药，宜用抵当丸。
    annotations:
