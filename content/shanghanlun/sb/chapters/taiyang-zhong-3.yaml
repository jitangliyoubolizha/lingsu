  - id: SHL.SB.TYZ.109
    no: 109
    text: 伤寒，发热，啬啬恶寒，大渴欲饮水，其腹必满；自汗出，小便利，其病欲解。此肝乘肺也，名曰横，刺期门。
    translation: 伤寒发热，阵阵怕冷，非常口渴想喝水，腹部必定胀满；如果自行汗出、小便通利，病将解除。这是肝木乘肺金，名叫横，刺期门。
    annotations:
