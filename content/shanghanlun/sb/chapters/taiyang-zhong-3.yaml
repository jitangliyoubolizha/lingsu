  - id: SHL.SB.TYZ.101
    no: 101
    text: 伤寒中风，有柴胡证，但见一证便是，不必悉具。凡柴胡汤病证而下之，若柴胡证不罢者，复与柴胡汤，必蒸蒸而振，却复发热，汗出而解。
    translation: 伤寒或中风，有柴胡证，只要见到一个主症就可以用，不必全部具备。凡是柴胡汤证误用泻下，如果柴胡证没有消失的，再给柴胡汤，必定蒸蒸发热而战振，然后发热汗出而解。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 柴胡证不必悉具，误下后柴胡证仍在仍可用柴胡汤。
    formulas:
      - SHL.SB.F.020
    symptom_tags: []
    study_tags:
      - 柴胡证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.102
    no: 102
    text: 伤寒二三日，心中悸而烦者，小建中汤主之。
    translation: 伤寒两三天，心中悸动而心烦的，用小建中汤主治。
    annotations:
