    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.104
    no: 104
    text: 伤寒十三日不解，胸胁满而呕，日晡所发潮热，已而微利。此本柴胡证，下之以不得利；今反利者，知医以丸药下之，此非其治也，潮热者，实也。先宜服小柴胡汤以解外，后以柴胡加芒硝汤主之。
    translation: 伤寒十三天不解除，胸胁胀满而呕吐，傍晚发生潮热，随后轻微下利。这本来是柴胡证，用泻下本不应下利；现在反而下利，知道医生用丸药泻下，这不是正确治法。潮热是里实的表现。先宜服小柴胡汤解外，后用柴胡加芒硝汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳兼潮热里实，先用小柴胡，后用柴胡加芒硝汤。
    formulas:
      - SHL.SB.F.020
      - SHL.SB.F.050
    symptom_tags:
      - SHL.SB.SYM.022
      - SHL.SB.SYM.013
      - SHL.SB.SYM.071
      - SHL.SB.SYM.039
    study_tags:
      - 柴胡加芒硝汤证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.105
    no: 105
    text: 伤寒十三日，过经谵语者，以有热也，当以汤下之。若小便利者，大便当硬，而反下利，脉调和者，知医以丸药下之，非其治也。若自下利者，脉当微厥，今反和者，此为内实也，调胃承气汤主之。
    translation: 伤寒十三天，病过经而谵语的，是因为有热，应当用汤药泻下。如果小便通利，大便应当硬，反而下利，脉调和，知道医生用丸药泻下，不是正确治法。如果自行下利，脉应当微弱厥冷，现在反而调和，这是里实，用调胃承气汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以脉证判断误下与内实，调胃承气汤和胃泻热。
    formulas:
      - SHL.SB.F.014
    symptom_tags:
      - SHL.SB.SYM.033
      - SHL.SB.SYM.039
    study_tags:
      - 调胃承气汤证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.106
    no: 106
    text: 太阳病不解，热结膀胱，其人如狂，血自下，下者愈。其外不解者，尚未可攻，当先解其外；外解已，但少腹急结者，乃可攻之，宜桃核承气汤。
    translation: 太阳病不解除，热邪结在膀胱，病人像发狂一样，血自行从下而出，血下后就会痊愈。如果表证未解，还不能攻下，应当先解表；表解后，只有少腹拘急结聚的，才可以攻下，宜用桃核承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 蓄血轻证，表解后方可攻下。
    formulas:
      - SHL.SB.F.051
    symptom_tags:
      - SHL.SB.SYM.123
      - SHL.SB.SYM.124
      - SHL.SB.SYM.074
    study_tags:
      - 桃核承气汤证
      - 蓄血
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.107
    no: 107
    text: 伤寒八九日，下之，胸满，烦惊，小便不利，谵语，一身尽重，不可转侧者，柴胡加龙骨牡蛎汤主之。
    translation: 伤寒八九天，泻下后，胸部胀满，心烦惊惕，小便不利，谵语，全身沉重，不能转侧的，用柴胡加龙骨牡蛎汤主治。
    annotations:
