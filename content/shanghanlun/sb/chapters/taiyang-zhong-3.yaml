    no: 108
    text: 伤寒，腹满谵语，寸口脉浮而紧，此肝乘脾也，名曰纵，刺期门。
    translation: 伤寒，腹部胀满、谵语，寸口脉浮而紧，这是肝木乘脾土，名叫纵，刺期门。
