    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.121
    no: 121
    text: 太阳病，吐之，但太阳病当恶寒，今反不恶寒，不欲近衣，此为吐之内烦也。
    translation: 太阳病误用催吐，太阳病应当怕冷，现在反而不怕冷，不想靠近衣服，这是催吐导致的内烦。
    annotations:
