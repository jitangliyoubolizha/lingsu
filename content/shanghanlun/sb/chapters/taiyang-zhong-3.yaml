  - id: SHL.SB.TYZ.100
    no: 100
    text: 伤寒，阳脉涩，阴脉弦，法当腹中急痛，先与小建中汤；不差者，小柴胡汤主之。
    translation: 伤寒，阳脉涩、阴脉弦，按规律应当腹中拘急疼痛，先给小建中汤；如果不好，用小柴胡汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 中焦虚寒腹痛先用小建中汤，不愈再和小柴胡。
    formulas:
