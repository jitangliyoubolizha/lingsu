  - id: SHL.SB.TYZ.096
    no: 96
    text: 伤寒五六日，中风，往来寒热，胸胁苦满，嘿嘿不欲饮食，心烦喜呕；或胸中烦而不呕，或渴，或腹中痛，或胁下痞硬，或心下悸、小便不利，或不渴、身有微热，或咳者，小柴胡汤主之。
    translation: 伤寒五六天，又感受风邪，往来寒热，胸胁部满闷不适，沉默不语、不想饮食，心烦容易呕吐；或者胸中烦而不呕，或者口渴，或者腹中痛，或者胁下痞硬，或者心下悸、小便不利，或者不渴、身体微热，或者咳嗽的，用小柴胡汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳病主证及或然证，小柴胡汤和解枢机。
    formulas:
