  - id: SHL.SB.TYZ.120
    no: 120
    text: 太阳病，当恶寒、发热，今自汗出，反不恶寒发热，关上脉细数者，以医吐之过也。一二日吐之者，腹中饥、口不能食；三四日吐之者，不喜糜粥，欲食冷食，朝食暮吐，以医吐之所致也，此为小逆。
    translation: 太阳病应当怕冷发热，现在自汗出，反而不怕冷发热，关上脉细数的，是医生误用催吐的过错。一两天催吐的，腹中饥饿但不能进食；三四天催吐的，不喜欢稀粥，想吃冷食，早上吃晚上吐，是医生催吐所致，这是小逆。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 误吐伤胃，出现饥不能食或朝食暮吐。
    formulas: []
    symptom_tags:
