  - id: SHL.SB.JUE.358
    no: 358
    text: 伤寒四五日，腹中痛，若转气下趣少腹者，此欲自利也。
    translation: 伤寒病四五天，腹中疼痛，如果感觉气向下趋向小腹的，这是将要自行下利。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒四五日，邪气传里之时。腹中痛，转气下趋少腹者，里虚遇寒，寒气下行，欲作自利也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 腹中痛为肠道气机不利，转气下趋少腹为气机下陷，是下利将作之先兆。
    formulas: []
    symptom_tags:
