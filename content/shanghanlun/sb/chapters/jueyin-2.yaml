  - id: SHL.SB.JUE.375
    no: 375
    text: 下利后更烦，按之心下濡者，为虚烦也，宜栀子豉汤。
    translation: 下利后更加烦躁，按压心下柔软的，是虚烦，适合用栀子豉汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利后不烦为欲解。若更烦而心下坚者，恐为谷烦；此烦而心下濡者，是邪热乘虚客于胸中，为虚烦也。与栀子豉汤吐之即愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利后烦为余热未尽、扰动心神。心下濡为无实邪，故为虚烦。栀子豉汤清宣郁热、除烦。
    formulas:
