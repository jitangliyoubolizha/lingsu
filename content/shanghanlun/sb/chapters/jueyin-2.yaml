  - id: SHL.SB.JUE.367
    no: 367
    text: 下利，脉数而渴者，今自愈。设不差，必清脓血，以有热故也。
    translation: 下利，脉象数并且口渴的，现在会自行痊愈。假设不好，必然会排出脓血，这是因为有热的缘故。
    annotations:
      - source: 注解伤寒论
