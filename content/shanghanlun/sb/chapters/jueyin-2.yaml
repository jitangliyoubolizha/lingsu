      - 上热下寒
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.360
    no: 360
    text: 下利，有微热而渴，脉弱者，今自愈。
    translation: 下利，有轻微发热并且口渴，脉象虚弱的，现在会自行痊愈。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利阴寒之疾，反大热者逆。有微热而渴，□气方温也。经曰：诸弱发热，脉弱者，阳气得复也。今必自愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利见微热而渴为阳气来复，脉弱为正复邪退，故自愈。
    formulas: []
