  - id: SHL.SB.JUE.361
    no: 361
    text: 下利，脉数，有微热汗出，今自愈，设复紧，为未解。
    translation: 下利，脉象数，有轻微发热出汗，现在会自行痊愈，如果脉又变紧的，是尚未解除。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利，阴病也。脉数，阳脉也。阴病见阳脉者生。微热汗出，阳气得通也，利必自愈。诸□为寒。设复脉紧，阴气犹胜，故云未解。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利脉数为阳复，微热汗出为邪从表解，故自愈。若脉复紧为寒邪未尽，故未解。
    formulas: []
