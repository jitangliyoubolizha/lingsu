  - id: SHL.SB.JUE.366
    no: 366
    text: 下利，脉沉而迟，其人面少赤，身有微热，下利清谷者，必郁冒汗出而解，病人必微厥。所以然者，其面戴阳，下虚故也。
    translation: 下利，脉象沉而迟，患者面色微微发红，身体有轻微发热，下利排出完谷不化的食物的，必然会郁冒出汗而解除，患者必然会有轻微厥冷。之所以这样，是因为面色戴阳，下部虚弱的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利清谷，脉沉而迟，里有寒也。面少赤，身有微热，表未解也。病人微厥。《针经》曰：下虚则厥。表邪欲解，临汗之时，以里先虚，必□冒，然后汗出而解也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利清谷、脉沉迟为阳虚寒盛。面少赤身微热为虚阳外越（戴阳）。郁冒汗出为正复邪退而解。微厥为阳虚不达四末。面戴阳为下虚阳浮。
    formulas: []
