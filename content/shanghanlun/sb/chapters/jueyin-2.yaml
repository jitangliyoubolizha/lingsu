  - id: SHL.SB.JUE.380
    no: 380
    text: 伤寒大吐大下之，极虚，复极汗者，其人外气怫郁，复与之水，以发其汗，因得哕。所以然者，胃中寒冷故也。
    translation: 伤寒病大量涌吐大量泻下后，极度虚弱，又大量出汗的，患者外气郁结不舒，又给他喝水，用来发汗，因此得了哕证。之所以这样，是因为胃中寒冷的缘故。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 哕而腹满，气上而不下也。视其前后部有不利者，即利之，以降其气。前部，小便也；后部者，大便也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 大吐大下伤阳伤气，极虚复汗更伤阳气。外气怫郁为阳虚不运，饮水发汗更伤胃阳，胃寒则哕。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.150
    study_tags:
      - 误治致哕
      - 胃中寒冷
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.381
    no: 381
    text: 伤寒哕而腹满，视其前后，知何部不利，利之即愈。
    translation: 伤寒病哕逆并且腹部胀满的，观察大小便，知道哪个部位不通利，通利它就好了。
