      - SHL.SB.SYM.039
    study_tags:
      - 下利先兆
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.359
    no: 359
    text: 伤寒本自寒下，医复吐下之，寒格，更逆吐下，若食入口即吐，干姜黄芩黄连人参汤主之。
    translation: 伤寒病本来就有虚寒下利，医生又用吐法下法治疗，形成寒格，更导致呕吐下利，如果食物入口就吐的，用干姜黄芩黄连人参汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒邪自传表为本，自寒下，医反吐下，损伤正气，寒气内为格拒。经曰：格则吐逆。食入口即吐，谓之寒格。更复吐下，则重虚而死，是更逆吐下。与干姜黄连黄芩人参汤，以通寒格。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 本有虚寒下利，误用吐下更伤阳气，形成寒格（上热下寒）。食入口即吐为胃热上逆，下利为脾寒下陷。干姜黄芩黄连人参汤寒热并用，温清兼施。
    formulas:
      - SHL.SB.F.106
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.013
      - SHL.SB.SYM.148
    study_tags:
