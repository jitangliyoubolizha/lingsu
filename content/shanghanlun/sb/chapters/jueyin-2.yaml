      - 四逆汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.378
    no: 378
    text: 干呕吐涎沫，头痛者，吴茱萸汤主之。
    translation: 干呕、吐出涎沫，头痛的，用吴茱萸汤主治。
    annotations:
      - source: 伤寒贯珠集
        author: 尤怡
        text: 干呕吐涎沫者，厥阴寒邪上攻阳明也。头痛者，厥阴之脉上出额，与督脉会于巅，寒气随经上入于头，故痛也。然头者诸阳之会，以阴邪而得干之，其阳不振甚矣。故以吴茱萸辛热，入厥阴散寒邪为君。
      - source: 伤寒论集注
        author: 张志聪
        text: 干呕者，阳明胃气虚寒也；吐涎沫者，太阴脾气虚寒也，脾气虚寒不能转输其津液，故涎沫反从脾窍而出。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：巅顶头痛、干呕吐涎沫为肝胃虚寒、浊阴上逆之特征表现；吴茱萸汤暖肝温胃、降逆止痛，止呕即所以止头痛。
    formulas:
      - SHL.SB.F.089
    symptom_tags:
      - SHL.SB.SYM.008
      - SHL.SB.SYM.010
    study_tags:
      - 肝胃虚寒
      - 吴茱萸汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.JUE.379
    no: 379
    text: 呕而发热者，小柴胡汤主之。
    translation: 呕吐并且发热的，用小柴胡汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 大吐大下，胃气极虚。复极发汗，又亡阳气，外邪怫鬱于表，则身热。医与之水以发其汗，胃虚得水，虚寒相搏，成哕也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 呕而发热为少阳证，邪在半表半里，枢机不利。小柴胡汤和解少阳。
