  - id: SHL.SB.JUE.368
    no: 368
    text: 下利后脉绝，手足厥冷，晬时脉还，手足温者生，脉不还者死。
    translation: 下利后脉象消失，手足厥冷，一个时辰后脉象恢复，手足温暖的会活，脉象不恢复的会死。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利后脉绝，手足厥冷者，无阳也。晬时，周时也。周时厥愈，脉出，为阳气复，则生。若手足不温，脉不还者，为阳气绝，则死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利后脉绝厥冷为阳气暴脱。晬时（一个时辰）脉还手足温为阳气来复，故生。脉不还为阳绝，故死。
