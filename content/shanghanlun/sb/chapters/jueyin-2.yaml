  - id: SHL.SB.JUE.356
    no: 356
    text: 伤寒厥而心下悸，宜先治水，当服茯苓甘草汤，却治其厥。不尔，水渍入胃，必作利也。
    translation: 伤寒病厥冷并且心下悸动，应当先治疗水饮，应当服用茯苓甘草汤，然后再治疗厥冷。不这样做的话，水饮浸渍进入胃中，必然会发生下利。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 《金匮要略》曰：水停心下，甚者则悸。厥虽寒甚，然以心下悸为水饮内甚，先与茯苓甘草汤治其水，而后治其厥。若先治厥，则水饮浸渍入胃，必作下利。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 厥冷兼心下悸为水饮内停、阳气不达。水饮为急，当先治水，茯苓甘草汤健脾利水。水去后再治厥，否则水渍入胃则作利。
    formulas:
      - SHL.SB.F.041
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.088
    study_tags:
      - 水厥
      - 茯苓甘草汤
      - 先治其水
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.357
    no: 357
    text: 伤寒六七日，大下后，寸脉沉而迟，手足厥逆，下部脉不至，喉咽不利，唾脓血，泄利不止者，为难治，麻黄升麻汤主之。
    translation: 伤寒病六七天，大量泻下后，寸脉沉而迟，手足厥冷，下部脉摸不到，咽喉不利，吐脓血，泄利不止的，是难以治疗的，用麻黄升麻汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒六七日，邪传厥阴之时，大下之后，下焦气虚，阳气内防。寸脉迟而手足厥逆，下部脉不至。厥阴之脉，贯膈上注肺，循喉咙。在厥阴随经射肺，因亡津液，遂成肺痿，咽喉不利而唾脓血也。《金匮要畧》曰：肺痿之病从何得之？被快药下利，重亡津液故得之。若泄利不止者，为□气大虚，故云难□治。与麻黄升麻汤以调肝肺之气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 大下后伤阳伤阴，寸脉沉迟为上焦虚寒，下部脉不至为下焦虚衰。喉咽不利唾脓血为上热，泄利不止为下寒。此为寒热错杂、虚实夹杂之难治证，麻黄升麻汤寒热并用、攻补兼施。
    formulas:
      - SHL.SB.F.105
    symptom_tags:
