  - id: SHL.SB.JUE.372
    no: 372
    text: 下利腹胀满，身体疼痛者，先温其里，乃攻其表，温里宜四逆汤，攻表宜桂枝汤。
    translation: 下利腹部胀满，身体疼痛的，应当先温里，然后再解表，温里适合用四逆汤，解表适合用桂枝汤。
    annotations:
      - source: 注解伤寒论
