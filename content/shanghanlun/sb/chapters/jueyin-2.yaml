  - id: SHL.SB.JUE.369
    no: 369
    text: 伤寒下利，日十余行，脉反实者死。
    translation: 伤寒病下利，一天十多次，脉象反而实的，会死。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利者，□虚也，脉当微弱。反实者，病胜藏也，故死。《难经》曰：脉不应病，病不应脉，是为死病。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利日十余行为正气大虚，脉当虚弱。脉反实为邪盛正衰、胃气已绝，故死。
    formulas: []
    symptom_tags:
