  - id: SHL.SB.JUE.373
    no: 373
    text: 下利欲饮水者，以有热故也，白头翁汤主之。
    translation: 下利想要饮水的，是因为有热的缘故，用白头翁汤主治。
    annotations:
      - source: 伤寒溯源集
        author: 钱潢
        text: 夫渴与不渴，乃有热无热之大分别也。里无热邪，口必不渴。设或口干，乃下焦无火，气液不得蒸腾，致口无津液耳。然虽渴亦不能多饮。若胃果热燥，自当渴欲饮水，此必然之理也。
      - source: 注解伤寒论
        author: 成无己
        text: 自利不渴为脏寒，与四逆汤以温脏；下利饮水为有热，与白头翁汤以凉中。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：热利下重、下利欲饮水为厥阴湿热下迫之征；白头翁汤清热燥湿、凉血止利，为热利之主方，与虚寒下利之理中、四逆辈相对。
    formulas:
      - SHL.SB.F.107
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.015
    study_tags:
      - 热利口渴
      - 白头翁汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.JUE.374
    no: 374
    text: 下利谵语者，有燥屎也，宜小承气汤。
    translation: 下利谵语的，是有燥屎的缘故，适合用小承气汤。
    annotations:
