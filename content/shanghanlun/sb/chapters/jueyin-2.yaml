    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.376
    no: 376
    text: 呕家有痈脓者，不可治呕，脓尽自愈。
    translation: 呕吐的患者如果有痈脓的，不可以治疗呕吐，脓排尽就会自行痊愈。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 胃脘有痈，则呕而吐脓。不可治呕，得脓尽，呕即自愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 呕吐为排脓之自然反应，不可止呕。脓尽则邪去正安，呕自止。此为因势利导之法。
