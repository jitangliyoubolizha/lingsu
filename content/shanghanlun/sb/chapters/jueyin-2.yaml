      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利腹胀满为里虚寒，身体疼痛为表邪。里虚为急，当先温里用四逆汤，里和后再解表用桂枝汤。此为先里后表之法。
    formulas:
