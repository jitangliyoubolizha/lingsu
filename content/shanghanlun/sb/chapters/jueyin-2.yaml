  - id: SHL.SB.JUE.370
    no: 370
    text: 下利清谷，里寒外热，汗出而厥者，通脉四逆汤主之。
    translation: 下利排出完谷不化的食物，里面寒冷外面发热，出汗并且厥冷的，用通脉四逆汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利清谷为里寒，身热不解为外热。汗出，阳气通行于外，则木当厥。其汗出而厥者，阳气大虚也。与通脉四逆汤以固阳气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利清谷、里寒为阳虚寒盛，外热汗出为虚阳外越（阴盛格阳），厥冷为阳气衰竭。通脉四逆汤重用姜附，回阳救逆、通达血脉。
    formulas:
      - SHL.SB.F.115
    symptom_tags:
      - SHL.SB.SYM.159
      - SHL.SB.SYM.001
      - SHL.SB.SYM.004
      - SHL.SB.SYM.032
