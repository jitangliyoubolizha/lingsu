  - id: SHL.SB.JUE.362
    no: 362
    text: 下利，手足厥冷，无脉者，灸之不温，若脉不还，反微喘者，死。少阴负趺阳者，为顺也。
    translation: 下利，手足厥冷，摸不到脉的，用灸法治疗后不温暖，如果脉象不恢复，反而出现轻微气喘的，会死。少阴脉弱于趺阳脉的，是顺证。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利，手足厥逆，无脉者，阴气独胜，阳气大虚也。炙之，阳气复，手足温而脉还，为欲愈。若手足不温，脉不还者，阳已绝也。反微喘者，阳气脱也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利厥冷无脉为阳气衰竭，灸之不温、脉不还为阳绝。反微喘为肾不纳气、气将脱绝，故死。少阴负趺阳为胃气尚存，故为顺。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.032
      - SHL.SB.SYM.059
    study_tags:
      - 下利死证
      - 少阴趺阳脉
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.363
    no: 363
    text: 下利，寸脉反浮数，尺中自涩者，必清脓血。
    translation: 下利，寸脉反而浮数，尺中自然涩的，必然会排出脓血。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利者，脉当沉而迟，反浮数者，里有热也。涩为无血，尺中自涩者，肠胃血散也，随利下，必便脓血。清与圊通。《脉经》曰：清者，厠也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 寸脉浮数为热邪上盛，尺中涩为血分受伤，热迫血行则清脓血。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.053
      - SHL.SB.SYM.055
    study_tags:
      - 下利便脓血
      - 脉象判断
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.364
    no: 364
    text: 下利清谷，不可攻表，汗出必胀满。
    translation: 下利排出完谷不化的食物，不可以用解表法，出汗必然会导致胀满。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利者，脾胃虚也。胃为津液之主，发汗亡津液，则胃气愈虚，必胀满。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利清谷为脾肾阳虚，禁用汗法。误汗则更伤阳气，阳虚不运则胀满。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.159
      - SHL.SB.SYM.091
    study_tags:
      - 下利清谷
      - 禁汗
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.JUE.365
    no: 365
    text: 下利，脉沉弦者，下重也，脉大者，为未止，脉微弱数者，为欲自止，虽发热不死。
    translation: 下利，脉象沉弦的，是里急后重，脉象大的，是下利不会停止，脉象微弱而数的，是将要自行停止，虽然发热也不会死。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 沉为在里，□为拘急，□气不足，是主下重。大则病进。此利未止，脉微弱数者，邪气微而阳气复，为欲自止。虽发热，只由阳胜，非大逆也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉沉弦为肝气郁结、里急后重。脉大为邪盛正虚，故未止。脉微弱数为正复邪退，故欲自止。发热为阳复，故不死。
    formulas: []
