  - id: SHL.SB.JUE.377
    no: 377
    text: 呕而脉弱，小便复利，身有微热，见厥者难治，四逆汤主之。
    translation: 呕吐并且脉象虚弱，小便又通利，身体有轻微发热，出现厥冷的难以治疗，用四逆汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 呕而脉弱，为邪气传里。呕则气上逆，而小便当不利。小便复利者，里虚也。身有微热见厥者，阴胜阳也，为难治。与四逆汤，温里助阳。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 呕而脉弱为阳虚，小便利为阳不化气，身微热为虚阳外越，见厥为阳虚寒盛。阳虚阴盛，故难治。四逆汤回阳救逆。
    formulas:
