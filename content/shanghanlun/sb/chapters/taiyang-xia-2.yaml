  - id: SHL.SB.TYX.162
    no: 162
    text: 下后，不可更行桂枝汤；若汗出而喘，无大热者，可与麻黄杏子甘草石膏汤。
    translation: 泻下后，不可以再用桂枝汤；如果汗出而喘，没有明显发热的，可以用麻黄杏子甘草石膏汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 前第三卷廿六证云：发汗后不可更行桂枝汤，汗出而喘，无大热者。为与此证治法同，汗下虽殊，既不当损正气则一，邪气所传既同，遂用一法治之。经所谓若发汗，若下，若吐后者是矣。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后肺热壅盛，汗出而喘，用麻杏石甘汤。
