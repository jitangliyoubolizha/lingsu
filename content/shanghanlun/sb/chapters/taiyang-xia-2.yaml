  - id: SHL.SB.TYX.149
    no: 149
    text: 伤寒五六日，呕而发热者，柴胡汤证具，而以他药下之：柴胡证仍在者，复与柴胡汤，此虽已下之，不为逆，必蒸蒸而振，却发热汗出而解；若心下满而硬痛者，此为结胸也，大陷胸汤主之；但满而不痛者，此为痞，柴胡不中与之，宜半夏泻心汤。
    translation: 伤寒五六天，呕吐而发热，柴胡汤证已经具备，却用其他药泻下：如果柴胡证仍在的，再给柴胡汤，虽然已经泻下，不算逆治，必定蒸蒸发热而战振，然后发热汗出而解；如果心下胀满而硬痛的，这是结胸，用大陷胸汤主治；如果只胀满而不痛的，这是痞证，柴胡汤不再适合，宜用半夏泻心汤。
    annotations:
      - source: 伤寒来苏集
        author: 柯琴
        text: 误下后有二症者，少阳为半表半里之经，不全发阳，不全发阴，故误下之变，亦因偏于半表者成结胸，偏于半里者心下痞耳。此条本为半夏泻心而发，故只以痛不痛分结胸与痞，未及他症。
      - source: 伤寒明理论
        author: 成无己
        text: 但满而不痛者，此为虚痞。盖实邪留结，则为硬为痛；虚邪留滞，则但满而不硬痛也。
      - source: 参考《伤寒解惑论》
        author: 灵素内容组
        text: 李克绍主张以诸泻心汤方证互勘来读痞证：本条要点在「但满而不痛」，属误下中虚、寒热错杂之痞，故半夏泻心汤辛开苦降、攻补兼施，与结胸之可攻者迥别。
