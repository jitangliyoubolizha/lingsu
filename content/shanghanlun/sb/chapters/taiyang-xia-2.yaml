  - id: SHL.SB.TYX.175
    no: 175
    text: 风湿相搏，骨节疼烦，掣痛不得屈伸，近之则痛剧，汗出短气，小便不利，恶风不欲去衣，或身微肿者，甘草附子汤主之。
    translation: 风湿相互搏结，骨节疼痛烦扰，牵引疼痛不能屈伸，靠近就痛得更厉害，汗出短气，小便不利，怕风不想脱衣，或身体轻微肿的，用甘草附子汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 值天阴□不止，明其湿胜也。《内经》曰：阳受风气，阴受湿气。又曰：伤于风者，上先受之；伤于湿者，下先受之。风湿相搏，则风在外而湿在内。汗大出者，其气暴，暴则外邪出而里邪不能出，故风去而湿在。汗微微而出者，其气缓，缓则内外之邪皆出，故风湿俱去也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 风湿偏重，甘草附子汤温阳散寒除湿。
    formulas:
