  - id: SHL.SB.TYX.171
    no: 171
    text: 太阳、少阳并病，心下硬，颈项强而眩者，当刺大椎、肺俞、肝俞，慎勿下之。
    translation: 太阳与少阳并病，心下硬，颈项强而头晕目眩的，应当针刺大椎、肺俞、肝俞，谨慎不可泻下。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 心下痞硬而□者，少阳也。颈项强者，太阳也。刺大椎肺俞，以泻太阳之邪，以太阳脉下项侠脊故尔。肝俞，以泻少阳之邪，以胆为肝之府故尔。太阳为在表，少阳为在里，即是半表半里证。前第八证云：不可发汗，发汗则谵语。是发汗攻太阳之邪，少阳之邪益甚，干胃，必发谵语。此云慎勿下之，攻少阳之邪，太阳之邪乗虚入里，必作结胸。经曰：太阳少阳并病，而反下之，成结胸。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太少并病宜针刺，禁用攻下。
    formulas: []
    symptom_tags:
