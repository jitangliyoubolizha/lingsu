  - id: SHL.SB.TYX.152
    no: 152
    text: 太阳中风，下利、呕逆，表解者，乃可攻之，其人漐漐汗出，发作有时，头痛，心下痞硬满，引胁下痛，干呕，短气，汗出不恶寒者，此表解里未和也，十枣汤主之。
    translation: 太阳中风，下利、呕逆，表证解除后才可攻下。病人不断出汗，定时发作，头痛，心下痞硬胀满，牵引胁下疼痛，干呕，短气，汗出不怕冷的，这是表解里未和，用十枣汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下利呕逆，里受邪也。邪在里者可下，亦湏待表解者，乃可攻之。其人漐漐汗出，发作有时，不恶寒者，表已解也。头痛，心下痞硬满，引胁下痛，干呕短气者，邪热内畜而有伏饮，是里未和也。与十枣汤，下热逐饮。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 水饮停聚胸胁，表解后用十枣汤攻逐水饮。
