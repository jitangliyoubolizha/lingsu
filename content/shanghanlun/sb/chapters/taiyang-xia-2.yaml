  - id: SHL.SB.TYX.163
    no: 163
    text: 太阳病，外证未除而数下之，遂协热而利，利下不止，心下痞硬，表里不解者，桂枝人参汤主之。
    translation: 太阳病，表证未除而多次泻下，于是协热下利，下利不止，心下痞硬，表里都不解的，用桂枝人参汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 外证未除而数下之，为重虚其里，邪热乗虚而入，里虚恊热，遂利不止而心下痞。若表解而下利心下痞者，可与防心汤。若不下利表不解而心下痞者，可先解表而后攻痞。以表里不解，故与桂枝人参汤和里解表。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 误下脾虚寒湿下利，桂枝人参汤温中解表。
    formulas:
