  - id: SHL.SB.TYX.165
    no: 165
    text: 伤寒，发热、汗出不解，心中痞硬，呕吐而下利者，大柴胡汤主之。
    translation: 伤寒发热，汗出而病不解，心中痞硬，呕吐而下利的，用大柴胡汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒发热，寒已成热也。汗出不解，表和而里病也。吐利，心腹濡耎，为里虚。呕吐而下利，心下痞硬者，是里实也。与大柴胡汤，以下里热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳阳明合病，大柴胡汤和解攻里。
    formulas:
