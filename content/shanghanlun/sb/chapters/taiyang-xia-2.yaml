  - id: SHL.SB.TYX.153
    no: 153
    text: 太阳病，医发汗，遂发热、恶寒，因复下之，心下痞，表里俱虚，阴阳气并竭，无阳则阴独，复加烧针，因胸烦，面色青黄，肤瞤者，难治；今色微黄，手足温者，易愈。
    translation: 太阳病，医生发汗后仍发热怕冷，又泻下，心下痞，表里都虚，阴阳之气并竭，没有阳气则阴邪独盛，又加烧针，因而胸中烦，面色青黄，皮肤跳动的，难以治疗；如果面色微黄、手足温暖的，容易痊愈。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳病，因发汗，遂发热恶寒者，外虚阳气，邪复不除也。因复下之，又虚其里，表中虚，邪内防，传于心下，为痞。发汗表虚为竭阳；下之里虚为竭阴。表证罢为无阳；里有痞为阴独。又加烧针，虚不胜火，火气内攻，致胸烦也。伤寒之病，以阳为主。其人面色青，肤肉瞤动者，阳气大虚，故云难治。若面色防黄，手足温者，即阳气得复，故云易愈。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗下烧针迭伤，以面色与手足温度判断预后。
    formulas: []
