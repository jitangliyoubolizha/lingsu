    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYX.170
    no: 170
    text: 伤寒，脉浮，发热，无汗，其表不解，不可与白虎汤。渴欲饮水，无表证者，白虎加人参汤主之。
    translation: 伤寒脉浮，发热无汗，表证未解，不可用白虎汤。口渴想喝水，没有表证的，用白虎加人参汤主治。
    annotations:
