  - id: SHL.SB.TYX.160
    no: 160
    text: 伤寒，吐下后发汗，虚烦，脉甚微。八九日，心下痞硬，胁下痛，气上冲咽喉，眩冒，经脉动惕者，久而成痿。
    translation: 伤寒，催吐泻下后发汗，虚烦，脉很微。八九天后，心下痞硬，胁下痛，气上冲咽喉，头晕目眩，经脉跳动不安的，日久会形成痿证。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒吐下后发汗，则表里之气俱虚。虚烦脉甚防，为正气内虚，邪气独在。至七八日，正气当复，邪气当罢。而心下痞，胁下痛，气上冲咽喉□冒者，正气内虚而不复，邪气留结而不去。经脉动惕者，经络之气虚极，乆则热气还经，必成痿弱。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗吐下后阴阳气血俱伤，久则成痿。
    formulas: []
