  - id: SHL.SB.TYX.156
    no: 156
    text: 本以下之，故心下痞，与泻心汤，痞不解，其人渴而口燥烦，小便不利者，五苓散主之。
    translation: 本来因泻下形成心下痞，给泻心汤后痞不解除，病人口渴、口中干燥而烦，小便不利的，用五苓散主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 本因下后成痞，当与泻心汤除之。若服之痞不解，其人渴而口燥烦，小便不利者，为水饮内畜，津液不行，非热痞也。与五苓散，发汗散水则愈。一方忍之一日乃愈者，不饮者，外水不入，所停之水得行，而痞亦愈矣。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 水饮内停致痞，用五苓散化气利水。
    formulas:
