  - id: SHL.SB.TYX.177
    no: 177
    text: 伤寒，脉结代，心动悸，炙甘草汤主之。
    translation: 伤寒，脉结代，心中悸动，用炙甘草汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 结代之脉，动而中止，能自还者名曰结，不能自还者名曰代，由血气虚衰不能相续也。心中悸动，知真气内虚也。与炙甘草汤，益虚补血气而复脉。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 脉结代者，邪气阻滞而营卫涩少也；心动悸者，神气不振而都城震惊也。是虽有邪气，而攻取之法无所施矣，故宜人参、姜、桂以益卫气，胶、麦、麻、地、甘、枣以益营气。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：脉结代、心动悸为气血两虚、心失所养，炙甘草汤滋阴养血、益气温阳、通阳复脉并投；后世温病家加减复脉诸方，俱从此方化出。
    formulas:
      - SHL.SB.F.075
    symptom_tags:
      - SHL.SB.SYM.168
      - SHL.SB.SYM.169
    study_tags:
      - 炙甘草汤证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYX.178
    no: 178
    text: 脉按之来缓，时一止复来者，名曰结。又脉来动而中止，更来小数，中有还者反动，名曰结，阴也；脉来动而中止，不能自还，因而复动者，名曰代，阴也，得此脉者必难治。
    translation: 脉按之来势缓慢，有时一止又复来的，叫结脉。又脉动而中止，再来时短暂加速，中间有回还而反动，叫结脉，属阴；脉动而中止，不能自行回还，然后又动的，叫代脉，属阴，出现这种脉象的难以治疗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 辨别结脉与代脉，预后较差。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.170
      - SHL.SB.SYM.171
    study_tags:
      - 脉法
    notes: AI 初稿待校对。