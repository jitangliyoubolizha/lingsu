  - id: SHL.SB.TYX.166
    no: 166
    text: 病如桂枝证，头不痛，项不强，寸脉微浮，胸中痞硬，气上冲喉咽不得息者，此为胸有寒也。当吐之，宜瓜蒂散。
    translation: 病像桂枝汤证，但头不痛、项不强，寸脉微浮，胸中痞硬，气上冲咽喉不能呼吸的，这是胸中有寒痰。应当催吐，宜用瓜蒂散。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 病如桂枝证，为发热汗出恶风，言邪在表也。头痛项强，为桂枝汤证具。若头不痛，项不强，则邪不在表，而传里也。浮为在表，沉为在里。今寸脉防浮，则邪不在表，亦不在里，而在胸中也。胸中与表相应，故知邪在胸中者，犹如桂枝证，而寸脉防浮也。以胸中痞硬，气上冲咽防，不得息，知寒邪客于胸中，而不在表也。《千金》曰：气浮上部，填塞胸心，胸中满者，吐之则愈。与□蒂散，以吐胸中之邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 寒痰阻塞胸中，瓜蒂散涌吐痰实。
    formulas:
      - SHL.SB.F.067
    symptom_tags:
      - SHL.SB.SYM.162
      - SHL.SB.SYM.177
    study_tags:
      - 瓜蒂散证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYX.167
    no: 167
    text: 病胁下素有痞，连在脐傍，痛引少腹，入阴筋者，此名藏结，死。
    translation: 病人胁下素来有痞块，连到脐旁，疼痛牵引少腹，进入阴筋的，这叫藏结，预后不良。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 素有宿昔之积，结于胁下，为痞。今因伤寒，邪气入里，与宿积相合，使藏真之气结而不通，致连在脐傍，痛引少腹入阴筋而死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 藏结深重，预后差。
    formulas: []
    symptom_tags:
