      - SHL.SB.SYM.084
      - SHL.SB.SYM.076
    study_tags:
      - 并病
      - 针刺
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYX.172
    no: 172
    text: 太阳与少阳合病，自下利者，与黄芩汤；若呕者，黄芩加半夏生姜汤主之。
    translation: 太阳与少阳合病，自行下利的，给黄芩汤；如果呕吐的，用黄芩加半夏生姜汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳阳明合病自下利，为在表，当与葛根汤发汗。阳明少阳合病自下利，为在里，可与承气汤下之。此太阳少阳合病自下利，为在半表半里，非汗下所宜，故与黄芩汤以和解半表半里之邪。呕者，胃气逆也，故加半夏生姜以散逆气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太少合病下利热迫，黄芩汤清热止利。
    formulas:
