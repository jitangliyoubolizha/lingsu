  - id: SHL.SB.TYX.168
    no: 168
    text: 伤寒，若吐、若下后，七八日不解，热结在里，表里俱热，时时恶风，大渴，舌上干燥而烦，欲饮水数升者，白虎加人参汤主之。
    translation: 伤寒，经过催吐或泻下后，七八天不解除，热邪结在里，表里都热，时时怕风，非常口渴，舌上干燥而心烦，想喝几升水的，用白虎加人参汤主治。
