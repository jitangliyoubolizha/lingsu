    text: 风湿相搏，骨节疼烦，掣痛不得屈伸，近之则痛剧，汗出短气，小便不利，恶风不欲去衣，或身微肿者，甘草附子汤主之。
    translation: 风湿相互搏结，骨节疼痛烦扰，牵引疼痛不能屈伸，靠近就痛得更厉害，汗出短气，小便不利，怕风不想脱衣，或身体轻微肿的，用甘草附子汤主治。
