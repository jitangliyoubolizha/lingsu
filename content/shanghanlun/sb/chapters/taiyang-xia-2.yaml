  - id: SHL.SB.TYX.161
    no: 161
    text: 伤寒，发汗、若吐、若下，解后，心下痞硬，噫气不除者，旋覆代赭汤主之。
    translation: 伤寒发汗、催吐或泻下，表解之后，心下痞硬，嗳气不能消除的，用旋覆代赭汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 大邪虽解，以曽发汗吐下，胃气弱而未和，虚气上逆，故心下痞硬，噫气不除。与旋复代赭石汤，降虚气而和胃。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 胃虚痰浊内阻，噫气不除，旋覆代赭汤降逆化痰。
