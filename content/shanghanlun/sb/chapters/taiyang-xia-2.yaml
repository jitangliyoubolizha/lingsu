  - id: SHL.SB.TYX.164
    no: 164
    text: 伤寒，大下后，复发汗，心下痞，恶寒者，表未解也，不可攻痞，当先解表，表解乃可攻痞，解表宜桂枝汤，攻痞宜大黄黄连泻心汤。
    translation: 伤寒大泻下后，又发汗，心下痞，怕冷的，是表证未解，不能先攻痞，应当先解表，表解后才可攻痞，解表宜用桂枝汤，攻痞宜用大黄黄连泻心汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 大下后复发汗，则表里之邪当悉已。此心下痞而恶寒者，表里之邪俱不解也。因表不解而下之，为心下痞。先与桂枝汤解表，表解乃与大黄黄连泻心汤攻痞。《内经》曰：従外之内而盛于内者，先治其外，而后调其内。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 表里同病，先表后里。
    formulas:
      - SHL.SB.F.001
