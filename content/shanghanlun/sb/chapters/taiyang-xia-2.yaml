  - id: SHL.SB.TYX.154
    no: 154
    text: 心下痞，按之濡，其脉关上浮者，大黄黄连泻心汤主之。
    translation: 心下痞，按之柔软，关上脉浮的，用大黄黄连泻心汤主治。
    annotations:
      - source: 伤寒贯珠集
        author: 尤怡
        text: 成氏所谓虚热者，对燥屎而言也，非阴虚阳虚之谓。盖热邪入里，与糟粕相结，则为实热；不与糟粕相结，即为虚热。本方以大黄、黄连为剂，而不用枳、朴、芒硝者，盖以泄热，非以荡实也。
      - source: 伤寒论类方
        author: 徐大椿
        text: 此又法之最奇者，不取煎而取泡，欲其轻扬清淡，以涤上焦之邪。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：本条为热痞主证——无形邪热壅于心下，故按之濡而不硬痛、脉仅关上浮，与大陷胸证之按之石硬相对；邪热无形，故治以苦寒清泄，不在攻荡。
    formulas:
      - SHL.SB.F.060
    symptom_tags:
      - SHL.SB.SYM.154
    study_tags:
      - 大黄黄连泻心汤证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
