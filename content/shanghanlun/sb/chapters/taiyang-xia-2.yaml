clauses:
  - id: SHL.SB.TYX.148
    no: 148
    text: 伤寒五六日，头汗出，微恶寒，手足冷，心下满、口不欲食，大便硬，脉细者，此为阳微结，必有表，复有里也。脉沉，亦在里也。汗出，为阳微；假令纯阴结，不得复有外证，悉入在里。此为半在里，半在外也。脉虽沉紧，不得为少阴病。所以然者，阴不得有汗，今头汗出，故知非少阴也，可与小柴胡汤。设不了了者，得屎而解。
    translation: 伤寒五六天，头部汗出，轻微怕冷，手足冷，心下胀满、口中不想进食，大便硬，脉细的，这是阳微结，必定既有表证又有里证。脉沉，也说明病在里。汗出是阳气微；假如是纯阴结，不应再有外证，应全部入里。这是半在里半在外。脉虽然沉紧，也不能当作少阴病。因为阴证不应有汗，现在头部汗出，所以知道不是少阴病，可以给小柴胡汤。如果仍不爽利，大便通畅后就会解除。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳微结半表半里，与小柴胡汤和解。
