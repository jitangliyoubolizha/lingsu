    text: 病如桂枝证，头不痛，项不强，寸脉微浮，胸中痞硬，气上冲喉咽不得息者，此为胸有寒也。当吐之，宜瓜蒂散。
    translation: 病像桂枝汤证，但头不痛、项不强，寸脉微浮，胸中痞硬，气上冲咽喉不能呼吸的，这是胸中有寒痰。应当催吐，宜用瓜蒂散。
    annotations:
