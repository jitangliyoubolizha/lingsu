      - SHL.SB.SYM.015
      - SHL.SB.SYM.014
    study_tags:
      - 白虎加人参汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYX.169
    no: 169
    text: 伤寒，无大热，口燥渴，心烦，背微恶寒者，白虎加人参汤主之。
    translation: 伤寒，没有明显大热，口中干燥口渴，心烦，背部轻微怕冷的，用白虎加人参汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 无大热者，为身无大热也。口燥渴心烦者，当作阳明病。然以背防恶寒，为表未全罢，所以属太阳也。背为阳。背恶寒口中和者，少阴病也，当与附子汤。今口燥而渴，背虽恶寒，此里热也，则恶寒亦不至甚，故云防恶寒。与白虎汤和表散热，加人参止渴生津。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 热盛津伤，背微恶寒，白虎加人参汤清热生津。
    formulas:
