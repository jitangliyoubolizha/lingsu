  - id: SHL.SB.TYX.159
    no: 159
    text: 伤寒，服汤药，下利不止，心下痞硬，服泻心汤已；复以他药下之，利不止，医以理中与之，利益甚。理中者，理中焦，此利在下焦，赤石脂禹余粮汤主之。复不止者，当利其小便。
    translation: 伤寒服汤药后下利不止，心下痞硬，服泻心汤后已好转；又用其他药泻下，下利不止，医生用理中汤，下利更重。理中汤治理中焦，这个下利在下焦，用赤石脂禹余粮汤主治。如果仍不止，应当利小便。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒服汤药下后，利不止而心下痞硬者，气虚而客气上逆也。与泻心汤攻之则痞已。医复以他药下之，又虚其里，致利不止也。理中丸，脾胃虚寒下利者服之愈。此以下焦虚，故与之，其利益甚。《圣济经》曰：滑则气脱，欲其收也。如开肠洞泄，便溺遗失，涩剂所以收之。此利由下焦不约，与赤石脂禹余粮汤以涩洞泄。下焦主分清浊，下利者水谷不分也。若服涩剂而利不止，当利小便以分其气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下焦滑脱下利，用赤石脂禹余粮汤固涩。
    formulas:
