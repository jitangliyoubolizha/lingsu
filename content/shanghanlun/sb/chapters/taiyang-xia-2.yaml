      - SHL.SB.SYM.013
    study_tags:
      - 黄芩汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYX.173
    no: 173
    text: 伤寒，胸中有热，胃中有邪气，腹中痛，欲呕吐者，黄连汤主之。
    translation: 伤寒，胸中有热，胃中有寒邪，腹中疼痛，想要呕吐的，用黄连汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 湿家下后，舌上如胎者，以丹田有热，胸上有寒，是邪气入里而为下热上寒也。此伤寒邪气传里而为下寒上热也。胃中有邪气，使阴阳不交。阴不得升而独治于下，为下寒腹中痛；阳不得降而独治于上，为胸中热欲呕吐。与黄连汤升降阴阳之气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 上热下寒，黄连汤清上温中。
    formulas:
