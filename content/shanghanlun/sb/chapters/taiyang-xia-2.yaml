    study_tags:
      - 黄连汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYX.174
    no: 174
    text: 伤寒八九日，风湿相搏，身体疼烦，不能自转侧，不呕、不渴、脉浮虚而涩者，桂枝附子汤主之。若其人大便硬，小便自利者，去桂加白术汤主之。
    translation: 伤寒八九天，风湿相互搏结，身体疼痛烦扰，不能自行转侧，不呕不渴，脉浮虚而涩的，用桂枝附子汤主治。如果病人大便硬、小便自利，用去桂加白术汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒与中风家，至七八日再经之时，则邪气多在里，身必不苦疼痛。今日数多，复身体疼烦，不能自转侧者，风湿相□也。烦者风也，身疼不能自转侧者湿也。经曰：风则浮虚。《脉经》曰：脉来涩者，为病寒湿也。不呕不渴，里无邪也。脉得浮虚而涩，身有疼烦，知风湿但在经也。与桂枝附子汤以散表中风湿。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 风湿在表，用桂枝附子汤温阳祛风除湿。
