  - id: SHL.SB.TYX.158
    no: 158
    text: 伤寒中风，医反下之，其人下利，日数十行，谷不化，腹中雷鸣，心下痞硬而满，干呕，心烦不得安。医见心下痞，谓病不尽，复下之，其痞益甚。此非结热，但以胃中虚，客气上逆，故使硬也。甘草泻心汤主之。
    translation: 伤寒或中风，医生反而泻下，病人下利每日数十次，食物不消化，腹中雷鸣，心下痞硬胀满，干呕，心烦不能安宁。医生见心下痞，以为病邪未尽，又泻下，痞更加重。这不是热结，只是胃中虚，客气上逆，所以形成硬满。用甘草泻心汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒中风，是伤寒或中风也。邪气在表，医反下之，虚其肠胃，而气内防也。下利日数十行，谷不化，腹中雷鸣者，下后里虚胃弱也。心下痞硬，干呕，心烦不得安者，胃中空虚，客气上逆也。与泻心汤以攻表，加甘草以补虚。前以汗后胃虚，是外伤阳气，故加生姜；此以下后胃虚，是内损阴气，故加甘草。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 误下胃虚客气上逆，甘草泻心汤补虚消痞。
    formulas:
