  - id: SHL.SB.TYX.157
    no: 157
    text: 伤寒，汗出，解之后，胃中不和，心下痞硬，干噫食臭，胁下有水气，腹中雷鸣下利者，生姜泻心汤主之。
    translation: 伤寒汗出表解之后，胃中不和，心下痞硬，嗳气带食物气味，胁下有水气，腹中雷鸣而下利的，用生姜泻心汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 胃为津液之主，阳气之根。大汗出后，外亡津液，胃中空虚，客气上逆，心下痞硬。《金匮要略》曰：中焦气未和，不能消谷，故令噫。干噫食臭者，胃虚而不杀谷也。胁下有水气，腹中雷鸣，土弱不能胜水也。与泻心汤以攻痞，加生姜以益胃。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 胃虚食滞水停，生姜泻心汤和胃散水。
    formulas:
