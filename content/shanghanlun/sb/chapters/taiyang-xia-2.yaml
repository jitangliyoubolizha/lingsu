  - id: SHL.SB.TYX.151
    no: 151
    text: 脉浮而紧，而复下之，紧反入里，则作痞。按之自濡，但气痞耳。
    translation: 脉浮而紧，又误用泻下，紧脉反而入里，就形成痞证。按之柔软，只是气痞罢了。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮而紧，浮为伤阳，紧为伤阴，当发其汗而反下之。若浮入里，为阳邪入里，则作结胸；浮不入里而紧入里者，为阴邪入里，则作痞。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 误下致气机痞塞，按之濡软。
    formulas: []
