  - id: SHL.SB.TYX.176
    no: 176
    text: 伤寒，脉浮滑，此以表有热，里有寒，白虎汤主之。
    translation: 伤寒脉浮滑，这是表有热、里有寒，用白虎汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮为在表，滑为在里。表有热，外有热也；里有寒，有邪气传里也。以邪未入府，故止言寒。如□蒂散证云：胸上有寒者是矣。与白虎汤，以解内外之邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 表里俱热或热盛，白虎汤清阳明热。
    formulas:
