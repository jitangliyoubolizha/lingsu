  - id: SHL.SB.TYX.150
    no: 150
    text: 太阳、少阳并病，而反下之，成结胸，心下硬，下利不止，水浆不下，其人心烦。
    translation: 太阳与少阳并病，反而泻下，形成结胸，心下硬满，下利不止，水浆不能下咽，病人心烦。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳少阳并病，为邪气在半表半里也，而反下之，二经之邪乗虚而入。太阳表邪入里，结于胸中为结胸，心下硬；少阳里邪乗虚下于肠胃，遂利不止。若邪结阴分，则饮食如故而为藏结。此为阳邪内结，故水浆不下而心烦。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太少并病误下成结胸，病情较重。
