clauses:
  - id: SHL.SB.JUE.326
    no: 326
    text: 厥阴之为病，消渴，气上撞心，心中疼热，饥而不欲食，食则吐蛔，下之利不止。
    translation: 厥阴病的提纲证，表现为口渴多饮，气向上冲撞心胸，心中灼热疼痛，虽然饥饿却不想进食，进食就会吐出蛔虫，如果用泻下法就会导致下利不止。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 至厥阴成消渴者，热甚能消水故也；饮水多而小便少者，谓之消渴。木生于火，肝气通心，厥阴客热，气上撞心，心中疼热。
      - source: 伤寒来苏集
        author: 柯琴
        text: 厥阴经脉，上膈贯肝，气旺故上撞心。气有余即是火，故消渴而心中疼热。火能消物，故饥；肝脉挟胃，肝气旺，故胃口闭塞而不欲食也。
      - source: 参考《伤寒论求是》
        author: 灵素内容组
        text: 陈亦人力主厥阴病寒热错杂有规可循、并非千古疑案：本条消渴、气上撞心、心中疼热为上热，饥而不欲食、下之利不止为下寒，上热下寒正是厥阴提纲之实质。
    formulas: []
    symptom_tags:
