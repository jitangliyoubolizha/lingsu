      - 下焦寒凝
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.341
    no: 341
    text: 伤寒发热四日，厥反三日，复热四日，厥少热多者，其病当愈。四日至七日热不除者，必便脓血。
    translation: 伤寒病发热四天，厥冷反而三天，又发热四天，厥冷少发热多的，病应当会好。四天到七天发热不退的，必然会出现便脓血。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 厥少热多为阳气来复、正胜邪退，故当愈。若热不除为阳复太过、热毒内盛，热迫血行则便脓血。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.032
    study_tags:
      - 厥热胜复
      - 预后判断
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.342
    no: 342
    text: 伤寒厥四日，热反三日，复厥五日，其病为进。寒多热少，阳气退，故为进也。
    translation: 伤寒病厥冷四天，发热反而三天，又厥冷五天，病在进展。寒多热少，阳气衰退，所以是病进。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 厥多热少为阳虚阴盛、正不胜邪，阳气衰退则病进，预后不良。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.001
    study_tags:
