      - 除中证
      - 预后判断
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.333
    no: 333
    text: 伤寒脉迟六七日，而反与黄芩汤彻其热。脉迟为寒，今与黄芩汤复除其热，腹中应冷，当不能食，今反能食，此名除中，必死。
    translation: 伤寒病脉象迟，到了六七天，反而用黄芩汤来清除发热。脉迟是寒证，现在用黄芩汤又清除发热，腹中应当寒冷，应当不能进食，现在反而能进食，这叫做除中，必然会死。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉迟为寒证，误用黄芩汤苦寒清热，更伤阳气。腹中应冷而不能食，反能食为胃气将绝之"除中"证，是回光返照之象，故必死。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.087
      - SHL.SB.SYM.148
    study_tags:
      - 除中证
      - 误治死证
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.334
    no: 334
    text: 伤寒先厥后发热，下利必自止，而反汗出，咽中痛者，其喉为痹。发热无汗，而利必自止，若不止，必便脓血，便脓血者，其喉不痹。
    translation: 伤寒病先厥冷后发热，下利必然会自行停止，如果反而出汗，咽喉疼痛的，咽喉就会发生痹阻。发热没有汗，下利也必然会自行停止，如果下利不止，必然会出现便脓血，便脓血的，咽喉就不会痹阻。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 先厥后热为阳气来复，利当自止。若反汗出咽痛，为阳复太过、热毒上攻咽喉成痹。若无汗而利不止，为热毒下迫大肠成便脓血。热毒上攻则不下迫，下迫则不上攻，故喉痹与便脓血不并见。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.001
      - SHL.SB.SYM.039
      - SHL.SB.SYM.004
      - SHL.SB.SYM.072
    study_tags:
      - 厥后发热变证
      - 喉痹
      - 便脓血
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.335
    no: 335
    text: 伤寒一二日至四五日厥者，必发热。前热者后必厥，厥深者热亦深，厥微者热亦微。厥应下之，而反发汗者，必口伤烂赤。
    translation: 伤寒病一两天到四五天出现厥冷的，必然会发热。先发热后来必然厥冷，厥冷严重的发热也严重，厥冷轻微的发热也轻微。厥冷应当用泻下法，反而用发汗法的，必然会导致口腔糜烂红肿。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此为热厥证，阳热内郁不达四末则厥，热深厥深、热微厥微。热厥当清热或下之，误汗则更伤阴液，热毒上攻则口伤烂赤。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.001
    study_tags:
      - 热厥
      - 厥深热深
      - 误汗变证
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.336
    no: 336
    text: 伤寒病，厥五日，热亦五日，设六日当复厥，不厥者自愈。厥终不过五日，以热五日，故知自愈。
    translation: 伤寒病，厥冷五天，发热也五天，假设第六天应当再厥冷，不厥冷的就会自行痊愈。厥冷始终不超过五天，因为发热也是五天，所以知道会自行痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 厥热相应、天数相等，说明阴阳平衡、正气来复，故自愈。厥终不过五日说明阳气渐复、邪气渐退。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.001
    study_tags:
      - 厥热相应
      - 自愈
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.337
    no: 337
    text: 凡厥者，阴阳气不相顺接，便为厥。厥者，手足逆冷者是也。
    translation: 凡是厥证的，都是阴阳之气不能相互顺接，就会发生厥冷。厥证，就是手足冰冷的证候。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条为厥证的总纲。阴阳气不相顺接为厥证的基本病机，可因阳虚、热郁、痰饮、血虚等多种原因导致。手足逆冷为厥证的特征性表现。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
    study_tags:
      - 厥证总纲
      - 阴阳气不相顺接
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.338
    no: 338
    text: 伤寒脉微而厥，至七八日肤冷，其人躁无暂安时者，此为脏厥，非蛔厥也。蛔厥者，其人当吐蛔。今病者静，而复时烦者，此为脏寒，蛔上入其膈，故烦，须臾复止，得食而呕，又烦者，蛔闻食臭出，其人常自吐蛔。蛔厥者，乌梅丸主之。又主久利。
    translation: 伤寒病脉象微弱并且厥冷，到了七八天皮肤冰冷，患者烦躁没有片刻安宁的时候，这是脏厥，不是蛔厥。蛔厥的患者，应当会吐出蛔虫。现在患者安静，却又时常烦躁的，这是内脏寒冷，蛔虫向上进入膈膜，所以烦躁，一会儿又停止，进食就呕吐，又烦躁的，是蛔虫闻到食物的气味出来，患者经常自己吐出蛔虫。蛔厥的，用乌梅丸主治。又主治久利。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脏厥者死，阳气绝也。蛔厥虽厥而烦，吐蛔已则静，不若脏厥而躁无暂安时也。病人脏寒胃虚，蛔动上膈，闻食臭出，因而吐蛔，与乌梅丸温脏安虫。
      - source: 伤寒来苏集
        author: 柯琴
        text: 看厥阴诸证，与本方相符，下之利不止，与又主久利句合，则乌梅丸为厥阴主方，非只为蛔厥之剂矣。
      - source: 参考《郝万山伤寒论讲稿》
        author: 灵素内容组
        text: 郝万山讲稿以「静而复时烦」与「躁无暂安时」对举辨蛔厥与脏厥：蛔厥得食而呕又烦，乌梅丸酸苦辛并投、寒热并用，安蛔温脏，兼主寒热错杂之久利。
    formulas:
      - SHL.SB.F.102
    symptom_tags:
      - SHL.SB.SYM.023
      - SHL.SB.SYM.032
      - SHL.SB.SYM.014
      - SHL.SB.SYM.112
      - SHL.SB.SYM.013
    study_tags:
      - 脏厥
      - 蛔厥
      - 乌梅丸
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.JUE.339
    no: 339
    text: 伤寒热少微厥，指头寒，嘿嘿不欲食，烦躁，数日小便利，色白者，此热除也，欲得食，其病为愈。若厥而呕，胸胁烦满者，其后必便血。
    translation: 伤寒病发热轻微、厥冷也轻微，手指头发冷，沉默不想进食，烦躁，几天后小便通畅、颜色发白的，这是热邪已除，想要进食的，病就会好。如果厥冷并且呕吐，胸胁部烦躁胀满的，后来必然会出现便血。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 热少微厥为热厥轻证。小便利色白为热除，欲得食为胃气和，故愈。若厥而呕、胸胁烦满为热邪内郁、肝胃不和，热迫血行则便血。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.032
      - SHL.SB.SYM.173
      - SHL.SB.SYM.014
      - SHL.SB.SYM.143
    study_tags:
      - 热厥轻证
      - 预后判断
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.340
    no: 340
    text: 病者手足厥冷，言我不结胸，小腹满，按之痛者，此冷结在膀胱关元也。
    translation: 患者手足厥冷，说自己不是结胸证，小腹胀满，按压疼痛的，这是寒邪凝结在膀胱关元部位。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 手足厥冷为阳虚，小腹满按痛为寒邪凝结下焦。非结胸（胸膈），而在膀胱关元（下焦），当温阳散寒。
    formulas: []
    symptom_tags:
