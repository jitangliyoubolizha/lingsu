      - 寒热错杂
      - 上热下寒
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.JUE.327
    no: 327
    text: 厥阴中风，脉微浮为欲愈，不浮为未愈。
    translation: 厥阴病感受风邪，脉象微微浮起的，是即将痊愈的表现；脉象不浮的，是尚未痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 厥阴为阴经，病则脉多沉。若脉微浮，说明阳气来复、邪从表解，故为欲愈；脉不浮则阳气未复，故未愈。
    formulas: []
    symptom_tags: []
    study_tags:
      - 厥阴中风
      - 脉象预后
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.328
    no: 328
    text: 厥阴病，欲解时，从丑至卯上。
    translation: 厥阴病容易解除的时间，是从丑时到卯时（凌晨一点至早晨七点）。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 丑寅卯为阴尽阳生之时，厥阴得阳气相助则邪易解。此为厥阴病的欲解时辰。
    formulas: []
    symptom_tags: []
    study_tags:
      - 厥阴欲解时
      - 丑寅卯
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.329
    no: 329
    text: 厥阴病，渴欲饮水者，少少与之愈。
    translation: 厥阴病，口渴想要喝水的，少量给予饮水就会痊愈。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 厥阴病渴欲饮水为阳气来复之象，但厥阴本虚，不可多饮，少少与之则胃气渐和而愈。多饮则水停中焦反致变证。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.015
    study_tags:
      - 厥阴渴饮
      - 少少与之
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.330
    no: 330
    text: 诸四逆厥者，不可下之，虚家亦然。
    translation: 凡是四肢冰冷厥逆的，不可以用泻下法，体质虚弱的人也是这样。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 四逆厥冷为阳气衰微，泻下则更伤阳气，故禁用。虚家本虚，亦不可下。此为厥阴病禁下之法。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
    study_tags:
      - 厥阴禁下
      - 四逆厥
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.331
    no: 331
    text: 伤寒先厥后发热而利者，必自止，见厥复利。
    translation: 伤寒病先出现四肢厥冷然后发热的，如果伴有下利，下利必然会自行停止，如果再出现厥冷就会又下利。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 先厥后发热为阳气来复，阳复则利自止。若复见厥冷，说明阳气又衰，则利复作。厥热胜复反映阴阳消长。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.001
      - SHL.SB.SYM.039
    study_tags:
      - 厥热胜复
      - 阴阳消长
    notes: AI 初稿待校对。
  - id: SHL.SB.JUE.332
    no: 332
    text: 伤寒始发热六日，厥反九日而利。凡厥利者，当不能食，今反能食者，恐为除中，食以索饼，不发热者，知胃气尚在，必愈。恐暴热来出而复去也。后日脉之，其热续在者，期之旦日夜半愈。所以然者，本发热六日，厥反九日，复发热三日，并前六日，亦十一日，与厥相应，故期之旦日夜半愈。后三日脉之而脉数，其热不罢者，此为热气有余，必发痈脓也。
    translation: 伤寒病开始发热六天，厥冷反而九天并且下利。凡是厥冷下利的，应当不能进食，现在反而能进食的，恐怕是除中证，给吃面条饼，如果不发热的，知道胃气还在，必然会好。恐怕是突然发热出现后又消退。后来诊脉，发热继续存在的，预期在明天半夜会好。之所以这样，本来发热六天，厥冷反而九天，又发热三天，加上前面的六天，也是十一天，与厥冷的天数相应，所以预期在明天半夜会好。后来三天诊脉而脉数，发热不退的，这是热气有余，必然会发生痈肿化脓。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条论述厥热胜复的预后判断。厥多热少为阳虚，若能食为胃气尚存。食索饼后不发热为胃气和，发热为除中（胃气将绝）。厥热相应则阴阳平衡而愈，热多厥少为热气有余则发痈脓。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.032
      - SHL.SB.SYM.039
      - SHL.SB.SYM.148
    study_tags:
