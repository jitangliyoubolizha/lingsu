  - id: SHL.SB.JUE.350
    no: 350
    text: 伤寒脉滑而厥者，里有热，白虎汤主之。
    translation: 伤寒病脉象滑而厥冷的，是里有热邪，用白虎汤主治。
    annotations:
      - source: 伤寒贯珠集
        author: 尤怡
        text: 伤寒脉微而厥，阴邪所中，寒在里；脉滑而厥，阳邪所伤，热在里。阳热在里，阴气被格，阳反在内，阴反在外。设身热不除，则其厥不已。故主白虎汤，以清里而除热也。此阳明热极发厥之证，误编入厥阴者也。
      - source: 伤寒溯源集
        author: 钱潢
        text: 滑者，动数流利之象，无沉细微涩之形，故为阳脉。乃伤寒郁热之邪在里，阻绝阳气，不得畅达于四肢而厥，所谓厥深热亦深也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：热厥——里热深伏、阳气内郁不达四末，故脉滑而肢厥，即「厥深者热亦深」；白虎汤清解里热，与寒厥之四逆辈相对。
    formulas:
      - SHL.SB.F.068
    symptom_tags:
      - SHL.SB.SYM.085
      - SHL.SB.SYM.032
    study_tags:
      - 热厥
      - 白虎汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.JUE.351
    no: 351
    text: 手足厥寒，脉细欲绝者，当归四逆汤主之。
    translation: 手足厥冷，脉象细弱几乎摸不到的，用当归四逆汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 手足厥寒者，阳气外虚，不温四末；脉细欲绝者，阴血内弱，脉行不利。与当归四逆汤，助阳生阴也。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 手足厥寒，脉微欲绝者，阳之虚也，宜四逆辈。脉细欲绝者，血虚不能温于四末，并不能荣于脉中也。夫脉为血之府，而阳为阴之先。故欲续其脉，必益其血；欲益其血，必温其经。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：血虚寒厥——营血不足、寒凝经脉，故手足厥寒而脉细欲绝；当归四逆汤养血散寒、温经通脉，与阳衰阴盛之四逆汤证（脉微欲绝）一字之差而虚实迥别。
    formulas:
      - SHL.SB.F.103
    symptom_tags:
      - SHL.SB.SYM.032
      - SHL.SB.SYM.052
    study_tags:
      - 血虚寒凝
      - 当归四逆汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
