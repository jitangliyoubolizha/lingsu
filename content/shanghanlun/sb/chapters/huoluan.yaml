  order: 9
  part: 1
  part_total: 1
clauses:
  - id: SHL.SB.HUO.382
    no: 382
    text: 问曰：病有霍乱者何？答曰：呕吐而利，此名霍乱。
    translation: 问：有一种病叫霍乱的，是什么？答：呕吐并且下利，这就叫做霍乱。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 霍乱以呕吐下利为主要特征，发病急骤，挥霍撩乱，故名霍乱。此与西医学之霍乱（烈性传染病）不同，中医所指为急性胃肠病。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
    study_tags:
      - 霍乱定义
      - 呕吐下利
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.383
    no: 383
    text: 问曰：病发热头痛，身疼恶寒，吐利者，此属何病？答曰：此名霍乱。霍乱自呕吐下利，经四五日，复更发热，转入阴者，欲作霍乱，必转筋，名曰霍乱。
    translation: 问：病人发热头痛，身体疼痛，怕冷，呕吐下利的，这属于什么病？答：这叫做霍乱。霍乱本有呕吐下利，经过四五天，又出现发热，邪气转入阴经的，将要发生霍乱，必然出现转筋，这就叫做霍乱。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 霍乱初起可兼表证（发热头痛身疼恶寒），若四五日后复发热而转筋，为邪入阴经、津液大伤之象。转筋即筋脉拘急挛缩，为霍乱重症表现。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.010
      - SHL.SB.SYM.012
      - SHL.SB.SYM.003
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
    study_tags:
      - 霍乱兼表证
      - 转筋
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.384
    no: 384
    text: 伤寒，其脉微涩者，本是霍乱，今是伤寒，却四五日，至阴经上，转入阴必利，本呕下利者，不可治也。欲似大便，而反失气，仍不利者，此属阳明也，便必硬，十三日愈，所以然者，经尽故也。
    translation: 伤寒病，脉象微涩的，原本是霍乱，现在是伤寒，到了四五天，邪气到了阴经，转入阴经必然下利，本来就有呕吐下利的，不可以治疗。想要解大便，却只是放屁，仍然不解大便的，这属于阳明病，大便必然变硬，十三天会好，之所以这样，是因为经气运行一周的缘故。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉微涩为气血大伤，霍乱吐利后正气已虚。若转入阴经则利更甚，属危候。若反失气而不利，说明邪从燥化转属阳明，大便变硬，待经气运行一周（十三日）可自愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.023
      - SHL.SB.SYM.055
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
    study_tags:
      - 霍乱转阳明
      - 脉微涩
      - 十三日愈
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.385
    no: 385
    text: 下利后当便硬，硬则能食者愈，今反不能食，到后经中颇能食，复过一经能食，过之一日当愈，不愈者，不属阳明也。
    translation: 下利之后大便应当变硬，大便硬而能够进食的就会痊愈，现在反而不能进食，到了后来经气运行过程中很能进食，又过了一经的时间仍能进食，再过一天就会好，如果不好，就不属于阳明病。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下利后便硬为邪去正复之象。能食说明胃气已和，故愈。若反不能食，需待经气运行，逐渐恢复。若始终不能食，则非阳明病，需另寻病机。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.039
      - SHL.SB.SYM.148
    study_tags:
      - 下利后便硬
      - 胃气恢复
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.386
    no: 386
    text: 恶寒脉微而复利，利止亡血也，四逆加人参汤主之。
    translation: 怕冷，脉象微弱，又出现下利，下利停止是因为血液亡失的缘故，用四逆加人参汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 恶寒脉微为阳气大虚，复利则更伤阴液。利止非病愈，而是阴血亡尽、无物可下之危象。四逆汤回阳救逆，加人参益气生津固脱。
    formulas:
      - SHL.SB.F.083
    symptom_tags:
      - SHL.SB.SYM.003
      - SHL.SB.SYM.023
      - SHL.SB.SYM.039
    study_tags:
      - 霍乱亡血
      - 四逆加人参汤
      - 阳虚阴竭
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.387
    no: 387
    text: 霍乱，头痛发热，身疼痛，热多欲饮水者，五苓散主之；寒多不用水者，理中丸主之。
    translation: 霍乱病，头痛发热，身体疼痛，热象多而想要喝水的，用五苓散主治；寒象多而不想喝水的，用理中丸主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 霍乱兼表证需辨寒热。热多欲饮水为表里同病、水湿内停，五苓散化气行水兼解表；寒多不欲饮为脾胃虚寒，理中丸温中散寒。同病异治，关键在辨证。
    formulas:
      - SHL.SB.F.028
      - SHL.SB.F.079
    symptom_tags:
      - SHL.SB.SYM.010
      - SHL.SB.SYM.001
      - SHL.SB.SYM.012
      - SHL.SB.SYM.015
    study_tags:
      - 霍乱辨寒热
      - 五苓散
      - 理中丸
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.388
    no: 388
    text: 吐利止而身痛不休者，当消息和解其外，宜桂枝汤小和之。
    translation: 呕吐下利停止但身体疼痛不止的，应当斟酌情况和解其表邪，适宜用桂枝汤轻微调和。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐利止为里证已解，身痛不休为表邪未尽。桂枝汤解肌和营卫，"小和之"意为轻剂缓图，不可过汗伤正。
    formulas:
      - SHL.SB.F.001
    symptom_tags:
      - SHL.SB.SYM.012
    study_tags:
      - 霍乱后表未解
      - 桂枝汤小和
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.389
    no: 389
    text: 吐利汗出，发热恶寒，四肢拘急，手足厥冷者，四逆汤主之。
    translation: 呕吐下利并且出汗，发热怕冷，四肢拘急不舒，手足冰冷的，用四逆汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐利汗出为津液大伤，发热恶寒似有表证，但手足厥冷、四肢拘急为阳虚寒盛之真象。此为真寒假热，急当四逆汤回阳救逆。
    formulas:
      - SHL.SB.F.015
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
      - SHL.SB.SYM.004
      - SHL.SB.SYM.001
      - SHL.SB.SYM.003
      - SHL.SB.SYM.030
      - SHL.SB.SYM.172
    study_tags:
      - 霍乱阳虚
      - 四逆汤
      - 真寒假热
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.390
    no: 390
    text: 既吐且利，小便复利而大汗出，下利清谷，内寒外热，脉微欲绝者，四逆汤主之。
    translation: 既呕吐又下利，小便反而通利并且大量出汗，下利排出的是完谷不化的食物，内有寒而外有热，脉象微弱几乎摸不到的，用四逆汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐利汗出、小便利为津液大泄；下利清谷为脾肾阳虚、不能腐熟水谷；内寒外热为阴盛格阳之假热；脉微欲绝为阳气将脱。此为霍乱危候，急用四逆汤回阳救逆。
    formulas:
      - SHL.SB.F.015
    symptom_tags:
      - SHL.SB.SYM.013
      - SHL.SB.SYM.039
      - SHL.SB.SYM.143
      - SHL.SB.SYM.004
      - SHL.SB.SYM.159
      - SHL.SB.SYM.023
    study_tags:
      - 霍乱危候
      - 阴盛格阳
      - 下利清谷
    notes: AI 初稿待校对。
  - id: SHL.SB.HUO.391
    no: 391
    text: 吐已下断，汗出而厥，四肢拘急不解，脉微欲绝者，通脉四逆加猪胆汁汤主之。
    translation: 呕吐已经停止，下利已经断绝，出汗并且四肢冰冷，四肢拘急不缓解，脉象微弱几乎摸不到的，用通脉四逆加猪胆汁汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐利虽止但汗出厥冷、四肢拘急、脉微欲绝，为阳亡阴竭之极危证。通脉四逆汤（重用姜附）回阳通脉，加猪胆汁苦寒反佐，防止格拒，兼护阴液。
    formulas:
