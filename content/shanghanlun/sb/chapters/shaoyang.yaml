clauses:
  - id: SHL.SB.SY.263
    no: 263
    text: 少阳之为病，口苦、咽干、目眩也。
    translation: 少阳病的提纲证，表现为口苦、咽干、头晕目眩。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 足少阳胆经也。《内经》曰：有病口苦者，名曰胆瘅。《甲乙经》曰：胆者中精之府，五脏取决于胆，咽为之使。少阳之脉，起于目锐眦。
      - source: 伤寒来苏集
        author: 柯琴
        text: 盖口咽目三者，不可谓之表，又不可谓之里，是表之入里、里之出表处，所谓半表半里也。三者能开能阖，开之可见，阖之不见，恰合枢机之象。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：口苦、咽干、目眩为胆火上炎、灼伤津液之外候，提示少阳病位在半表半里；凡见此提纲脉证，即可从少阳和解法论治。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.197
      - SHL.SB.SYM.031
      - SHL.SB.SYM.093
    study_tags:
      - 少阳病提纲
      - 胆火上炎
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.SY.264
    no: 264
    text: 少阳中风，两耳无所闻、目赤、胸中满而烦者，不可吐下，吐下则悸而惊。
    translation: 少阳病感受风邪，两耳听不见声音、眼睛发红、胸中胀满并且烦躁的，不可以用涌吐或泻下法，如果误用吐下就会出现心悸和惊惕。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳中风，风火相煽上扰清窍则耳聋目赤，郁于胸中则满而烦。少阳病禁汗吐下三法，误用吐下则伤及心胆之气，出现悸动惊惕之变证。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.097
      - SHL.SB.SYM.198
      - SHL.SB.SYM.022
      - SHL.SB.SYM.014
    study_tags:
      - 少阳中风
      - 少阳禁吐下
      - 误治变证
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.265
    no: 265
    text: 伤寒，脉弦细、头痛发热者，属少阳。少阳不可发汗，发汗则谵语。此属胃，胃和则愈；胃不和，烦而悸。
    translation: 伤寒病，脉象弦细、头痛发热的，属于少阳病。少阳病不可以发汗，发汗就会出现谵语。这属于胃的病变，胃气调和就会好；胃气不和，就会烦躁并且心悸。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉弦细为少阳特征脉象，头痛发热为少阳表证。少阳禁汗，误汗则津伤热盛、胃燥谵语。胃和则愈，不和则烦悸，强调少阳误治后以胃气为转归关键。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.199
      - SHL.SB.SYM.010
      - SHL.SB.SYM.001
      - SHL.SB.SYM.033
      - SHL.SB.SYM.014
      - SHL.SB.SYM.046
    study_tags:
      - 少阳脉弦细
      - 少阳禁汗
      - 误汗谵语
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.266
    no: 266
    text: 本太阳病不解，转入少阳者，胁下硬满，干呕不能食，往来寒热，尚未吐下，脉沉紧者，与小柴胡汤。
    translation: 本来是太阳病没有解除，邪气转入少阳的，胁下部位硬满不适，干呕不能进食，寒热往来，还没有经过吐下的，脉象沉紧的，给予小柴胡汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阳病不解传入少阳，出现少阳典型证候：胁下硬满（少阳经循行部位）、干呕不能食（胆胃不和）、往来寒热（正邪相争于半表半里）。脉沉紧为邪入少阳之象，小柴胡汤和解少阳。
    formulas:
      - SHL.SB.F.020
    symptom_tags:
      - SHL.SB.SYM.149
      - SHL.SB.SYM.008
      - SHL.SB.SYM.148
      - SHL.SB.SYM.080
    study_tags:
      - 太阳转少阳
      - 小柴胡汤证
      - 往来寒热
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.267
    no: 267
    text: 若已吐下发汗温针，谵语，柴胡汤证罢，此为坏病，知犯何逆，以法治之。
    translation: 如果已经用过涌吐、泻下、发汗、温针等治法，出现谵语，小柴胡汤的适应证已经消失的，这就成为坏病，要知道犯了什么错误治法，根据具体情况辨证施治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳病误用吐下汗温针等多种治法，导致变证丛生而成坏病。柴胡证罢说明原证已变，谵语为误治伤正之象。"知犯何逆，以法治之"为坏病的治疗原则，强调辨证论治。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.033
    study_tags:
      - 少阳坏病
      - 知犯何逆以法治之
      - 误治变证
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.268
    no: 268
    text: 三阳合病，脉浮大，上关上，但欲眠睡，目合则汗。
    translation: 三阳经同时发病，脉象浮大，脉气上至关部以上，只想睡觉，眼睛闭上就出汗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 三阳合病指太阳、阳明、少阳三经同病。脉浮大为阳热亢盛，上关上为热势上冲。但欲眠睡为热盛神昏，目合则汗为阳热蒸腾、津液外泄。此证热势较盛，需清解三阳之热。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.200
      - SHL.SB.SYM.041
      - SHL.SB.SYM.004
    study_tags:
      - 三阳合病
      - 目合则汗
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.269
    no: 269
    text: 伤寒六七日，无大热，其人躁烦者，此为阳去入阴故也。
    translation: 伤寒病六七天，没有明显的高热，患者却烦躁不安的，这是因为表阳之邪离去而入于阴经的缘故。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 伤寒六七日，表证当解。若无大热而躁烦，说明表邪已去但入于阴经（少阴或厥阴），病势内陷。躁烦为阴经受邪、心神被扰之象，提示病情转重。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.014
    study_tags:
      - 阳去入阴
      - 病势内陷
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.270
    no: 270
    text: 伤寒三日，三阳为尽，三阴当受邪，其人反能食而不呕，此为三阴不受邪也。
    translation: 伤寒病第三天，三阳经的病程已经结束，三阴经应当接受邪气，患者反而能够进食而且不呕吐，这说明三阴经没有受到邪气侵犯。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 伤寒传经，三日三阳尽，当传三阴。能食不呕说明脾胃健运，中气未虚，正气足以抗邪，故三阴不受邪。能食不呕为判断三阴是否受邪的重要指标。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.148
    study_tags:
      - 三阴不受邪
      - 能食不呕
      - 传经规律
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.271
    no: 271
    text: 伤寒三日，少阳脉小者，欲已也。
    translation: 伤寒病第三天，少阳病脉象变小的，是即将痊愈的表现。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 少阳病本见弦脉，若脉由弦转小，说明邪气衰退，正气渐复，病将自愈。脉小为邪退正复之象，是少阳病预后良好的标志。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.201
    study_tags:
      - 少阳欲已
      - 脉小邪退
    notes: AI 初稿待校对。
  - id: SHL.SB.SY.272
    no: 272
    text: 少阳病欲解时，从寅至辰上。
    translation: 少阳病容易解除的时间，是从寅时到辰时（凌晨三点至上午九点）。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 寅卯辰为木气旺盛之时，少阳属木，得其时气相助则邪易解。此为少阳病的欲解时辰，体现了中医天人相应的整体观念。
    formulas: []
    symptom_tags: []
    study_tags:
      - 少阳欲解时
      - 寅卯辰
      - 天人相应
    notes: AI 初稿待校对。
