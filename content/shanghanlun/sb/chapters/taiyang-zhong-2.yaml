  - id: SHL.SB.TYZ.069
    no: 69
    text: 发汗，若下之，病仍不解，烦躁者，茯苓四逆汤主之。
    translation: 发汗或泻下后，病仍不解除，出现烦躁的，用茯苓四逆汤主治。
