  - id: SHL.SB.TYZ.064
    no: 64
    text: 发汗过多，其人叉手自冒心，心下悸，欲得按者，桂枝甘草汤主之。
    translation: 发汗过多，病人双手交叉按住心口，心下悸动，想要按着的，用桂枝甘草汤主治。
