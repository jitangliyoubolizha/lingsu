  - id: SHL.SB.TYZ.076
    no: 76
    text: 发汗后，水药不得入口为逆，若更发汗，必吐下不止。发汗吐下后，虚烦不得眠，若剧者，必反复颠倒，心中懊憹，栀子豉汤主之；若少气者，栀子甘草豉汤主之；若呕者，栀子生姜豉汤主之。
    translation: 发汗后，水和药都不能入口属于逆证，如果再发汗，必定呕吐下利不止。发汗吐下后，虚烦不能安睡，如果严重的，必定反复颠倒、心中懊憹，用栀子豉汤主治；如果少气的，用栀子甘草豉汤主治；如果呕吐的，用栀子生姜豉汤主治。
