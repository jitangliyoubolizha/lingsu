    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.085
    no: 85
    text: 疮家，虽身疼痛，不可发汗，汗出则痉。
    translation: 素有疮疡的人，虽然身体疼痛，也不可发汗，发汗后会出现痉病。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 衄者，上焦亡血也。若发汗，则上焦津液枯竭，经络干涩，故额上陷脉急紧。诸脉者皆属于目，筋脉紧急，则牵引其目，故直视不能眴。眴，瞬合目也。《针经》曰：阴气虚则目不□。亡血为阴虚，是以不得眠也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 疮家气血已伤，发汗更伤津液而致痉。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.012
      - SHL.SB.SYM.107
    study_tags:
      - 发汗禁忌
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.086
    no: 86
    text: 衄家，不可发汗，汗出必额上陷，脉急紧，直视不能眴，不得眠。
    translation: 素有鼻出血的人，不可发汗，发汗后必定额上陷下，脉急紧，两眼直视不能转动，不能安睡。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 衄者，上焦亡血也。若发汗，则上焦津液枯竭，经络干涩，故额上陷脉急紧。诸脉者皆属于目，筋脉紧急，则牵引其目，故直视不能眴。眴，瞬合目也。《针经》曰：阴气虚则目不□。亡血为阴虚，是以不得眠也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 衄家阴血不足，发汗重伤阴血而致危候。
    formulas: []
    symptom_tags:
