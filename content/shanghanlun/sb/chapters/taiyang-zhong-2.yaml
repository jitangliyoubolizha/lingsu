  - id: SHL.SB.TYZ.089
    no: 89
    text: 病人有寒，复发汗，胃中冷，必吐蛔。
    translation: 病人素有寒邪，又发汗，胃中寒冷，必定吐出蛔虫。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 病人有寒，则当温散。反发汗，损阳气，胃中冷，必吐蛔也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 中阳素虚，发汗更伤胃阳。
    formulas: []
    symptom_tags:
