    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.087
    no: 87
    text: 亡血家，不可发汗，发汗则寒栗而振。
    translation: 素有失血的人，不可发汗，发汗后会出现寒战发抖。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 《针经》曰：夺血者无汗，夺汗者无血。无血发汗，则阴阳俱虚，故寒栗而振。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 亡血家气血两虚，发汗则阳气更伤。
    formulas: []
    symptom_tags:
