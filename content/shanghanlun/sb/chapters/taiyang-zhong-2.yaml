  - id: SHL.SB.TYZ.084
    no: 84
    text: 淋家，不可发汗，发汗必便血。
    translation: 素有淋病的人，不可发汗，发汗必定尿血。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 表虚聚热则生疮。疮家身疼如伤寒，不可发汗，发汗则表气愈虚，热势愈甚，生风故变痓也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 淋家阴津不足，发汗伤阴动血。
    formulas: []
    symptom_tags:
