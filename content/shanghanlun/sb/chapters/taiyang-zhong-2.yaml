  - id: SHL.SB.TYZ.070
    no: 70
    text: 发汗后，恶寒者，虚故也；不恶寒，但热者，实也，当和胃气，与调胃承气汤。
    translation: 发汗后怕冷的，是虚的缘故；不怕冷只发热的，是实的缘故，应当调和胃气，给与调胃承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以恶寒与否辨汗后虚实，实热用调胃承气汤和胃。
    formulas:
      - SHL.SB.F.014
    symptom_tags:
      - SHL.SB.SYM.003
      - SHL.SB.SYM.001
    study_tags:
      - 虚实辨证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.071
    no: 71
    text: 太阳病，发汗后，大汗出，胃中干，烦躁不得眠，欲得饮水者，少少与饮之，令胃气和则愈；若脉浮，小便不利，微热消渴者，五苓散主之。
    translation: 太阳病发汗后大汗出，胃中津液干少，烦躁不能安睡，想喝水的，少量给水喝，使胃气和就能痊愈；如果脉浮、小便不利、轻微发热而口渴饮水不解的，用五苓散主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 饮水多而小便少者，谓之消渴，里热甚实也。微热消渴者，热未成实，上焦燥也。与五苓散，生津液和表里。
      - source: 伤寒论类方
        author: 徐大椿
        text: 胃中干而欲饮，此无水也，与水则愈；小便不利而欲饮，此蓄水也，利水则愈。同一渴，而治法不同，盖由同一渴，而渴之象不同，及渴之余症，亦各不同也。
      - source: 参考《刘渡舟伤寒论讲稿》
        author: 灵素内容组
        text: 刘渡舟论水气病重视三焦气化：本条渴而小便不利，是水蓄下焦、津不上承，故以五苓散化气行水、布散津液，与胃中干之少少与饮者自是两途。
    formulas:
      - SHL.SB.F.028
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.086
      - SHL.SB.SYM.015
      - SHL.SB.SYM.028
      - SHL.SB.SYM.095
    study_tags:
      - 五苓散证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
