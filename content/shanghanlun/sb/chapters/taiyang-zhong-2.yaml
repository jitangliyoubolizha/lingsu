  - id: SHL.SB.TYZ.078
    no: 78
    text: 伤寒五六日，大下之后，身热不去，心中结痛者，未欲解也，栀子豉汤主之。
    translation: 伤寒五六天，大泻下之后，身体发热不退，心中结聚疼痛的，是病未解除，用栀子豉汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒五六日，邪气在里之时。若大下后，身热去，心胸空者，为欲解。若大下后，身热去而心结痛者，结胸也。身热不去，心中结痛者，虚烦也。结胸为热客胸中为实，是热气已收敛于内，则外身热去。虚烦为热客胸中，未结为实，散漫为烦，是以身热不去。六七日为欲解之时，以热为虚烦，故云未欲解也。与栀子防汤，以吐除之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后余热留结心中，栀子豉汤清宣。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.101
    study_tags:
      - 栀子豉汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.079
    no: 79
    text: 伤寒下后，心烦腹满，卧起不安者，栀子厚朴汤主之。
    translation: 伤寒泻下后，心烦腹满，躺下起来都不安适的，用栀子厚朴汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下后但腹满而不心烦，即邪气入里，为里实。但心烦而不腹满，即邪气在胸中，为虚烦。既烦且满，则邪气壅于胸腹之间也。满则不能坐，烦则不能卧，故令卧起不安。与栀子厚朴汤，吐烦泄满。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后热扰胸膈兼腹满，栀子厚朴汤清热宽中。
    formulas:
      - SHL.SB.F.045
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.091
      - SHL.SB.SYM.102
    study_tags:
      - 栀子厚朴汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.080
    no: 80
    text: 伤寒，医以丸药大下之，身热不去，微烦者，栀子干姜汤主之。
    translation: 伤寒，医生用丸药猛烈泻下，身体发热不退，轻微心烦的，用栀子干姜汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 丸药不能除热，但损正气。邪气乘虚，留于胸中而未入深者，则身热不去而微烦。与栀子干姜汤，吐烦益气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后上热下寒，栀子干姜汤清上温中。
    formulas:
