clauses:
  - id: SHL.SB.TYZ.061
    no: 61
    text: 下之后，复发汗，昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者，干姜附子汤主之。
    translation: 泻下之后又发汗，白天烦躁不能安睡，夜里安静，不呕不渴，没有表证，脉沉微，身体没有明显发热的，用干姜附子汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 下之虚其里，汗之虚其表，里虚又汗，则表里俱虚。阳王于昼，阳欲复，虚不胜邪，正邪交争，故昼日烦躁不得眠；夜阴王，阳虚不能与之争，是夜则安静。
      - source: 伤寒论注
        author: 柯琴
        text: 脉沉微，是纯阴无阳矣；身无大热，表阳将去矣。幸此微热未除，烦躁不宁之际，独任干姜、生附，以急回其阳，此四逆之变剂也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：昼日烦躁示虚阳尚能与阴争，夜而安静示阳衰已无力与争，病情更急；不用甘草之缓，姜附单捷小剂，急复其阳。
    formulas:
      - SHL.SB.F.032
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.086
      - SHL.SB.SYM.054
    study_tags:
      - 干姜附子汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.062
    no: 62
    text: 发汗后，身疼痛，脉沉迟者，桂枝加芍药生姜各一两人参三两新加汤主之。
    translation: 发汗后身体疼痛，脉沉迟的，用桂枝加芍药生姜各一两人参三两新加汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 汗后身疼痛，邪气未尽也。脉沉迟，荣血不足也。经曰：其脉沉者，荣气微也。又曰：迟者，荣气不足，血少故也。与桂枝汤以解未尽之邪，加芍药生姜人参，以益不足之血。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗后营血不足，身痛脉沉迟，益气养营兼和营卫。
    formulas:
      - SHL.SB.F.033
    symptom_tags:
      - SHL.SB.SYM.012
      - SHL.SB.SYM.087
    study_tags:
      - 新加汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.063
    no: 63
    text: 发汗后，不可更行桂枝汤。汗出而喘，无大热者，可与麻黄杏仁甘草石膏汤。
    translation: 发汗后，不可以再用桂枝汤。汗出而气喘，没有明显发热的，可以用麻黄杏仁甘草石膏汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗后喘，当作桂枝加厚朴杏仁汤，汗出则喘愈。今汗出而喘为邪气壅甚，桂枝汤不能发散，故不可更行桂枝汤。汗出而喘有大热者，内热气甚也；无大热者，表邪必甚也。与麻黄杏仁甘草石膏汤以散其邪。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 发汗后，汗出而喘，无大热者，其邪不在肌腠，而入肺中。缘邪气外闭之时，肺中已自蕴热，发汗之后，其邪不从汗而出之表者，必从内而并于肺耳。
      - source: 参考《郝万山伤寒论讲稿》
        author: 灵素内容组
        text: 郝万山以「汗出而喘」为本条眼目：无汗而喘属麻黄汤，汗出而喘属麻杏石甘——肺热壅盛而表无大热，麻黄配石膏，清宣肺热而不助汗。
    formulas:
      - SHL.SB.F.034
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.018
    study_tags:
      - 麻杏石甘汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.064
    no: 64
    text: 发汗过多，其人叉手自冒心，心下悸，欲得按者，桂枝甘草汤主之。
    translation: 发汗过多，病人双手交叉按住心口，心下悸动，想要按着的，用桂枝甘草汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗过多，亡阳也。阳受气于胸中，胸中阳气不足，故病义手自冒心，心下悸，欲得按者，与桂枝甘草汤，以调不足之气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗多伤心阳，心阳不足而悸，桂枝甘草汤温补心阳。
    formulas:
      - SHL.SB.F.035
    symptom_tags:
      - SHL.SB.SYM.088
    study_tags:
      - 桂枝甘草汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.065
    no: 65
    text: 发汗后，其人脐下悸者，欲作奔豚，茯苓桂枝甘草大枣汤主之。
    translation: 发汗后，病人脐下悸动的，是奔豚将要发作，用茯苓桂枝甘草大枣汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 汗者心之液。发汗后脐下悸者，心气虚而肾气发动也。肾之积名曰奔豚，发则从少腹上至心下，为肾气逆，欲上凌心。今脐下悸，为肾气发动，故云欲作奔豚。与茯苓桂枝甘草大枣汤，以降肾气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗后心阳不足、水饮上冲欲作奔豚，用苓桂甘枣汤培土制水。
    formulas:
      - SHL.SB.F.036
    symptom_tags:
      - SHL.SB.SYM.089
      - SHL.SB.SYM.090
    study_tags:
      - 茯苓桂枝甘草大枣汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.066
    no: 66
    text: 发汗后，腹胀满者，厚朴生姜半夏甘草人参汤主之。
    translation: 发汗后腹部胀满的，用厚朴生姜半夏甘草人参汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 吐后腹胀，与下后腹满，皆为实，言邪气乘虚入里为实。发汗后外已解也，腹胀满，知非里实，由脾胃津液不足，气涩不通，壅而为满。与此汤，和脾胃而降气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗后脾虚气滞，腹胀满，用朴姜半甘参汤健脾宽中。
    formulas:
      - SHL.SB.F.037
    symptom_tags:
      - SHL.SB.SYM.091
    study_tags:
      - 厚朴生姜半夏甘草人参汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.067
    no: 67
    text: 伤寒，若吐、若下后，心下逆满，气上冲胸，起则头眩，脉沉紧，发汗则动经，身为振振摇者，茯苓桂枝白术甘草汤主之。
    translation: 伤寒，经过催吐或泻下后，心下气逆胀满，气上冲胸，起身就头晕，脉沉紧，发汗会伤动经脉，身体震颤摇动，用茯苓桂枝白术甘草汤主治。
    annotations:
      - source: 伤寒贯珠集
        author: 尤怡
        text: 此伤寒邪解而饮发之证。饮停于中则满，逆于上则气冲而头眩，入于经则身振振而动摇。
      - source: 伤寒论类方
        author: 徐大椿
        text: 此亦阳虚而动肾水之症，即真武症之轻者，故其法亦仿真武之意。
      - source: 参考《刘渡舟伤寒论讲稿》
        author: 灵素内容组
        text: 刘渡舟尤重苓桂诸剂：本证为吐下后脾虚饮停、水气上冲，「起则头眩」是其眼目；苓桂术甘汤温阳化饮、健脾利水，为治水气上冲之代表方。
    formulas:
      - SHL.SB.F.038
    symptom_tags:
      - SHL.SB.SYM.092
      - SHL.SB.SYM.017
      - SHL.SB.SYM.093
      - SHL.SB.SYM.094
    study_tags:
      - 苓桂术甘汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.068
    no: 68
    text: 发汗病不解，反恶寒者，虚故也，芍药甘草附子汤主之。
    translation: 发汗后病未解除，反而怕冷的，是虚的缘故，用芍药甘草附子汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗病解，则不恶寒。发汗病不解，表实者亦不恶寒。今发汗病且不解，又反恶寒者，荣卫俱虚也。汗出则荣虚，恶寒则卫虚。与芍药甘草附子汤，以补荣卫。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗后阴阳两虚，恶寒者以芍药甘草附子汤扶阳益阴。
    formulas:
      - SHL.SB.F.039
    symptom_tags:
      - SHL.SB.SYM.003
    study_tags:
      - 芍药甘草附子汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.069
    no: 69
    text: 发汗，若下之，病仍不解，烦躁者，茯苓四逆汤主之。
    translation: 发汗或泻下后，病仍不解除，出现烦躁的，用茯苓四逆汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗若下，病宜解也。若病仍不解，则发汗外虚阳气，下之内虚阴气，阴阳俱虚，邪独不解，故生烦躁。与茯苓四逆汤以复阴阳之气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗下后阴阳俱伤、虚阳外越而烦躁，用茯苓四逆汤回阳益阴。
    formulas:
      - SHL.SB.F.040
    symptom_tags:
      - SHL.SB.SYM.014
    study_tags:
      - 茯苓四逆汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.070
    no: 70
    text: 发汗后，恶寒者，虚故也；不恶寒，但热者，实也，当和胃气，与调胃承气汤。
    translation: 发汗后怕冷的，是虚的缘故；不怕冷只发热的，是实的缘故，应当调和胃气，给与调胃承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 汗出而恶寒者，表虚也。汗出而不恶寒但热者，里实也。经曰：汗出不恶寒者，此表解里未和。与调胃承气汤和胃气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以恶寒与否辨汗后虚实，实热用调胃承气汤和胃。
    formulas:
      - SHL.SB.F.014
    symptom_tags:
      - SHL.SB.SYM.003
      - SHL.SB.SYM.001
    study_tags:
      - 虚实辨证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.071
    no: 71
    text: 太阳病，发汗后，大汗出，胃中干，烦躁不得眠，欲得饮水者，少少与饮之，令胃气和则愈；若脉浮，小便不利，微热消渴者，五苓散主之。
    translation: 太阳病发汗后大汗出，胃中津液干少，烦躁不能安睡，想喝水的，少量给水喝，使胃气和就能痊愈；如果脉浮、小便不利、轻微发热而口渴饮水不解的，用五苓散主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 饮水多而小便少者，谓之消渴，里热甚实也。微热消渴者，热未成实，上焦燥也。与五苓散，生津液和表里。
      - source: 伤寒论类方
        author: 徐大椿
        text: 胃中干而欲饮，此无水也，与水则愈；小便不利而欲饮，此蓄水也，利水则愈。同一渴，而治法不同，盖由同一渴，而渴之象不同，及渴之余症，亦各不同也。
      - source: 参考《刘渡舟伤寒论讲稿》
        author: 灵素内容组
        text: 刘渡舟论水气病重视三焦气化：本条渴而小便不利，是水蓄下焦、津不上承，故以五苓散化气行水、布散津液，与胃中干之少少与饮者自是两途。
    formulas:
      - SHL.SB.F.028
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.086
      - SHL.SB.SYM.015
      - SHL.SB.SYM.028
      - SHL.SB.SYM.095
    study_tags:
      - 五苓散证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.072
    no: 72
    text: 发汗已，脉浮数，烦渴者，五苓散主之。
    translation: 发汗后，脉浮数，心烦口渴的，用五苓散主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗已，脉浮数者，表邪未尽也。烦渴，亡津液，胃燥也。与五苓散，和表润燥。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗后气化不利、水津不布，烦渴用五苓散化气行水。
    formulas:
      - SHL.SB.F.028
    symptom_tags:
      - SHL.SB.SYM.053
      - SHL.SB.SYM.014
      - SHL.SB.SYM.015
    study_tags:
      - 五苓散证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.073
    no: 73
    text: 伤寒，汗出而渴者，五苓散主之；不渴者，茯苓甘草汤主之。
    translation: 伤寒，汗出而口渴的，用五苓散主治；不渴的，用茯苓甘草汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒汗出而渴者，亡津液胃燥，邪气渐传里也，五苓散以和表里。若汗出不渴者，邪气不传里，但在表而表虚也，与茯苓甘草汤，和表合卫。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以口渴与否辨水停部位，分别用五苓散与茯苓甘草汤。
    formulas:
      - SHL.SB.F.028
      - SHL.SB.F.041
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.015
    study_tags:
      - 五苓散证
      - 茯苓甘草汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.074
    no: 74
    text: 中风发热，六七日不解而烦，有表里证，渴欲饮水，水入则吐者，名曰水逆，五苓散主之。
    translation: 中风发热，六七天不解除而心烦，表里证都有，口渴想喝水，水喝进去就吐出的，叫水逆，用五苓散主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 中风发热，至六七日则当解。若不解烦者，邪在表也。渴欲饮水，邪传里也。里热甚则能消水，水入则不吐。里热少则不能消水，停积不散，饮而吐水也。以其因水而吐，故名水逆。与五苓散，和表里，散停饮。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 水饮内停，水入即吐，五苓散化气利水。
    formulas:
      - SHL.SB.F.028
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.014
      - SHL.SB.SYM.015
      - SHL.SB.SYM.096
    study_tags:
      - 水逆
      - 五苓散证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.075
    no: 75
    text: 未持脉时，病人手叉自冒心，师因教试令咳而不咳者，此必两耳聋无闻也。所以然者，以重发汗，虚故如此。发汗后，饮水多必喘，以水灌之亦喘。
    translation: 还没有诊脉时，病人双手交叉按住心口，医生让他咳嗽却不咳，这必定是两耳聋听不见。这是因为重复发汗，正气虚的缘故。发汗后喝水多必定气喘，用水浇灌身体也会气喘。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗多，亡阳，胸中阳气不足者，病人手义自冒心，师见外证，知阳气不足也。又试令咳而不即咳者，耳聋也，知阳气□虚明矣。耳聋者，阳气虚，精气不得上通于耳，故也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 重发汗伤心阳而耳聋，水饮犯肺则喘。
    formulas: []
