    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.076
    no: 76
    text: 发汗后，水药不得入口为逆，若更发汗，必吐下不止。发汗吐下后，虚烦不得眠，若剧者，必反复颠倒，心中懊憹，栀子豉汤主之；若少气者，栀子甘草豉汤主之；若呕者，栀子生姜豉汤主之。
    translation: 发汗后，水和药都不能入口属于逆证，如果再发汗，必定呕吐下利不止。发汗吐下后，虚烦不能安睡，如果严重的，必定反复颠倒、心中懊憹，用栀子豉汤主治；如果少气的，用栀子甘草豉汤主治；如果呕吐的，用栀子生姜豉汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发汗吐下后，邪热乘虚客于胸中。谓之虚烦者，热也，胸中烦热郁闷而不得发散者是也。无气伏于里者则喜睡，今热气浮于上，烦扰阳气，故不得眠。心恶热，热甚则必神昏，是以剧者反覆颠倒而不安，心中懊憹而愦闷。懊憹者，俗谓鹘突是也。
      - source: 伤寒明理论
        author: 成无己
        text: 虚烦之状，心中温温然欲吐，愦愦然无奈，欲呕不呕，扰扰乱乱，是名烦也，非吐则不能已。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：虚烦为汗吐下后无形邪热郁于胸膈，栀子豉汤清宣郁热；「心中懊憹」不可名状，是本证主证眼目，后世视之为清宣胸膈郁热之祖方。
    formulas:
      - SHL.SB.F.042
      - SHL.SB.F.043
      - SHL.SB.F.044
    symptom_tags:
      - SHL.SB.SYM.098
      - SHL.SB.SYM.086
      - SHL.SB.SYM.099
      - SHL.SB.SYM.067
    study_tags:
      - 栀子豉汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.077
    no: 77
    text: 发汗，若下之，而烦热胸中窒者，栀子豉汤主之。
    translation: 发汗或泻下后，心烦发热、胸中窒塞不通的，用栀子豉汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳受气于胸中，发汗若下，使阳气不足，邪热客于胸中，结而不散，故烦热而胸中窒塞。与栀子豉汤以吐胸中之邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 余热留扰胸膈，胸中窒，栀子豉汤宣透。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
      - SHL.SB.SYM.014
