  - id: SHL.SB.TYZ.075
    no: 75
    text: 未持脉时，病人手叉自冒心，师因教试令咳而不咳者，此必两耳聋无闻也。所以然者，以重发汗，虚故如此。发汗后，饮水多必喘，以水灌之亦喘。
    translation: 还没有诊脉时，病人双手交叉按住心口，医生让他咳嗽却不咳，这必定是两耳聋听不见。这是因为重复发汗，正气虚的缘故。发汗后喝水多必定气喘，用水浇灌身体也会气喘。
    annotations:
