  - id: SHL.SB.TYZ.088
    no: 88
    text: 汗家，重发汗，必恍惚心乱，小便已阴疼，与禹余粮丸。
    translation: 平素容易出汗的人，重复发汗，必定精神恍惚、心中烦乱，小便后阴部疼痛，给与禹余粮丸。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 汗者，心之液。汗家重发汗，则心虚恍愡心乱。夺汗则无水，故小便已阴中疼。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗家阳气津液本虚，重汗后心神失养。
    formulas:
