  - id: SHL.SB.TYZ.061
    no: 61
    text: 下之后，复发汗，昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者，干姜附子汤主之。
    translation: 泻下之后又发汗，白天烦躁不能安睡，夜里安静，不呕不渴，没有表证，脉沉微，身体没有明显发热的，用干姜附子汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗下后阳气暴虚，用干姜附子汤急救回阳。
    formulas:
