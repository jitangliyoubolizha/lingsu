      - SHL.SB.SYM.014
    study_tags:
      - 栀子干姜汤证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.081
    no: 81
    text: 凡用栀子汤，病人旧微溏者，不可与服之。
    translation: 凡用栀子汤，病人平素大便微溏的，不可服用。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 病人旧微溏者，里虚而寒在下也。虽烦则非蕴热，故不可与栀子汤。《内经》曰：先泄而后生他病者，治其本，必且调之，后乃治其他病。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 素体脾虚便溏者禁用栀子汤。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
      - SHL.SB.SYM.039
    study_tags:
      - 栀子汤禁忌
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.TYZ.082
    no: 82
    text: 太阳病发汗，汗出不解，其人仍发热，心下悸，头眩，身瞤动，振振欲擗地者，真武汤主之。
    translation: 太阳病发汗，汗出而病不解，病人仍然发热，心下悸动，头晕，身体肌肉跳动，身体震颤想要跌倒的，用真武汤主治。
    annotations:
      - source: 伤寒论类方
        author: 徐大椿
        text: 其人仍发热，表邪仍在。心下悸，下焦肾水因心液不足，随阳而上犯。头眩身瞤动，振振欲擗地者，阳气泄则虚浮无依着。真武汤主之，此方镇伏肾水，挽回阳气。
      - source: 伤寒论集注
        author: 张志聪
        text: 此身瞤动，振振欲擗地者，乃心肾两虚，生阳不能充达于四体，故以真武汤主之。真武者，北方元武七宿镇水之神也。用熟附壮火之原，温下焦之寒水，白术补中焦之土气，生姜达上焦之阳气，茯苓归伏心气，芍药通调经脉。
      - source: 参考《郝万山伤寒论讲稿》
        author: 灵素内容组
        text: 郝万山常将 82 条与 316 条真武汤证互参：一为过汗伤阳、水气上冲，一为少阴阳虚、水气浸渍，病机同属阳虚水泛，故同用真武汤温阳利水。
    formulas:
      - SHL.SB.F.047
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.088
      - SHL.SB.SYM.093
      - SHL.SB.SYM.103
      - SHL.SB.SYM.104
    study_tags:
      - 真武汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.083
    no: 83
    text: 咽喉干燥者，不可发汗。
    translation: 咽喉干燥的人，不可发汗。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 膀胱里热则淋。反以汤药发汗，亡耗津液，増积客热，膀胱虚燥，必小便血。
      - source: 项目自编（待校对）
