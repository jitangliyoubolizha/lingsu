  - id: SHL.SB.TYZ.090
    no: 90
    text: 本发汗，而复下之，此为逆也；若先发汗，治不为逆。本先下之，而反汗之，为逆；若先下之，治不为逆。
    translation: 应当先发汗却反而泻下，这是逆治；如果先发汗，就不算逆治。应当先泻下却反而发汗，是逆治；如果先泻下，就不算逆治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 病在表者，汗之为宜，下之为逆。病在里者，下之为宜，汗之为逆。经曰：阳盛阴虚，汗之则死，下之则愈；阳虚阴盛，汗之则愈，下之则死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 强调表里先后治则。
    formulas: []
    symptom_tags: []
    study_tags:
      - 治则
      - 表里先后
    notes: AI 初稿待校对。