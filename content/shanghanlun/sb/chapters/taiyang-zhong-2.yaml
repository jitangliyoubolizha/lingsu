      - SHL.SB.SYM.086
      - SHL.SB.SYM.054
    study_tags:
      - 干姜附子汤证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.062
    no: 62
    text: 发汗后，身疼痛，脉沉迟者，桂枝加芍药生姜各一两人参三两新加汤主之。
    translation: 发汗后身体疼痛，脉沉迟的，用桂枝加芍药生姜各一两人参三两新加汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗后营血不足，身痛脉沉迟，益气养营兼和营卫。
