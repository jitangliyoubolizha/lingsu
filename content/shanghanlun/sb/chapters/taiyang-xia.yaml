  - id: SHL.SB.TYX.140
    no: 140
    text: 太阳病，下之，其脉促，不结胸者，此为欲解也；脉浮者，必结胸；脉紧者，必咽痛；脉弦者，必两胁拘急；脉细数者，头痛未止；脉沉紧者，必欲呕；脉沉滑者，协热利；脉浮滑者，必下血。
    translation: 太阳病误下后，脉促而不结胸的，是将要解除；脉浮的，必定结胸；脉紧的，必定咽痛；脉弦的，必定两胁拘急；脉细数的，头痛未止；脉沉紧的，必定想呕；脉沉滑的，是协热利；脉浮滑的，必定下血。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 此太阳病下之后，邪气传变。其脉促者，为阳盛。下后脉促，为阳胜阴也，故不作结胸，为欲解。下后脉浮，为上焦阳邪结而为结胸也。经曰：结胸者，寸脉浮，关脉沉。下后脉紧，则太阳之邪传于少阴。经曰：脉紧者属少阴。《内经》曰：邪客于少阴之络，令人嗌痛不可内食。所以脉紧者，必咽痛。脉□，则太阳之邪传于少阳。经曰：尺寸俱□者，少阳受病也。其脉循胁络于耳，所以脉□者，必两胁拘急。下后邪气传里，则头痛当止。脉细数，为邪未传里而伤气也。细为气少，数为在表，故头痛未止。脉沉紧，则太阳之邪传于阳明，为里实也。沉为在里，紧为里实，阳明里实，故必欲呕。脉滑，则太阳之邪传于肠胃。以滑为阴气有余，知邪气入里，干于下焦也。沉为血胜气虚，是为恊热利。浮为气胜血虚，是知必下血。经日：不宜下而便攻之，诸变不可胜数。此之谓也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以误下后的不同脉象推断病情转归。
