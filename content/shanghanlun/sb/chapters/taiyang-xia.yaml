  - id: SHL.SB.TYX.136
    no: 136
    text: 伤寒十余日，热结在里，复往来寒热者，与大柴胡汤；但结胸，无大热者，此为水结在胸胁也，但头微汗出者，大陷胸汤主之。
    translation: 伤寒十多天，热邪结聚在里，又出现往来寒热的，给与大柴胡汤；如果只是结胸，没有明显大热，这是水饮结聚在胸胁，只有头部微微出汗的，用大陷胸汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒十余日，热结在里，是可下之证。复往来寒热，为正邪分争，未全敛结，与大柴胡汤下之。但结胸无大热者，非热结也，是水饮结于胸胁，谓之水结胸。周身汗出者，是水饮外散，则愈。若但头防汗出，余处无汗，是水饮不得外泄，停畜而不行也。与大防胸汤，以逐其水。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 比较热结里实的少阳合并证与水结胸胁的结胸证。
