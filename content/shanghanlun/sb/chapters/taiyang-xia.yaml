  - id: SHL.SB.TYX.134
    no: 134
    text: 太阳病，脉浮而动数，浮则为风，数则为热，动则为痛，数则为虚，头痛发热，微盗汗出，而反恶寒者，表未解也。医反下之，动数变迟，膈内拒痛，胃中空虚，客气动膈，短气躁烦，心中懊憹，阳气内陷，心下因硬，则为结胸，大陷胸汤主之。若不结胸，但头汗出，余处无汗，剂颈而还，小便不利，身必发黄。
    translation: 太阳病，脉浮而动数，浮主风，数主热，动主痛，数又主虚，头痛发热，轻微盗汗，反而怕冷，是表邪未解。医生反而泻下，动数脉变为迟，胸膈内拒按疼痛，胃中空虚，邪气扰动胸膈，出现短气烦躁，心中懊憹，阳气内陷，心下因而硬满，就成为结胸，用大陷胸汤主治。如果没有形成结胸，只头出汗，身体其他部位无汗，汗出到颈部为止，小便不利，身体必定发黄。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 动数皆阳脉也，当责邪在表。睡而汗出者，谓之盗汗，为邪气在半表半里，则不恶寒。此头痛发热，防盗汗出，反恶寒者，表未解也，当发其汗。医反下之，虚其胃气，表邪乗虚则防。邪在表则见阳脉，邪在里则见阴脉。邪气内防，动数之脉所以变迟，而浮脉独不变者，以邪结胸中，上焦阳结，脉不得而沉也。客气者，外邪乗胃中空虚，入里结于胸膈。膈中拒痛者，客气动膈也。《金匮要畧》曰：短气不足以息者，实也。短气躁烦，心中懊憹，皆邪热为实，阳气内防，气不得通于膈，壅于心下，为硬满而痛，成结胸也。与大防胸汤，以下结热。若胃中空虚，阳气内防，不结于胸膈，下入于胃中者，遍身汗出，则为热越，不能发黄。若但头汗出，身无汗，剂颈而还，小便不利者，热不得越，必发黄也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 详述误下成结胸的机理，并指出不结胸则湿热发黄。
