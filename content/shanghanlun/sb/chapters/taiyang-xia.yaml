  - id: SHL.SB.TYX.143
    no: 143
    text: 妇人中风，发热恶寒，经水适来，得之七八日，热除而脉迟身凉，胸胁下满如结胸状，谵语者，此为热入血室也，当刺期门，随其实而取之。
    translation: 妇人中风，发热怕冷，月经正好来潮，病到七八天，热退脉迟身凉，胸胁下胀满像结胸一样，出现谵语的，这是热入血室，应当刺期门，随邪实所在而泻之。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 结胸者，邪结在胸；藏结者，邪结在藏。二者皆下后邪气乘虚入里所致。下后邪气入里，与阳相结者，为结胸，以阳受气于胸中故尔；与阴相结者，为藏结，以阴受之则入五藏故尔。气宜通而塞，故痛。邪结阳分，则阴气不得上通；邪结阴分，则阳气不得下通。是二者皆心下硬痛。寸脉浮，关脉沉，知邪结在阳也；寸脉浮，关脉小细沉紧，知邪结在阴也。阴结而阳不结，虽心下结痛，饮食亦自如，故阴气乗肠虚而下，故时时自下利。阴得阳则解，藏结得热证多，则易治。舌上白胎滑，邪气着结，胸中亦寒，故云难治。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 热入血室，针刺期门泄热。
    formulas: []
