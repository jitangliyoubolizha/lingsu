  - id: SHL.SB.TYX.131
    no: 131
    text: 结胸者，项亦强，如柔痉状，下之则和，宜大陷胸丸。
    translation: 结胸病人，颈项也强直，像柔痉一样，用攻下法可以缓和，适合用大陷胸丸。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 结胸病，项强者为邪结胸中，胸膈结满，心下紧实，但能仰而不能俛，是项强亦如柔痉之状也。与大防胸丸，下结泄满。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 结胸见项强如柔痉，用大陷胸丸缓下。
