  - id: SHL.SB.TYX.141
    no: 141
    text: 病在阳，应以汗解之，反以冷水潠之，若灌之，其热被劫不得去，弥更益烦，肉上粟起，意欲饮水，反不渴者，服文蛤散；若不差者，与五苓散。寒实结胸，无热证者，与三物小陷胸汤，白散亦可服。
    translation: 病在阳，应当用汗法解除，反而用冷水喷洒或灌洗，热邪被遏不能外散，更加烦躁，皮肤起粟粒样，想喝水反而不渴的，服文蛤散；如果不愈，给与五苓散。寒实结胸，没有热证的，给与三物小陷胸汤，白散也可以服。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 病在阳，为邪在表也，法当汗出而解。反以冷水潠之灌洗，热被寒水，外不得出，则反攻其里，弥更益烦，肉上粟起者，水寒之气客于皮肤也。意欲饮水者，里有热也。反不渴者，寒在表也。与文蛤散以散表中水寒之气。若不差，是水热相搏，欲传于里，与五苓散发汗以和之。始热在表，因水寒制之，不得外泄，内攻于里，结于胸膈，心下硬痛。本以水寒伏热为实，故谓之寒实结胸。无热证者，外无热而热悉收敛于里也。与小防胸汤以下逐之，白散下热，故亦可攻。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 水寒郁遏致烦，分别用文蛤散、五苓散；寒实结胸用白散。
