  - id: SHL.SB.TYX.145
    no: 145
    text: 妇人伤寒，发热，经水适来，昼日明了，暮则谵语，如见鬼状者，此为热入血室，无犯胃气及上二焦，必自愈。
    translation: 妇人伤寒，发热，月经正好来潮，白天神志清楚，傍晚谵语，像见到鬼一样，这是热入血室，不要损伤胃气和上中二焦，必定自行痊愈。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒发热者，寒已成热也。经水适来，则血室空虚，邪热乗虚入于血室。若昼日谵语，为邪客于府，与阳争也。此昼日明了，暮则谵语，如见鬼状，是邪不入府，入于血室，与阴争也。阳盛谵语，则宜下。此热入血室，不可与下药，犯其胃气。热入血室，血结寒热者，与小柴胡汤，散邪发汗。此虽热入血室，而不留结，不可与发汗药，犯其上焦。热入血室，胸胁满如结胸状者，可刺期门。此虽热入血室，而无满结，不可刺期门，犯其中焦。必自愈者，以经行则热随血去，血下不已，则邪热悉除而愈矣。所为发汗为犯上焦者，发汗则动卫气，卫气出上焦故也。刺期门为犯中焦者，刺期门则动荣气，荣气出中焦故也。《脉经》曰：无犯胃气及上二焦，必自愈。岂谓药，不谓针耶？
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 热入血室而月经来潮，热随血泄可自愈。
