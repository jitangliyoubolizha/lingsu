  - id: SHL.SB.TYX.144
    no: 144
    text: 妇人中风，七八日续得寒热，发作有时，经水适断者，此为热入血室，其血必结，故使如疟状，发作有时，小柴胡汤主之。
    translation: 妇人中风，七八天后续发寒热，定时发作，月经正好停止的，这是热入血室，其血必定瘀结，所以像疟疾一样定时发作，用小柴胡汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 中风七八日，邪气传里之时，本无寒热，而续得寒热，经水适防者，此为表邪乗血室虚，入于血室，与血相抟，而血结不行，经水所以防也。血气与邪分争，致寒热如疟，而发作有时。与小柴胡汤，以解传经之邪。
      - source: 项目自编（待校对）
