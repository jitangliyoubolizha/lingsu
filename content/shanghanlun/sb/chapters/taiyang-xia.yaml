  - id: SHL.SB.TYX.142
    no: 142
    text: 太阳与少阳并病，头项强痛，或眩冒，时如结胸，心下痞硬者，当刺大椎第一间、肺俞、肝俞，慎不可发汗；发汗则谵语，脉弦。五日谵语不止，当刺期门。
    translation: 太阳与少阳并病，头项强痛，或头晕目眩，有时像结胸，心下痞硬的，应当针刺大椎第一间、肺俞、肝俞，谨慎不可发汗；发汗会谵语、脉弦。五天谵语不止，应当刺期门。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳之脉，络头下项，头项强痛者，太阳表病也。少阳之脉，循胸络胁，如结胸心下痞硬者，少阳里病也。太阳少阳相并，为病不纯在表，故头项不但强痛而或□冒；亦未全入里，故时如结胸心下痞硬。此邪在半表半里之间也。刺大椎第一间肺俞，以写太阳之邪；刺肝俞，以泻少阳之邪。邪在表则可发汗，邪在半表半里则不可发汗，发汗则亡津液，损动胃气，少阳之邪因干于胃，土为木刑，必发谵语。脉□，至五六日传经尽，邪热去而谵语当止。若复不止，为少阳邪热甚也。刺期门以泻肝胆之气。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太少并病宜针刺，不可发汗。
