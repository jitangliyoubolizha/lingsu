  - id: SHL.SB.TYX.139
    no: 139
    text: 太阳病，二三日，不能卧，但欲起，心下必结，脉微弱者，此本有寒分也。反下之，若利止，必作结胸；未止者，四日复下之，此作协热利也。
    translation: 太阳病两三天，不能躺卧，只想起来，心下必定结聚，脉微弱的，这是本有寒饮。反而泻下，如果下利停止，必定形成结胸；下利未止，到第四天又泻下，就形成协热利。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳病二三日，邪在表也。不能卧，但欲起，心下必结者，以心下结满，卧则气壅而愈甚，故不能卧而但欲起也。心下结满，有水分，有寒分，有气分。今脉防弱，知本有寒分。医见心下结，而反下之，则太阳表邪乗虚入里。利止，则邪气留结，为结胸。利不止，至次日复如前，下利不止者，是邪热下攻肠胃，为挟热利也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 素体有寒而误下，可致结胸或协热利。
    formulas: []
