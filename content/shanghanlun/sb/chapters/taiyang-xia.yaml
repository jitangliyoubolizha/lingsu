  - id: SHL.SB.TYX.133
    no: 133
    text: 结胸证悉具，烦躁者亦死。
    translation: 结胸症状全部具备，又见烦躁的，预后也差。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 结胸证悉具，邪结已深也。烦躁者，正气散乱也。邪气胜正，病者必死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 结胸正虚邪实而烦躁，预后不良。
    formulas: []
