clauses:
  - id: SHL.SB.TYX.128
    no: 128
    text: 问曰：病有结胸，有藏结，其状何如？答曰：按之痛，寸脉浮，关脉沉，名曰结胸也。何谓藏结？答曰：如结胸状，饮食如故，时时下利，寸脉浮，关脉小细沉紧，名曰藏结。舌上白胎滑者，难治。
    translation: 问道：病有结胸和藏结，症状怎样区别？回答说：按压疼痛，寸脉浮、关脉沉的，叫结胸。什么叫藏结？回答说：像结胸的样子，但饮食照常，时时下利，寸脉浮、关脉小细沉紧的，叫藏结。舌上白滑苔的，难以处理。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 结胸者，邪结在胸；藏结者，邪结在藏。二者皆下后邪气乘虚入里所致。下后邪气入里，与阳相结者，为结胸，以阳受气于胸中故尔。与阴相结者，为藏结，以阴受之则入五藏故尔。气宜通而塞，故痛。邪结阳分，则阴气不得上通；邪结阴分，则阳气不得下通。是二者皆心下硬痛。寸脉浮，关脉沉，知邪结在阳也。寸脉浮，关脉小细沉紧，知邪结在阴也。阴结而阳不结，虽心下结痛，饮食亦自如，故阴气乗肠虚而下，故时时自下利。阴得阳则解，藏结得热证多，则易治。舌上白胎滑，邪气着结胸中，亦寒，故云难治。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以按痛、脉象和饮食情况区分结胸与藏结。
