  - id: SHL.SB.TYX.146
    no: 146
    text: 伤寒六七日，发热微恶寒，支节烦疼，微呕，心下支结，外证未去者，柴胡桂枝汤主之。
    translation: 伤寒六七天，发热轻微怕冷，四肢关节烦痛，轻微呕吐，心下支撑结聚，表证未去的，用柴胡桂枝汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒六七日，邪当传里之时，支散也。呕而心下结者，里证也，法当攻里。发热防恶寒，支节烦疼，为外证未去，不可攻里。与柴胡桂枝汤，以和解之。
      - source: 项目自编（待校对）
