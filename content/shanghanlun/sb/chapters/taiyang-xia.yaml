  - id: SHL.SB.TYX.147
    no: 147
    text: 伤寒五六日，已发汗而复下之，胸胁满微结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者，此为未解也，柴胡桂枝干姜汤主之。
    translation: 伤寒五六天，已经发汗又泻下，胸胁胀满微有结聚，小便不利，口渴而不呕，只有头部出汗，往来寒热，心烦的，这是病未解除，用柴胡桂枝干姜汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒五六日，已经汗下之后，则邪当解。今胸胁满防结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者，即邪气犹在半表半里之间，为未解也。胸胁满防结，寒热心烦者，邪在半表半里之间也。小便不利而渴者，汗下后亡津液内烁也。若热消津液，令小便不利而渴者，其人必呕。今渴而不呕，知非里热也。伤寒汗出则和，今但头汗出而余处无汗者，津液不足而阳虚于上也。与柴胡桂枝干姜汤，以解表里之邪，复津液而助阳也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗下后津伤饮停、少阳枢机不利，柴胡桂枝干姜汤和解化饮。
