  - id: SHL.SB.TYX.138
    no: 138
    text: 小结胸病，正在心下，按之则痛，脉浮滑者，小陷胸汤主之。
    translation: 小结胸病，正在心下部位，按压则痛，脉浮滑的，用小陷胸汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 心下硬痛，手不可近者，结胸也。正在心下，按之则痛，是热气犹浅，谓之小结胸。结胸脉沉紧，或寸浮关沉。今脉浮滑，知热未深结。与小防胸汤，以除胸膈上结热也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 小结胸病位局限、热痰互结，用小陷胸汤清热化痰。
    formulas:
