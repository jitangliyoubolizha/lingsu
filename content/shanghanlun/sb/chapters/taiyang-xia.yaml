  - id: SHL.SB.TYX.135
    no: 135
    text: 伤寒六七日，结胸热实，脉沉而紧，心下痛，按之石硬者，大陷胸汤主之。
    translation: 伤寒六七天，结胸热实，脉沉而紧，心下疼痛，按之像石头一样硬的，用大陷胸汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 此不云下后，而云伤寒六七日，则是传里之实热也。沉为在里，紧为里实，以心下痛、按之实硬，是以为结胸。与大陷胸汤，以下结热。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 邪气内结，既热且实，脉复沉紧，有似大承气证。然结在心下而不在腹中，虽按之石硬而痛，亦是水食互结，与阳明之燥粪不同，故宜甘遂之破饮，而不宜枳、朴之散气。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：大陷胸证为水热互结于胸腹，心下痛、按之石硬、脉沉紧为辨证要点；按之石硬与痞证之按之濡软相对，一为有形之结，一为无形之热痞。
    formulas:
      - SHL.SB.F.024
    symptom_tags:
      - SHL.SB.SYM.063
      - SHL.SB.SYM.070
      - SHL.SB.SYM.066
    study_tags:
      - 大陷胸汤证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYX.136
    no: 136
    text: 伤寒十余日，热结在里，复往来寒热者，与大柴胡汤；但结胸，无大热者，此为水结在胸胁也，但头微汗出者，大陷胸汤主之。
    translation: 伤寒十多天，热邪结聚在里，又出现往来寒热的，给与大柴胡汤；如果只是结胸，没有明显大热，这是水饮结聚在胸胁，只有头部微微出汗的，用大陷胸汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 比较热结里实的少阳合并证与水结胸胁的结胸证。
    formulas:
