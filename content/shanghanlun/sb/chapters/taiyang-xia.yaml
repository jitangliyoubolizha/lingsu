  - id: SHL.SB.TYX.130
    no: 130
    text: 病发于阳，而反下之，热入因作结胸；病发于阴，而反下之，因作痞也。所以成结胸者，以下之太早故也。
    translation: 病发于阳，反而误用泻下，热邪内陷就形成结胸；病发于阴，反而误用泻下，就形成痞证。形成结胸的原因，是泻下太早。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 发热恶寒者，发于阳也，而反下之，则表中阳邪入里，结于胸中，为结胸。无热恶寒者，发于阴也，而反下之，则表中阴邪入里，结于心下，为痞。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 误下是结胸与痞证形成的重要原因。
    formulas: []
