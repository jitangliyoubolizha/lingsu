  - id: SHL.SB.TYX.129
    no: 129
    text: 藏结无阳证，不往来寒热，其人反静，舌上胎滑者，不可攻也。
    translation: 藏结没有阳证表现，不出现往来寒热，病人反而安静，舌上苔滑的，不可用攻下法。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 藏结，于法当下。无阳证，为表无热；不往来寒热，为半表半里无热；其人反静，为里无热。经曰：舌上如胎者，以丹田有热，胃中有寒邪气。以表里皆寒，故不可攻。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 藏结属阴结，禁用攻下。
    formulas: []
    symptom_tags:
