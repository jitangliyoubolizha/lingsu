  - id: SHL.SB.TYX.132
    no: 132
    text: 结胸证，其脉浮大者，不可下，下之则死。
    translation: 结胸证，如果脉浮大的，不可攻下，误下会危及生命。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 结胸为邪结胸中，属上焦之分。得寸脉浮关脉沉者，为在里，则可下。若脉浮大，心下虽结，是在表者犹多，未全结也。下之重虚，邪气复结，则难可制，故云下之则死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 结胸脉浮大提示邪未完全内结，禁用攻下。
    formulas: []
