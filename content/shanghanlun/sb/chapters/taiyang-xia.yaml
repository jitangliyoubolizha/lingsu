  - id: SHL.SB.TYX.137
    no: 137
    text: 太阳病，重发汗而复下之，不大便五六日，舌上燥而渴，日晡所小有潮热，从心下至少腹硬满而痛不可近者，大陷胸汤主之。
    translation: 太阳病，反复发汗又泻下，五六天不大便，舌上干燥而口渴，傍晚时轻微潮热，从心下到少腹硬满疼痛、不能触碰的，用大陷胸汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 重发汗而复下之，则内外重亡津液，而邪热内结，致不大便五六日，舌上燥而渴也。日晡潮热者属胃。此日晡小有潮热，非但在胃，从心下至少腹硬满而痛不可近者，是一腹之中上下邪气俱甚也。与大防胸汤以下其邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 津伤热结、水热互结范围广泛，大陷胸汤急下。
    formulas:
