clauses:
  - id: SHL.SB.YI.392
    no: 392
    text: 伤寒阴阳易之为病，其人身体重、少气、少腹里急，或引阴中拘挛，热上冲胸，头重不欲举，眼中生花，膝胫拘急者，烧裩散主之。
    translation: 伤寒阴阳易病的表现为：患者身体沉重、气息短促、小腹拘急不适，或者牵引到阴部拘挛不舒，热气上冲胸中，头部沉重不愿抬起，眼前昏花，膝部和小腿拘急不舒，用烧裩散主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阴阳易为大病初愈后因房事而得的特殊病证。身体重、少气为正气大虚；少腹里急、阴中拘挛为肾气受损；热上冲胸、头重眼花为虚阳上浮。烧裩散取同气相求之意，为古代特殊疗法。
    formulas:
      - SHL.SB.F.076
    symptom_tags:
