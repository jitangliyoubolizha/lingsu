      - SHL.SB.SYM.030
    study_tags:
      - 阴阳易
      - 差后病
      - 烧裩散
    notes: AI 初稿待校对。
  - id: SHL.SB.YI.393
    no: 393
    text: 大病差后，劳复者，枳实栀子豉汤主之。
    translation: 大病痊愈之后，因为劳累而复发的，用枳实栀子豉汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 大病初愈，正气尚未完全恢复，若过早劳累则余邪复燃。枳实栀子豉汤清热除烦、行气消痞，为劳复的对症方。方中枳实行气，栀子清热除烦，豆豉透邪外出。
    formulas:
      - SHL.SB.F.077
    symptom_tags:
      - SHL.SB.SYM.190
    study_tags:
      - 劳复
      - 差后病
      - 枳实栀子豉汤
    notes: AI 初稿待校对。
  - id: SHL.SB.YI.394
    no: 394
    text: 伤寒差以后，更发热，小柴胡汤主之。脉浮者，以汗解之；脉沉实者，以下解之。
    translation: 伤寒病愈之后，又重新出现发热的，用小柴胡汤主治。如果脉象浮的，用发汗法解除；如果脉象沉实的，用泻下法解除。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 差后复热，有表里之分。脉浮为邪在表，当汗解；脉沉实为邪在里，当下解；若脉不浮不沉，邪在半表半里，则用小柴胡汤和解。小柴胡汤为差后复热的通治方。
    formulas:
      - SHL.SB.F.020
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.196
    study_tags:
      - 差后发热
      - 小柴胡汤
      - 辨脉论治
    notes: AI 初稿待校对。
  - id: SHL.SB.YI.395
    no: 395
    text: 大病差后，从腰以下有水气者，牡蛎泽泻散主之。
    translation: 大病痊愈之后，腰部以下出现水气停聚的，用牡蛎泽泻散主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 大病差后，正气未复，水湿之邪停聚于下焦，故腰以下水肿。牡蛎泽泻散利水消肿、软坚散结，为差后水肿的专方。方中牡蛎、泽泻、海藻等利水软坚，商陆根逐水消肿。
    formulas:
      - SHL.SB.F.078
    symptom_tags:
      - SHL.SB.SYM.191
    study_tags:
      - 差后水肿
      - 牡蛎泽泻散
      - 水气病
    notes: AI 初稿待校对。
  - id: SHL.SB.YI.396
    no: 396
    text: 大病差后，喜唾，久不了了，胸上有寒，当以丸药温之，宜理中丸。
    translation: 大病痊愈之后，老是喜欢吐唾液，很长时间不好的，这是胸膈以上有寒邪，应当用丸药来温化，适合用理中丸。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 差后喜唾不止，为中焦虚寒、脾阳不振、津液不能正常输布而上泛为唾。理中丸温中健脾、恢复脾运，寒去则唾自止。用丸药缓图，适合差后调理。
    formulas:
      - SHL.SB.F.079
    symptom_tags:
      - SHL.SB.SYM.192
    study_tags:
      - 差后喜唾
      - 理中丸
      - 中焦虚寒
    notes: AI 初稿待校对。
  - id: SHL.SB.YI.397
    no: 397
    text: 伤寒解后，虚羸少气，气逆欲吐，竹叶石膏汤主之。
    translation: 伤寒病解除之后，身体虚弱消瘦、气息短促，气机上逆想要呕吐的，用竹叶石膏汤主治。
    annotations:
      - source: 伤寒溯源集
        author: 钱潢
        text: 竹叶性寒而止烦热，石膏入阳明而清胃热，半夏蠲饮而止呕吐，人参补病后之虚，同麦冬而大添胃中之津液。又恐寒凉损胃，故用甘草和之，而又以粳米助其胃气也。
      - source: 伤寒论类方
        author: 徐大椿
        text: 此仲景先生治伤寒愈后调养之方也，其法专于滋养肺胃之阴气，以复津液。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：大病差后、余热未清而气津两伤，故虚羸少气、气逆欲吐；竹叶石膏汤清热生津、益气和胃，清补并用，为病后调理之祖方。
    formulas:
      - SHL.SB.F.080
    symptom_tags:
      - SHL.SB.SYM.193
      - SHL.SB.SYM.114
      - SHL.SB.SYM.194
    study_tags:
      - 差后虚羸
      - 竹叶石膏汤
      - 气阴两伤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.YI.398
    no: 398
    text: 病人脉已解，而日暮微烦，以病新差，人强与谷，脾胃气尚弱，不能消谷，故令微烦，损谷则愈。
    translation: 病人的脉象已经恢复正常，但是每到傍晚就微微烦闷不适，这是因为病刚刚痊愈，旁人勉强让他进食，脾胃之气还比较虚弱，不能消化食物，所以导致微微烦闷，减少饮食量就会好的。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此条为全书最后一条，强调差后饮食调护的重要性。病后脾胃虚弱，不可勉强进食，否则食积不化而生烦热。"损谷则愈"即减少饮食量，待脾胃自行恢复，体现了中医"三分治七分养"的调护思想。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.195
    study_tags:
      - 差后调护
      - 饮食调养
      - 损谷则愈
    notes: AI 初稿待校对。
