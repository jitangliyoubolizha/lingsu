  - id: SHL.SB.YM.221
    no: 221
    text: 阳明病，脉浮而紧，咽燥口苦，腹满而喘，发热汗出，不恶寒反恶热，身重。若发汗则躁，心愦愦反谵语。若加温针，必怵惕烦躁不得眠。若下之，则胃中空虚，客气动膈，心中懊憹，舌上胎者，栀子豉汤主之。
    translation: 阳明病，脉象浮而紧，咽喉干燥口苦，腹部胀满并且气喘，发热出汗，不怕冷反而怕热，身体沉重。如果发汗就会烦躁，心中烦乱反而谵语。如果加用温针，必然会恐惧烦躁不能入睡。如果泻下，就会导致胃中空虚，客气动膈，心中懊恼烦闷，舌上有苔的，用栀子豉汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脉浮发热，为邪在表。咽燥口苦，为热在经。脉紧腹满而喘，汗出不恶寒反恶热身重，为邪在里。此表里俱有邪，犹当和解之。若发汗攻表，表热虽除，而内热益甚，故躁而愦愦，反谵语。愦愦者，心乱。经曰：荣气微者，加烧针则血不行，更发热而躁烦。此表里有热，若加烧针，则损动阴气，故怵惕烦躁不得眠也。若下之，里热虽去，则胃中空虚，表中客邪之气乗虚陷于上焦，烦动于隔，使心中懊憹而不了了也。舌上胎黄者，热气客于胃中。舌上胎白，知热气客于胸中。与栀子豉汤以吐胸中之邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
