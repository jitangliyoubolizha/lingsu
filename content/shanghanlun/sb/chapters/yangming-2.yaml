    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.235
    no: 235
    text: 阳明病，脉浮，无汗而喘者，发汗则愈，宜麻黄汤。
    translation: 阳明病，脉象浮，没有汗并且气喘的，发汗就会好，适合用麻黄汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 但头汗出，身无汗，剂颈而还者，热不得越也。小便不利，渴引水浆者，热甚于胃，津液内竭也。胃为土而色黄，胃为热蒸，则色夺于外，必发黄也。与茵陈汤，逐热退黄。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮无汗喘为太阳伤寒表实证，虽有阳明证但表实为主，当用麻黄汤发汗解表。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.002
      - SHL.SB.SYM.024
      - SHL.SB.SYM.018
    study_tags:
      - 阳明兼表
      - 麻黄汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.236
    no: 236
    text: 阳明病，发热汗出者，此为热越，不能发黄也。但头汗出，身无汗，剂颈而还，小便不利，渴引水浆者，此为瘀热在里，身必发黄，茵陈蒿汤主之。
    translation: 阳明病，发热出汗的，这是热邪外越，不会发黄。只是头部出汗，身体没有汗，到颈部为止，小便不通利，口渴饮水的，这是瘀热在里，身体必然会发黄，用茵陈蒿汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 小便不利，渴引水浆者，热甚于胃，津液内竭也。胃为土而色黄，胃为热蒸，则色夺于外，必发黄也。与茵陈汤，逐热退黄。
      - source: 伤寒来苏集
        author: 柯琴
        text: 身无汗，小便不利，不得用白虎；瘀热发黄，内无津液，不得用五苓。故制茵陈汤，以佐栀子承气之所不及也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：阳明发黄因湿热瘀里、汗与小便俱不利、热无出路，茵陈蒿汤清利湿热，使瘀热从小便而去；方后「尿如皂角汁状，色正赤」即湿热外泄之效验。
    formulas:
      - SHL.SB.F.108
    symptom_tags:
