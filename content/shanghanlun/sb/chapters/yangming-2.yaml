  - id: SHL.SB.YM.225
    no: 225
    text: 脉浮而迟，表热里寒，下利清谷者，四逆汤主之。
    translation: 脉象浮而迟，表有热里有寒，下利排出完谷不化的食物的，用四逆汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮为表热，迟为里寒。下利清谷者，里寒甚也。与四逆汤温里散寒。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮为表有热（假热），脉迟为里有寒（真寒）。下利清谷为脾肾阳虚、不能腐熟水谷。此为真寒假热证，四逆汤回阳救逆。
    formulas:
