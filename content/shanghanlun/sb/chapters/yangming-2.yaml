    notes: AI 初稿待校对。
  - id: SHL.SB.YM.236
    no: 236
    text: 阳明病，发热汗出者，此为热越，不能发黄也。但头汗出，身无汗，剂颈而还，小便不利，渴引水浆者，此为瘀热在里，身必发黄，茵陈蒿汤主之。
    translation: 阳明病，发热出汗的，这是热邪外越，不会发黄。只是头部出汗，身体没有汗，到颈部为止，小便不通利，口渴饮水的，这是瘀热在里，身体必然会发黄，用茵陈蒿汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 发热汗出为热有出路（热越），故不发黄。但头汗出、身无汗为热不得外越，小便不利为湿不得下泄，渴引水浆为湿热内盛。湿热郁蒸则发黄。茵陈蒿汤清热利湿退黄。
    formulas:
      - SHL.SB.F.108
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.068
      - SHL.SB.SYM.024
      - SHL.SB.SYM.028
      - SHL.SB.SYM.015
      - SHL.SB.SYM.069
    study_tags:
      - 阳明发黄
      - 茵陈蒿汤
      - 湿热郁蒸
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.237
    no: 237
    text: 阳明证，其人喜忘者，必有蓄血。所以然者，本有久瘀血，故令喜忘，屎虽硬，大便反易，其色必黑者，宜抵当汤下之。
    translation: 阳明证，患者容易健忘的，必然有蓄血。之所以这样，是因为本来就有久瘀血，所以导致容易健忘，大便虽然硬，排大便反而容易，颜色必然发黑的，适合用抵当汤泻下。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 喜忘为瘀血扰心。本有久瘀血与阳明热邪相合，瘀热互结。大便硬反易为瘀血润肠，色黑为瘀血下行之征。抵当汤破血逐瘀。
    formulas:
      - SHL.SB.F.056
    symptom_tags: []
    study_tags:
      - 阳明蓄血
      - 抵当汤
      - 喜忘
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.238
    no: 238
    text: 阳明病，下之，心中懊憹而烦，胃中有燥屎者，可攻。腹微满，初头硬，后必溏，不可攻之。若有燥屎者，宜大承气汤。
    translation: 阳明病，泻下后，心中懊恼烦闷而烦躁，胃肠中有燥屎的，可以攻下。腹部微微胀满，开始硬后来必然溏的，不可以攻下。如果有燥屎的，适合用大承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后心中懊憹烦为余热未尽，若确有燥屎则可再攻。腹微满、初硬后溏为脾虚不运，非腑实，故不可攻。有燥屎者用大承气汤。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.067
      - SHL.SB.SYM.014
      - SHL.SB.SYM.091
    study_tags:
      - 大承气汤
      - 燥屎辨证
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.239
    no: 239
    text: 病人不大便五六日，绕脐痛，烦躁，发作有时者，此有燥屎，故使不大便也。
    translation: 患者五六天不大便，围绕肚脐疼痛，烦躁，发作有定时的，这是有燥屎，所以导致不大便。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 不大便五六日为腑实，绕脐痛为燥屎内结、腑气不通，烦躁为热扰心神，发作有时为阳明实热之特征（日晡潮热）。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.014
    study_tags:
      - 燥屎辨证
      - 绕脐痛
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.240
    no: 240
    text: 病人烦热，汗出则解，又如疟状，日晡所发热者，属阳明也。脉实者，宜下之；脉浮虚者，宜发汗。下之与大承气汤，发汗宜桂枝汤。
    translation: 患者烦躁发热，出汗就会解除，又像疟疾一样，下午申时左右发热的，属于阳明病。脉象实的，适合泻下；脉象浮虚的，适合发汗。泻下用大承气汤，发汗适合用桂枝汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 烦热汗出解为表证，如疟状日晡发热为阳明特征。脉实为里实当攻下（大承气汤），脉浮虚为表虚当发汗（桂枝汤）。同病异治，以脉定方。
    formulas:
      - SHL.SB.F.112
      - SHL.SB.F.001
    symptom_tags:
      - SHL.SB.SYM.014
      - SHL.SB.SYM.001
      - SHL.SB.SYM.004
      - SHL.SB.SYM.071
    study_tags:
      - 同病异治
      - 以脉定方
    notes: AI 初稿待校对。