clauses:
  - id: SHL.SB.YM.211
    no: 211
    text: 发汗多，若重发汗者，亡其阳，谵语脉短者死，脉自和者不死。
    translation: 发汗已经很多，如果再重复发汗的，就会亡失阳气，出现谵语。脉象短的会死，脉象自然平和的不会死。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗多复汗则阳气亡失，心神失养则谵语。脉短为阳气衰竭故死，脉自和为阳气尚存故不死。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.033
    study_tags:
      - 亡阳谵语
      - 脉象预后
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.212
    no: 212
    text: 伤寒若吐若下后不解，不大便五六日，上至十余日，日晡所发潮热，不恶寒，独语如见鬼状。若剧者，发则不识人，循衣摸床，惕而不安，微喘直视，脉弦者生，涩者死。微者，但发热谵语者，大承气汤主之。若一服利，则止后服。
    translation: 伤寒病如果涌吐或泻下后病不解除，五六天不大便，甚至十多天，每天下午申时发潮热，不怕冷，自言自语好像看见鬼的样子。如果病情严重的，发作时不认识人，沿着衣服摸索床铺，恐惧不安，轻微气喘两眼直视，脉象弦的能活，涩的会死。病情轻微的，只是发热谵语的，用大承气汤主治。如果服一次药后通便了，就停止后面的服药。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 吐下后不解为邪未去，不大便五六日至十余日为腑实已成。日晡潮热、不恶寒为阳明腑实特征。独语如见鬼、不识人、循衣摸床为热扰心神。微喘直视为正气将脱。脉弦为正气尚存故生，脉涩为正衰邪盛故死。轻证用大承气汤，中病即止。
    formulas:
      - SHL.SB.F.112
