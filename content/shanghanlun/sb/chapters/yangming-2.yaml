      - 栀子豉汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.229
    no: 229
    text: 阳明病，发潮热，大便溏，小便自可，胸胁满不去者，与小柴胡汤。
    translation: 阳明病，发潮热，大便溏薄，小便自然正常，胸胁部胀满不消除的，给小柴胡汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病腹满不大便，舌上胎黄者，为邪热入府，可下。若胁下硬满，虽不大便而呕，舌上白胎者，为邪未入府，在表里之间，与小柴胡汤以和解之。上焦得通，则呕止；津液得下，则胃气因和，汗出而解。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 虽有潮热但大便溏、小便自可，说明腑实未成。胸胁满不去为少阳证未解。此为阳明少阳并病，当和解少阳，用小柴胡汤。
    formulas:
      - SHL.SB.F.020
    symptom_tags:
      - SHL.SB.SYM.071
      - SHL.SB.SYM.119
    study_tags:
      - 阳明少阳并病
      - 小柴胡汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.230
    no: 230
    text: 阳明病，胁下硬满，不大便而呕，舌上白胎者，可与小柴胡汤。上焦得通，津液得下，胃气因和，身濈然汗出而解。
    translation: 阳明病，胁下硬满，不大便并且呕吐，舌上有白苔的，可以给小柴胡汤。上焦得以通畅，津液得以下行，胃气因而调和，身体濈濈然出汗而解除。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病腹满不大便，舌上胎黄者，为邪热入府，可下。若胁下硬满，虽不大便而呕，舌上白胎者，为邪未入府，在表里之间，与小柴胡汤以和解之。上焦得通，则呕止；津液得下，则胃气因和，汗出而解。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 胁下硬满、呕吐为少阳证，不大便为阳明证，舌上白苔说明非阳明实热。此为少阳阳明并病，用小柴胡汤和解少阳，枢机利则上焦通、津液下、胃气和、汗出而解。
    formulas:
      - SHL.SB.F.020
    symptom_tags:
      - SHL.SB.SYM.149
      - SHL.SB.SYM.013
    study_tags:
      - 小柴胡汤
      - 上焦得通
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.231
    no: 231
    text: 阳明中风，脉弦浮大而短气，腹都满，胁下及心痛，久按之气不通，鼻干不得汗，嗜卧，一身及目悉黄，小便难，有潮热，时时哕，耳前后肿，刺之小差，外不解。病过十日，脉续浮者，与小柴胡汤。
    translation: 阳明病感受风邪，脉象弦浮大并且气短，腹部全部胀满，胁下和心口疼痛，长时间按压气不流通，鼻腔干燥不出汗，嗜睡，全身和眼睛都发黄，小便困难，有潮热，时常呃逆，耳朵前后肿胀，针刺后稍微好转，表证不解除。病过了十天，脉象继续浮的，给小柴胡汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 浮大为阳，风在表也；□则为阴，风在里也。短气，腹满，胁下及心痛，风热壅于腹中而不通也。若寒客于内而痛者，按之则寒气散而痛止。此以风热内壅，故虽久按而气亦不通。阳明病，鼻干不得卧，自汗出者，邪在表也。此鼻干不得汗而嗜卧者，风热内攻，不干表也。一身面目悉黄，小便难，有潮热，时时哕者，风热攻于胃也。阳明之脉，出大迎，循颊车，上耳前，过客行人。热胜则肿，此风热在经，故耳前后肿。刺之，经气通，肿则小差。如此者，外证罢则可攻。若外证不解，虽过十日，脉续浮者，邪气犹在半表半里，与小柴胡汤以和解之。若其脉但浮而不□大，无诸里证者，是邪但在表也，可与麻黄汤以发其汗。若不尿，腹满加哕者，关格之疾也，故云不治。《难经》曰：关格者，不得尽其命而死。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 此为三阳合病之重证。脉弦为少阳，浮为太阳，大为阳明。腹满胁痛为少阳阳明并病，身目黄为湿热郁蒸，潮热为阳明实热。病过十日脉续浮说明邪仍在表里之间，用小柴胡汤和解。
    formulas:
      - SHL.SB.F.020
    symptom_tags:
      - SHL.SB.SYM.199
      - SHL.SB.SYM.059
      - SHL.SB.SYM.091
      - SHL.SB.SYM.149
      - SHL.SB.SYM.069
      - SHL.SB.SYM.028
      - SHL.SB.SYM.071
      - SHL.SB.SYM.150
    study_tags:
      - 三阳合病重证
      - 小柴胡汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.232
    no: 232
    text: 脉但浮，无余证者，与麻黄汤。若不尿，腹满加哕者，不治。
    translation: 脉象只是浮，没有其他证候的，给麻黄汤。如果小便不通，腹部胀满加上呃逆的，无法治疗。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 津液内竭，肠胃干燥，大便因硬。此非结热，故不可攻，宜以药外治而导引之。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉但浮无余证为纯表证，当用麻黄汤发汗解表。若不尿（小便不通）、腹满加哕，为三焦气化失常、胃气败绝，故不治。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.002
      - SHL.SB.SYM.091
      - SHL.SB.SYM.150
    study_tags:
      - 麻黄汤
      - 不治证
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.233
    no: 233
    text: 阳明病，自汗出，若发汗，小便自利者，此为津液内竭，虽硬不可攻之，当须自欲大便，宜蜜煎导而通之。若土瓜根及大猪胆汁，皆可为导。
    translation: 阳明病，自然出汗，如果又发汗，小便自然通利的，这是津液内竭，虽然大便硬也不可以攻下，应当等待患者自然想要大便时，适合用蜜煎导法来通便。如果土瓜根和大猪胆汁，都可以用来导便。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病脉迟汗出多，当责邪在里。以微恶寒，知表未解，与桂枝汤和表。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 自汗出又发汗、小便利，津液从汗和小便两途耗竭，肠中干燥故大便硬。此为津枯便秘，非腑实热结，故禁用攻下。当用润导法（蜜煎导、猪胆汁导）从局部润肠通便。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.143
    study_tags:
      - 津枯便秘
      - 蜜煎导法
      - 禁攻下
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.234
    no: 234
    text: 阳明病，脉迟，汗出多，微恶寒者，表未解也，可发汗，宜桂枝汤。
    translation: 阳明病，脉象迟，出汗多，微微怕冷的，是表证尚未解除，可以发汗，适合用桂枝汤。
    annotations:
