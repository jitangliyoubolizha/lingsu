  - id: SHL.SB.YM.215
    no: 215
    text: 阳明病，下之，其外有热，手足温，不结胸，心中懊憹，饥不能食，但头汗出者，栀子豉汤主之。
    translation: 阳明病，泻下后，体表还有发热，手足温暖，没有结胸证，心中懊恼烦闷，饥饿却不能进食，只是头部出汗的，用栀子豉汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 表未罢而下者，应邪热内陷也。热内陷者，则外热而无手足寒。今外有热而手足温者，热虽内陷，然而不深，故不作结胸也。心中懊憹饥不能食者，热客胸中，为虚烦也。热自胸中熏蒸于上，故但头汗出而身无汗。与栀子豉汤以吐胸中之虚烦。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后外有热、手足温为表邪未尽。不结胸排除水热互结。心中懊憹、饥不能食为余热郁于胸膈。但头汗出为郁热上蒸。栀子豉汤清宣郁热、除烦。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.067
      - SHL.SB.SYM.148
      - SHL.SB.SYM.068
    study_tags:
      - 下后虚烦
      - 栀子豉汤
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.216
    no: 216
    text: 阳明病，下血谵语者，此为热入血室，但头汗出者，刺期门，随其实而泻之，濈然汗出则愈。
    translation: 阳明病，下血并且谵语的，这是热邪进入血室，只是头部出汗的，针刺期门穴，随着实邪泻除，濈濈然出汗就会好。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病热入血室，迫血下行，使下血谵语。阳明病法多汗，以夺血者无汗，故但头汗出也。刺期门以散血室之热，随其实而泻之，以除阳明之邪热。散邪除热，荣卫得通，津液得复，濈然汗出而解。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下血谵语为热入血室、热迫血行、热扰心神。但头汗出为热郁不得外越。刺期门泻肝经实热，热去则汗出而愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.074
      - SHL.SB.SYM.033
      - SHL.SB.SYM.068
    study_tags:
