      - SHL.SB.SYM.059
      - SHL.SB.SYM.091
      - SHL.SB.SYM.149
      - SHL.SB.SYM.069
      - SHL.SB.SYM.028
      - SHL.SB.SYM.071
      - SHL.SB.SYM.150
    study_tags:
      - 三阳合病重证
      - 小柴胡汤
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.232
    no: 232
    text: 脉但浮，无余证者，与麻黄汤。若不尿，腹满加哕者，不治。
    translation: 脉象只是浮，没有其他证候的，给麻黄汤。如果小便不通，腹部胀满加上呃逆的，无法治疗。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉但浮无余证为纯表证，当用麻黄汤发汗解表。若不尿（小便不通）、腹满加哕，为三焦气化失常、胃气败绝，故不治。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.002
      - SHL.SB.SYM.091
      - SHL.SB.SYM.150
    study_tags:
      - 麻黄汤
      - 不治证
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.233
    no: 233
    text: 阳明病，自汗出，若发汗，小便自利者，此为津液内竭，虽硬不可攻之，当须自欲大便，宜蜜煎导而通之。若土瓜根及大猪胆汁，皆可为导。
    translation: 阳明病，自然出汗，如果又发汗，小便自然通利的，这是津液内竭，虽然大便硬也不可以攻下，应当等待患者自然想要大便时，适合用蜜煎导法来通便。如果土瓜根和大猪胆汁，都可以用来导便。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 自汗出又发汗、小便利，津液从汗和小便两途耗竭，肠中干燥故大便硬。此为津枯便秘，非腑实热结，故禁用攻下。当用润导法（蜜煎导、猪胆汁导）从局部润肠通便。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.143
    study_tags:
      - 津枯便秘
      - 蜜煎导法
      - 禁攻下
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.234
    no: 234
    text: 阳明病，脉迟，汗出多，微恶寒者，表未解也，可发汗，宜桂枝汤。
    translation: 阳明病，脉象迟，出汗多，微微怕冷的，是表证尚未解除，可以发汗，适合用桂枝汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉迟汗多微恶寒为表虚证未解（太阳中风证），虽有阳明证但表证为主，当先解表，用桂枝汤调和营卫。
    formulas:
