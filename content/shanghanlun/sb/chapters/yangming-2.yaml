  - id: SHL.SB.YM.235
    no: 235
    text: 阳明病，脉浮，无汗而喘者，发汗则愈，宜麻黄汤。
    translation: 阳明病，脉象浮，没有汗并且气喘的，发汗就会好，适合用麻黄汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮无汗喘为太阳伤寒表实证，虽有阳明证但表实为主，当用麻黄汤发汗解表。
