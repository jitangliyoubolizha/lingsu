        author: 成无己
        text: 阳明伤寒，表实，脉浮无汗而喘也。与麻黄汤以发汗。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉迟汗多微恶寒为表虚证未解（太阳中风证），虽有阳明证但表证为主，当先解表，用桂枝汤调和营卫。
    formulas:
