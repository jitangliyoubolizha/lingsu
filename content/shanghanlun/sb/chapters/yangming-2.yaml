  - id: SHL.SB.YM.213
    no: 213
    text: 阳明病，其人多汗，以津液外出，胃中燥，大便必硬，硬则谵语，小承气汤主之。若一服谵语止者，更莫复服。
    translation: 阳明病，患者出汗很多，因为津液外泄，胃中干燥，大便必然变硬，大便硬就会谵语，用小承气汤主治。如果服一次药后谵语停止的，就不要再服了。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 多汗则津液外泄，胃肠失润则大便硬，腑气不通、热扰心神则谵语。小承气汤轻下热结，中病即止。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.033
    study_tags:
      - 小承气汤
      - 中病即止
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.214
    no: 214
    text: 阳明病，谵语发潮热，脉滑而疾者，小承气汤主之。因与承气汤一升，腹中转气者，更服一升，若不转气者，勿更与之。明日又不大便，脉反微涩者，里虚也，为难治，不可更与承气汤也。
    translation: 阳明病，谵语发潮热，脉象滑而快的，用小承气汤主治。因此给承气汤一升，腹中气转动的，再服一升，如果不转气的，不要再给。第二天又不大便，脉象反而微弱涩滞的，是里虚，是难以治疗的，不可以再给承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 谵语潮热为阳明腑实，脉滑疾为实热内盛。腹中转气为药力已行、腑气将通。若不转气说明腑实不甚或正虚不能运药。明日不大便、脉微涩为正虚邪实、攻补两难，故难治。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.033
      - SHL.SB.SYM.071
      - SHL.SB.SYM.085
    study_tags:
      - 小承气汤
      - 脉象判断
      - 里虚难治
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.215
    no: 215
    text: 阳明病，下之，其外有热，手足温，不结胸，心中懊憹，饥不能食，但头汗出者，栀子豉汤主之。
    translation: 阳明病，泻下后，体表还有发热，手足温暖，没有结胸证，心中懊恼烦闷，饥饿却不能进食，只是头部出汗的，用栀子豉汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后外有热、手足温为表邪未尽。不结胸排除水热互结。心中懊憹、饥不能食为余热郁于胸膈。但头汗出为郁热上蒸。栀子豉汤清宣郁热、除烦。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
      - SHL.SB.SYM.001
      - SHL.SB.SYM.067
      - SHL.SB.SYM.148
      - SHL.SB.SYM.068
    study_tags:
      - 下后虚烦
      - 栀子豉汤
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.216
    no: 216
    text: 阳明病，下血谵语者，此为热入血室，但头汗出者，刺期门，随其实而泻之，濈然汗出则愈。
    translation: 阳明病，下血并且谵语的，这是热邪进入血室，只是头部出汗的，针刺期门穴，随着实邪泻除，濈濈然出汗就会好。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下血谵语为热入血室、热迫血行、热扰心神。但头汗出为热郁不得外越。刺期门泻肝经实热，热去则汗出而愈。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.074
      - SHL.SB.SYM.033
      - SHL.SB.SYM.068
    study_tags:
      - 热入血室
      - 刺期门
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.217
    no: 217
    text: 汗出谵语者，以有燥屎在胃中，此为风也。须下者，过经乃可下之。下之若早，语言必乱，以表虚里实故也。下之愈，宜大承气汤。
    translation: 出汗并且谵语的，是因为有燥屎在胃肠中，这是风邪入里的缘故。需要泻下的，必须表证解除后才可以泻下。如果泻下过早，语言必然会混乱，因为表虚里实的缘故。泻下后会好，适合用大承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗出谵语为阳明腑实、燥屎内结。此为风邪入里化热成实。须待表证解除后才可攻里，若下之过早则表邪内陷、正虚邪实而语言乱。表解后用大承气汤攻下则愈。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.033
    study_tags:
      - 大承气汤
      - 表解乃可攻里
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.218
    no: 218
    text: 伤寒四五日，脉沉而喘满，沉为在里，而反发其汗，津液越出，大便为难，表虚里实，久则谵语。
    translation: 伤寒病四五天，脉象沉并且气喘胀满，脉沉是病在里，却反而发汗，津液外泄，大便困难，表虚里实，时间长了就会谵语。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉沉喘满为里实证，当攻里不当发汗。误汗则津液外泄、胃肠更燥，大便难。表虚（汗出）里实（腑实），久则热扰心神而谵语。
    formulas: []
    symptom_tags:
      - SHL.SB.SYM.018
      - SHL.SB.SYM.091
      - SHL.SB.SYM.033
    study_tags:
      - 里实误汗
      - 表虚里实
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.219
    no: 219
    text: 三阳合病，腹满身重，难以转侧，口不仁，面垢，谵语遗尿。发汗则谵语，下之则额上生汗，手足逆冷。若自汗出者，白虎汤主之。
    translation: 三阳经同时发病，腹部胀满身体沉重，难以翻身转侧，口中不知味，面部油垢，谵语遗尿。发汗就会谵语加重，泻下就会额头出汗，手足冰冷。如果自然出汗的，用白虎汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 三阳合病以阳明热盛为主。腹满身重为热盛气滞，口不仁面垢为热蒸于上，谵语遗尿为热扰心神、膀胱失约。汗下皆不宜，白虎汤清泄阳明经热为正治。
    formulas:
      - SHL.SB.F.068
    symptom_tags:
      - SHL.SB.SYM.091
      - SHL.SB.SYM.045
      - SHL.SB.SYM.033
    study_tags:
      - 三阳合病
      - 白虎汤
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.220
    no: 220
    text: 二阳并病，太阳证罢，但发潮热，手足漐漐汗出，大便难而谵语者，下之则愈，宜大承气汤。
    translation: 太阳与阳明两经同时发病，太阳证已经解除，只是发潮热，手足微微出汗，大便困难并且谵语的，泻下就会好，适合用大承气汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阳证罢说明表邪已解，病全入阳明。潮热、手足汗出、大便难、谵语为阳明腑实典型证候，当用大承气汤攻下。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
