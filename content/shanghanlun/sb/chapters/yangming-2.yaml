  - id: SHL.SB.YM.228
    no: 228
    text: 阳明病下之，其外有热，手足温，不结胸，心中懊憹，饥不能食，但头汗出者，栀子豉汤主之。
    translation: 阳明病泻下后，体表还有发热，手足温暖，没有结胸证，心中懊恼烦闷，饥饿却不能进食，只是头部出汗的，用栀子豉汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病潮热，为胃实大便硬而小便数。今大便溏小便自可，则胃热未实而水谷不别也。大便溏者，应气降而胸胁满去，今反不去者，邪气犹在半表半里之间，与小柴胡汤以去表里之邪。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 下后外有热、手足温为表邪未尽入里。不结胸排除水热互结。心中懊憹、饥不能食为余热郁于胸膈。但头汗出为郁热上蒸不得外越。栀子豉汤清宣郁热。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
