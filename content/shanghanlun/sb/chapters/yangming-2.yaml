  - id: SHL.SB.YM.219
    no: 219
    text: 三阳合病，腹满身重，难以转侧，口不仁，面垢，谵语遗尿。发汗则谵语，下之则额上生汗，手足逆冷。若自汗出者，白虎汤主之。
    translation: 三阳经同时发病，腹部胀满身体沉重，难以翻身转侧，口中不知味，面部油垢，谵语遗尿。发汗就会谵语加重，泻下就会额头出汗，手足冰冷。如果自然出汗的，用白虎汤主治。
    annotations:
      - source: 伤寒论注
        author: 柯琴
        text: 此阳明半表里证也。里热而非里实，故当用白虎，而不当用承气。若妄汗则津竭而谵语，误下则亡阳而额汗出、手足厥也。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 夫里而不表，故不可汗，汗之则津亡，胃燥而谵语；热而不实，复不可下，下之则中伤气竭，而额上生汗，手足逆冷。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：三阳合病独取阳明——腹满身重、口不仁、面垢、谵语皆阳明经热炽盛之征，热而不实，故禁汗禁下而独取白虎辛寒清解。
    formulas:
      - SHL.SB.F.068
    symptom_tags:
      - SHL.SB.SYM.091
      - SHL.SB.SYM.045
      - SHL.SB.SYM.033
    study_tags:
      - 三阳合病
      - 白虎汤
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.YM.220
    no: 220
    text: 二阳并病，太阳证罢，但发潮热，手足漐漐汗出，大便难而谵语者，下之则愈，宜大承气汤。
    translation: 太阳与阳明两经同时发病，太阳证已经解除，只是发潮热，手足微微出汗，大便困难并且谵语的，泻下就会好，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 本太阳病并于阳明，名曰并病。太阳证罢，是无表证，但发潮热，是热并阳明。一身汗出为热越，今手足漐漐汗出，是热聚于胃也，必大便难而谵语。经曰：手足漐然而汗出者，必大便已硬也。与大承气汤以下胃中实热。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 太阳证罢说明表邪已解，病全入阳明。潮热、手足汗出、大便难、谵语为阳明腑实典型证候，当用大承气汤攻下。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.071
      - SHL.SB.SYM.004
      - SHL.SB.SYM.033
    study_tags:
