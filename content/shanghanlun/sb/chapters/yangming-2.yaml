  - id: SHL.SB.YM.226
    no: 226
    text: 若胃中虚冷，不能食者，饮水则哕。
    translation: 如果胃中虚冷，不能进食的，饮水就会呃逆。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 哕者，咳逆是也。《千金》曰：咳逆者，哕逆之名。胃中虚冷，得水则水寒相搏，胃气逆而哕。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 胃中虚冷则不能腐熟水谷，故不能食。饮水则水寒相搏、胃气上逆而哕。
