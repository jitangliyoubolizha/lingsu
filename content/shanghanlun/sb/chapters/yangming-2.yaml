  - id: SHL.SB.YM.217
    no: 217
    text: 汗出谵语者，以有燥屎在胃中，此为风也。须下者，过经乃可下之。下之若早，语言必乱，以表虚里实故也。下之愈，宜大承气汤。
    translation: 出汗并且谵语的，是因为有燥屎在胃肠中，这是风邪入里的缘故。需要泻下的，必须表证解除后才可以泻下。如果泻下过早，语言必然会混乱，因为表虚里实的缘故。泻下后会好，适合用大承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 胃中有燥屎，则谵语。以汗出为表未罢，故云风也。燥屎在胃，则当下。以表未和，则未可下。须过太阳经，无表证，乃可下之。若下之早，燥屎虽除，则表邪乘虚复陷于里，为表虚里实，胃虚热甚，语言必乱。与大承气汤，却下胃中邪热，则止。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗出谵语为阳明腑实、燥屎内结。此为风邪入里化热成实。须待表证解除后才可攻里，若下之过早则表邪内陷、正虚邪实而语言乱。表解后用大承气汤攻下则愈。
    formulas:
      - SHL.SB.F.112
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.033
    study_tags:
      - 大承气汤
      - 表解乃可攻里
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.218
    no: 218
    text: 伤寒四五日，脉沉而喘满，沉为在里，而反发其汗，津液越出，大便为难，表虚里实，久则谵语。
    translation: 伤寒病四五天，脉象沉并且气喘胀满，脉沉是病在里，却反而发汗，津液外泄，大便困难，表虚里实，时间长了就会谵语。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 邪气入内之时，得脉沉而喘满，里证具也，则当下之。反发其汗，令津液越出，胃中干燥，大便必难。久则屎燥胃实，必发谵语。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉沉喘满为里实证，当攻里不当发汗。误汗则津液外泄、胃肠更燥，大便难。表虚（汗出）里实（腑实），久则热扰心神而谵语。
    formulas: []
