  - id: SHL.SB.YM.213
    no: 213
    text: 阳明病，其人多汗，以津液外出，胃中燥，大便必硬，硬则谵语，小承气汤主之。若一服谵语止者，更莫复服。
    translation: 阳明病，患者出汗很多，因为津液外泄，胃中干燥，大便必然变硬，大便硬就会谵语，用小承气汤主治。如果服一次药后谵语停止的，就不要再服了。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 亡津液，胃燥，大便硬而谵语。虽无大热内结，亦须与小承气汤和其胃气。得一服谵语止，则胃燥以润，更莫复与承气汤，以本无实热故也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 多汗则津液外泄，胃肠失润则大便硬，腑气不通、热扰心神则谵语。小承气汤轻下热结，中病即止。
    formulas:
      - SHL.SB.F.113
    symptom_tags:
      - SHL.SB.SYM.004
      - SHL.SB.SYM.033
    study_tags:
      - 小承气汤
      - 中病即止
    notes: 第三批已补成无己公版注（2026-08-30）：引文待核对原书；项目自编注仍待校对。
  - id: SHL.SB.YM.214
    no: 214
    text: 阳明病，谵语发潮热，脉滑而疾者，小承气汤主之。因与承气汤一升，腹中转气者，更服一升，若不转气者，勿更与之。明日又不大便，脉反微涩者，里虚也，为难治，不可更与承气汤也。
    translation: 阳明病，谵语发潮热，脉象滑而快的，用小承气汤主治。因此给承气汤一升，腹中气转动的，再服一升，如果不转气的，不要再给。第二天又不大便，脉象反而微弱涩滞的，是里虚，是难以治疗的，不可以再给承气汤。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 阳明病，谵语，发潮热。若脉沉实者，内实者也，则可下。若脉滑疾，为里热未实，则不可下。先与小承气汤和之。汤入腹中，转失气者，中有燥屎，可更与小承气汤一升以除之。若不转失气者，是无燥屎，不可更与承气汤。至明日邪气传时，脉得沉实紧牢之类，是里实也。反得微涩者，里气大虚也。若大便利后脉微涩者，止为里虚而犹可。此不曽大便，脉反微涩，是正气内衰，为邪所胜，故云难治。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 谵语潮热为阳明腑实，脉滑疾为实热内盛。腹中转气为药力已行、腑气将通。若不转气说明腑实不甚或正虚不能运药。明日不大便、脉微涩为正虚邪实、攻补两难，故难治。
    formulas:
