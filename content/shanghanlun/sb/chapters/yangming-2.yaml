  - id: SHL.SB.YM.224
    no: 224
    text: 阳明病，汗出多而渴者，不可与猪苓汤，以汗多胃中燥，猪苓汤复利其小便故也。
    translation: 阳明病，出汗多并且口渴的，不可以给猪苓汤，因为汗多胃中干燥，猪苓汤又会通利小便的缘故。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 汗多渴为津液已伤，猪苓汤虽能滋阴但主要功效为利水，利小便则更伤津液，故禁用。当用白虎加人参汤清热生津。
