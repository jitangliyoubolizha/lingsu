  - id: SHL.SB.YM.227
    no: 227
    text: 脉浮发热，口干鼻燥，能食者则衄。
    translation: 脉象浮发热，口中干燥鼻腔干燥，能够进食的就会鼻出血。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 脉浮发热，口干鼻燥者，热在经也。能食者，里和也。热甚于经，迫血为衄。胃中虚冷，阴胜也。水入于经，其血乃成。饮水者助阴，气逆为哕。发热口干，阳胜也。食入于阴，长气于阳。能食者助阳，血妄为衄。三者，偏阴偏阳之疾也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮发热为表热，口干鼻燥为热伤上焦津液。能食说明胃气尚强、热在经不在腑。热在经络则迫血妄行，故衄。
    formulas: []
