  - id: SHL.SB.YM.223
    no: 223
    text: 若脉浮发热，渴欲饮水，小便不利者，猪苓汤主之。
    translation: 如果脉象浮发热，口渴想要饮水，小便不通利的，用猪苓汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 此下后客热客于下焦者也。邪气自表入里，客于下焦，三焦俱带热也。脉浮发热者，上焦热也。渴欲饮水者，中焦热也。小便不利者，邪客下焦，津液不得下通也。与猪苓汤，利小便以泻下焦之热也。
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 脉浮发热为表邪未尽或热郁于表，渴欲饮水为津伤，小便不利为水热互结。猪苓汤滋阴利水、清热生津。
    formulas:
