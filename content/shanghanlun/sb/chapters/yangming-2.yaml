      - 大承气汤
    notes: AI 初稿待校对。
  - id: SHL.SB.YM.221
    no: 221
    text: 阳明病，脉浮而紧，咽燥口苦，腹满而喘，发热汗出，不恶寒反恶热，身重。若发汗则躁，心愦愦反谵语。若加温针，必怵惕烦躁不得眠。若下之，则胃中空虚，客气动膈，心中懊憹，舌上胎者，栀子豉汤主之。
    translation: 阳明病，脉象浮而紧，咽喉干燥口苦，腹部胀满并且气喘，发热出汗，不怕冷反而怕热，身体沉重。如果发汗就会烦躁，心中烦乱反而谵语。如果加用温针，必然会恐惧烦躁不能入睡。如果泻下，就会导致胃中空虚，客气动膈，心中懊恼烦闷，舌上有苔的，用栀子豉汤主治。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 阳明经证（非腑实）见脉浮紧、咽燥口苦、腹满喘、身热汗出恶热。汗则伤津助热而躁谵，温针助热则怵惕不眠，下则伤胃致虚烦懊憹。误下后栀子豉汤清宣郁热。
    formulas:
      - SHL.SB.F.042
    symptom_tags:
