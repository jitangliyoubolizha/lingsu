  - id: SHL.SB.TYZ.053
    no: 53
    text: 病常自汗出者，此为荣气和。荣气和者，外不谐，以卫气不共荣气谐和故尔。以荣行脉中，卫行脉外。复发其汗，荣卫和则愈。宜桂枝汤。
    translation: 病人经常自汗出的，这是营气尚和。营气虽和，但卫外功能不协调，因为卫气不能与营气谐和。营行脉中，卫行脉外。再发其汗，营卫调和就会痊愈。适合用桂枝汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
