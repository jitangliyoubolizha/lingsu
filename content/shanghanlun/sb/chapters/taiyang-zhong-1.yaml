  - id: SHL.SB.TYZ.040
    no: 40
    text: 伤寒表不解，心下有水气，干呕发热而咳，或渴，或利，或噎，或小便不利、少腹满，或喘者，小青龙汤主之。
    translation: 伤寒表邪未解，心下又有水饮，出现干呕、发热、咳嗽，或口渴，或腹泻，或噎塞，或小便不利、小腹胀满，或气喘的，用小青龙汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 伤寒表不解，心下有水饮，则水寒相搏，肺寒气逆，故干呕发热而咳。针经曰：形寒饮冷则伤肺，以其两寒相感，中外皆伤，故气逆而上行，此之谓也。与小青龙汤发汗散水。水气内渍，则所传不一，故有或为之证，随证增损以解化之。
      - source: 伤寒贯珠集
        author: 尤怡
        text: 夫饮之为物，随气升降，无处不到，或壅于上，或积于中，或滞于下，各随其所之而为病。而其治法虽各有加减，要不出小青龙之一法。麻黄、桂枝散外入之寒邪，半夏、细辛、干姜消内积之寒饮。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：外寒里饮，小青龙汤解表化饮；诸「或」症示水饮走注无常，治以方后加减随证化裁，与 96 条小柴胡之或然证同一笔法。
    formulas:
