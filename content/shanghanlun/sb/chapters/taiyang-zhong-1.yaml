      - SHL.SB.SYM.018
    study_tags:
      - 麻黄汤证
    notes: 注解第一批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.036
    no: 36
    text: 太阳与阳明合病，喘而胸满者，不可下，宜麻黄汤。
    translation: 太阳与阳明合病，气喘而胸部胀满的，不可用泻下法，适合用麻黄汤。
