  - id: SHL.SB.TYZ.037
    no: 37
    text: 太阳病，十日以去，脉浮细而嗜卧者，外已解也；设胸满胁痛者，与小柴胡汤；脉但浮者，与麻黄汤。
    translation: 太阳病超过十天，脉浮细而喜欢躺卧的，是表邪已经解除；如果胸部胀满、胁部疼痛，给与小柴胡汤；如果脉只是浮的，给与麻黄汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 病程较长时根据脉证判断表解、少阳或表证未尽。
    formulas:
