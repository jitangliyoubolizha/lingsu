  - id: SHL.SB.TYZ.031
    no: 31
    text: 太阳病，项背强几几，无汗恶风，葛根汤主之。
    translation: 太阳病，颈项背部僵硬拘急不舒，无汗怕风的，用葛根汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 太阳病项背强，汗出恶风者，中风表虚也；项背强几几，无汗恶风者，中风表实也。表虚宜解肌，表实宜发汗，是以葛根汤发之也。
      - source: 伤寒论类方
        author: 徐大椿
        text: 前桂枝加葛根汤一条，其现症亦同，但彼云反汗出，故无麻黄；此云无汗，故加麻黄也。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：风寒外束、太阳经气不利，故项背强几几而无汗；葛根汤发汗解表、升津舒经，与桂枝加葛根汤之有汗相对。
    formulas:
      - SHL.SB.F.016
    symptom_tags:
      - SHL.SB.SYM.016
      - SHL.SB.SYM.024
      - SHL.SB.SYM.005
    study_tags:
      - 葛根汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
