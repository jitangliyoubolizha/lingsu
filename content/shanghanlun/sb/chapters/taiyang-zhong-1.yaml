  - id: SHL.SB.TYZ.034
    no: 34
    text: 太阳病，桂枝证，医反下之，利遂不止，脉促者，表未解也；喘而汗出者，葛根黄芩黄连汤主之。
    translation: 太阳病本属桂枝汤证，医生反而用泻下药，腹泻持续不止，脉促的，是表邪未解；气喘而汗出的，用葛根黄芩黄连汤主治。
    annotations:
      - source: 伤寒论注
        author: 柯琴
        text: 桂枝症，脉本弱，误下后而反促者，阳气重故也。邪束于表，阳扰于内，故喘而汗出。利遂不止者，所谓暴注下迫，皆属于热，与脉弱而协热下利不同。
      - source: 伤寒明理论
        author: 成无己
        text: 喘而汗出者，与葛根黄芩黄连汤以利之；汗出而喘者，与麻黄杏子甘草石膏汤以发之。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：协热下利——表证未解而里热下利，葛根芩连汤解表清里、坚阴止利；与 91 条里虚下利清谷之急当救里者，一清一温，相对而勘。
    formulas:
      - SHL.SB.F.018
    symptom_tags:
      - SHL.SB.SYM.021
      - SHL.SB.SYM.018
      - SHL.SB.SYM.004
      - SHL.SB.SYM.039
    study_tags:
      - 葛根黄芩黄连汤证
    notes: 注解第二批改写（2026-08-30，见 docs/注解参考资料/README.md）：公版引文待核对原书，现代观点为化用。
  - id: SHL.SB.TYZ.035
    no: 35
    text: 太阳病，头痛发热，身疼腰痛，骨节疼痛，恶风，无汗而喘者，麻黄汤主之。
    translation: 太阳病，头痛发热，身体疼痛、腰痛、骨节疼痛，怕风，无汗而气喘的，用麻黄汤主治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 此太阳伤寒也。寒则伤荣，头痛身痛腰痛，以至牵连骨节疼痛者，太阳经荣血不利也。
      - source: 伤寒论类方
        author: 徐大椿
        text: 此痛处比桂枝症尤多而重，因荣卫俱伤故也。恶风无汗而喘者，此二症乃肺气不舒之故。麻黄治无汗，杏仁治喘，桂枝、甘草治太阳诸症，无一味不紧切，所以谓之经方。
      - source: 参考《伤寒学》教材
        author: 灵素内容组
        text: 教材通行口径：本条主证后世称「麻黄八症」，病机为风寒束表、卫闭营郁、肺气失宣；辨证眼目在无汗而喘，与桂枝汤证之汗出相对，两方之别即在此分。
    formulas:
      - SHL.SB.F.019
    symptom_tags:
