  - id: SHL.SB.TYZ.050
    no: 50
    text: 脉浮紧者，法当身疼痛，宜以汗解之。假令尺中迟者，不可发汗。何以知然？以荣气不足，血少故也。
    translation: 脉浮紧的，按常规应当身体疼痛，适合用汗法解除。假如尺中脉迟，不可发汗。怎么知道呢？因为营气不足、血液偏少的缘故。
