  - id: SHL.SB.TYZ.046
    no: 46
    text: 太阳病，脉浮紧，无汗，发热，身疼痛，八九日不解，表证仍在，此当发其汗。服药已微除，其人发烦目瞑，剧者必衄，衄乃解。所以然者，阳气重故也。麻黄汤主之。
    translation: 太阳病，脉浮紧，无汗，发热，身体疼痛，八九天不解除，表证仍在，应当发汗。服药后病邪略微减轻，但病人出现心烦、闭目，严重的必定鼻出血，鼻出血后病就解除，这是因为阳气郁闭较重的缘故。麻黄汤主治。
    annotations:
