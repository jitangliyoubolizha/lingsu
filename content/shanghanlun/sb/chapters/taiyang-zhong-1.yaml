  - id: SHL.SB.TYZ.048
    no: 48
    text: 二阳并病，太阳初得病时，发其汗，汗先出不彻，因转属阳明，续自微汗出，不恶寒。若太阳病证不罢者，不可下，下之为逆，如此可小发汗。设面色缘缘正赤者，阳气怫郁在表，当解之熏之。若发汗不彻，不足言，阳气怫郁不得越，当汗不汗，其人躁烦，不知痛处，乍在腹中，乍在四肢，按之不可得，其人短气但坐，以汗出不彻故也，更发汗则愈。何以知汗出不彻？以脉涩故知也。
    translation: 太阳阳明并病，太阳病初起时发汗，汗出不透彻，因而转属阳明，继续微微汗出，不怕冷。如果太阳证不罢，不可泻下，误下是逆治，这时可以稍稍发汗。如果面色红赤，是阳气郁闭在表，应当用解表熏蒸的方法。如果发汗不透彻，阳气郁闭不能外越，应当出汗而没有出汗，病人烦躁，不知道痛处，时而在腹中，时而在四肢，按不到具体痛点，病人短气只能坐着，这是因为汗出不透彻，再发汗就会痊愈。怎么知道汗出不透彻？因为脉涩。
    annotations:
