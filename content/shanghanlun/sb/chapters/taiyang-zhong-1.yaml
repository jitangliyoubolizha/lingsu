  - id: SHL.SB.TYZ.049
    no: 49
    text: 脉浮数者，法当汗出而愈。若下之，身重心悸者，不可发汗，当自汗出乃解。所以然者，尺中脉微，此里虚，须表里实，津液自和，便自汗出愈。
    translation: 脉浮数的，按常规应当出汗而愈。如果误用泻下，出现身体沉重、心中悸动，不可再用发汗，应当等自行出汗而解。这是因为尺中脉微，属于里虚，必须表里之气充实、津液自和，才能自行出汗痊愈。
    annotations:
