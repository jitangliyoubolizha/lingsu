  - id: SHL.SB.TYZ.045
    no: 45
    text: 太阳病，先发汗不解，而复下之，脉浮者不愈。浮为在外，而反下之，故令不愈。今脉浮，故在外，当须解外则愈，宜桂枝汤。
    translation: 太阳病，先发汗未解，又用泻下，脉浮的仍不愈。浮主病在外，反而泻下，所以不愈。现在脉浮，说明病仍在表，应当解表则愈，适合用桂枝汤。
    annotations:
      - source: 项目自编（待校对）
        author: 灵素内容组
        text: 以脉浮判断邪仍在表，治当解外。
