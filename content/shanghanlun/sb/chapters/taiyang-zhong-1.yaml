      - 麻黄汤证
    notes: AI 初稿待校对。
  - id: SHL.SB.TYZ.038
    no: 38
    text: 太阳中风，脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者，大青龙汤主之。脉浮弱者，不可服之，服之则厥逆，筋惕肉瞤，此为逆也。
    translation: 太阳中风，脉浮紧，发热怕冷，身体疼痛，不出汗而烦躁的，用大青龙汤主治。脉浮弱的，不可服用；服后会出现手足厥冷、筋肉跳动，这是误治。
    annotations:
      - source: 注解伤寒论
        author: 成无己
        text: 今风寒两伤，则荣卫俱实，故不汗出而烦躁也。与大青龙汤，发汗以除荣卫风寒。
      - source: 伤寒来苏集
        author: 柯琴
        text: 此即加味麻黄汤也。诸症全是麻黄，而有喘与烦躁之不同：喘者是寒郁其气，升降不得自如，故多杏仁之苦以降气；烦躁是热伤其气，无津不能作汗，故特加石膏之甘以生津。
      - source: 参考《郝万山伤寒论讲稿》
        author: 灵素内容组
        text: 郝万山强调本条眼目在「不汗出而烦躁」——外寒闭表、内热扰心，故大青龙为发汗重剂，必表实兼里热方可与之；条末脉浮弱、汗出恶风者禁服，正恐过汗亡阳而筋惕肉瞤。
    formulas:
      - SHL.SB.F.021
    symptom_tags:
