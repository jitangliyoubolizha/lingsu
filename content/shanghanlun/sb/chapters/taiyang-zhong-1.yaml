  - id: SHL.SB.TYZ.033
    no: 33
    text: 太阳与阳明合病，不下利，但呕者，葛根加半夏汤主之。
    translation: 太阳与阳明合病，不下利，只有呕吐的，用葛根加半夏汤主治。
